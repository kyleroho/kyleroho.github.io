  // Current stage info box
  const cs2=STORY_STAGES[storyStage];

    ctx.fillStyle='#AA4400';ctx.font='14px monospace';ctx.fillText('100 HP · Phase 2 at 50% · Extremely aggressive',CW*.5,502);

  ctx.restore();

  ctx.strokeStyle='#FF6600';ctx.lineWidth=1.5;ctx.strokeRect(CW*.5-160,580,320,46);

  ctx.fillStyle='#FFCC44';ctx.font='bold 22px monospace';

  ctx.shadowBlur=28;ctx.shadowColor='#FF0000';ctx.fillStyle='#FF2222';ctx.font='bold 110px Georgia,serif';ctx.textAlign='center';ctx.fillText('GAME OVER',CW*.5,CH*.5-40);ctx.shadowBlur=0;
  ctx.fillStyle='#884444';ctx.font='22px monospace';ctx.fillText('No lives remaining. Your journey ends here... for now.',CW*.5,CH*.5+30);
  ctx.fillStyle='#666';ctx.font='18px monospace';ctx.fillText(`You reached: ${STORY_STAGES[storyStage].title}`,CW*.5,CH*.5+65);
  if(storyGameOverT>55){ctx.save();ctx.globalAlpha=0.5+Math.sin(storyGameOverT*0.14)*0.5;ctx.fillStyle='#FFCC44';ctx.font='bold 22px monospace';ctx.fillText('J — Restart Story  ·  ESC — Main Menu',CW*.5,CH-60);ctx.restore();}
  ctx.restore();
}

function drawStoryComplete(){
  storyCompleteT++;
  if(storyCompleteT<200&&storyCompleteT%4===0)burst(Math.random()*CW,Math.random()*CH*.6,5,['#FFD700','#FF6600','#FFF','#FF3300','#00FFCC','#4488FF'],(Math.random()-.5)*10,38,7);
  tickParticles();drawParticles();
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#0a0500');g.addColorStop(1,'#050000');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  const a=Math.min(1,storyCompleteT/40);ctx.save();ctx.globalAlpha=a;
  ctx.shadowBlur=32;ctx.shadowColor='#FFD700';ctx.fillStyle='#FFD700';ctx.font='bold 88px Georgia,serif';ctx.textAlign='center';ctx.fillText('STORY COMPLETE!',CW*.5,160);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(CW*.5-380,215,760,360);
  ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.strokeRect(CW*.5-380,215,760,360);
  ctx.fillStyle='#FFCC44';ctx.font='bold 24px Georgia,serif';ctx.fillText('— FROM THE CREATOR —',CW*.5,258);
  const lines=[
    '"The Prototype was my very first character sketch.',
    'I drew him before I even knew what this game would be.',
    'Nine chapters later, you finally met him. And you beat him.',
    '',
    'That means you saw everything I built — every stage,',
    'every fighter, every idea I was afraid to throw away.',
    '',
    'Thank you for playing Forge Fighters."',
  ];
  ctx.fillStyle='#BBAA88';ctx.font='18px Georgia,serif';
  lines.forEach((l,i)=>{ctx.fillText(l,CW*.5,298+i*32);});
  ctx.fillStyle='#FFCC44';ctx.font='bold 24px monospace';ctx.fillText(`Fighter used: ${CHARS[storyPlayerChar].name}`,CW*.5,580);
  if(storyCompleteT>90){ctx.save();ctx.globalAlpha=0.5+Math.sin(storyCompleteT*0.12)*0.5;ctx.fillStyle='#FFCC44';ctx.font='bold 22px monospace';ctx.fillText('J / Enter — Return to Menu',CW*.5,636);ctx.restore();}
  ctx.restore();
}

// ================================================================ DRAW: VICTORY
function drawVictory(){
  vicT++;
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#050000');g.addColorStop(1,'#150300');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);

  // Confetti burst at start
  if(vicT<180&&vicT%2===0){
    const cols=['#FF6600','#FFCC00','#FF3300','#44FF66','#4488FF','#FF44FF','#FFFFFF'];
    burst(Math.random()*CW,Math.random()*CH*.4,5,cols,(Math.random()-.5)*9,36,6);
  }
  tickParticles();drawParticles();

  // Winner name — centered, big, no character art
  ctx.save();
  const sc2=Math.min(1,vicT/30)*(1+Math.sin(vicT*.05)*.02);
  ctx.translate(CW*.5,CH*.35);ctx.scale(sc2,sc2);
  ctx.shadowBlur=36;
  if(winnerIdx>=0){
    ctx.shadowColor=fighters[winnerIdx].cfg.col;
    ctx.fillStyle=fighters[winnerIdx].cfg.col;
    ctx.font='bold 96px Georgia,serif';ctx.textAlign='center';
    ctx.fillText(fighters[winnerIdx].name.toUpperCase(),0,0);
    ctx.shadowColor='#FFCC00';ctx.fillStyle='#FFCC00';
    ctx.font='bold 48px Georgia,serif';
    ctx.fillText('WINS!',0,68);
  } else {
    ctx.shadowColor='#FFCC00';ctx.fillStyle='#FFCC00';
    ctx.font='bold 72px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('DRAW!',0,0);
  }
  ctx.shadowBlur=0;ctx.restore();

  // Results panel — pushed down so it doesn't overlap the name
  const panelY=CH*.5+40;
  ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(CW*.5-310,panelY,620,200);
  ctx.strokeStyle='#FF6600';ctx.lineWidth=2;ctx.strokeRect(CW*.5-310,panelY,620,200);
  ctx.fillStyle='#FF9944';ctx.font='bold 18px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('— MATCH RESULTS —',CW*.5,panelY+30);
  for(let i=0;i<fighters.length;i++){
    const f=fighters[i];
    const won=i===winnerIdx;
    const rowY=panelY+72+i*56;
    // Stock orbs on the LEFT of the row
    for(let s=0;s<4;s++){
      ctx.fillStyle=s<f.stocks?f.cfg.col:'#1a1a1a';
      ctx.beginPath();ctx.arc(CW*.5-285+s*20,rowY-8,7,0,6.28);ctx.fill();
      if(s<f.stocks){ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.arc(CW*.5-288+s*20,rowY-11,3,0,6.28);ctx.fill();}
    }
    // Name to the right of orbs
    ctx.fillStyle=won?f.cfg.col:'#888';
    ctx.font=won?'bold 18px monospace':'16px monospace';
    ctx.textAlign='left';
    ctx.fillText((won?'★  ':' ·  ')+f.name,CW*.5-195,rowY);
    // Stats on the right
    ctx.fillStyle='#CCC';ctx.textAlign='right';
    ctx.fillText(`Final %: ${~~f.dmg}%`,CW*.5+290,rowY);
  }
  if(vicT>55){
    ctx.save();ctx.globalAlpha=.55+Math.sin(vicT*.1)*.45;
    ctx.fillStyle='#FFCC44';ctx.font='bold 22px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('Press J or Enter to continue',CW*.5,CH-48);
    ctx.restore();
    if(jp['KeyJ']||jp['Enter'])phase='menu';
  }
}

// ================================================================ DRAW: OPTIONS
function drawOpts(){
  ctx.fillStyle='#080808';ctx.fillRect(0,0,CW,CH);
  ctx.shadowBlur=10;ctx.shadowColor='#FF6600';ctx.fillStyle='#FF9944';ctx.font='bold 46px Georgia,serif';ctx.textAlign='center';ctx.fillText('OPTIONS',CW*.5,95);ctx.shadowBlur=0;
  const items=[{label:'Stocks',val:stockCnt},{label:'Sound',val:sfxOn?'ON':'OFF'},{label:'← Back',val:''}];
  for(let i=0;i<items.length;i++){
    const y=250+i*80,sel=i===optSel;
    ctx.fillStyle=sel?'rgba(255,100,0,.2)':'rgba(255,255,255,.04)';ctx.fillRect(CW*.5-290,y-30,580,55);
    ctx.fillStyle=sel?'#FFCC00':'#AA7744';ctx.font=sel?'bold 28px Georgia,serif':'26px Georgia,serif';ctx.textAlign='left';ctx.fillText(items[i].label,CW*.5-240,y+8);ctx.textAlign='right';ctx.fillText(items[i].val,CW*.5+240,y+8);
    if(sel&&i<2){ctx.fillStyle='#555';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('◄ / ► to change',CW*.5,y+30);}
  }
  ctx.fillStyle='#444';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText('W/S navigate  ·  ESC back',CW*.5,CH-28);
}

// Menu silhouette runners
const MENU_RUNNERS=[];
function _tickMenuRunners(){
  if(MENU_RUNNERS.length<6&&Math.random()<0.012){
    const col=['#2288FF','#CC1100','#8833CC','#33AA33','#88AAFF','#FF8800','#BB1100'][~~(Math.random()*7)];
    MENU_RUNNERS.push({x:Math.random()<0.5?-80:CW+80,y:CH*0.55+Math.random()*CH*0.18,col,spd:(Math.random()*2+1.5)*(Math.random()<0.5?1:-1),t:0,sc:0.55+Math.random()*0.45});
  }
  for(let i=MENU_RUNNERS.length-1;i>=0;i--){
    const r=MENU_RUNNERS[i];r.x+=r.spd*2.2;r.t++;
    if(r.x<-120||r.x>CW+120)MENU_RUNNERS.splice(i,1);
  }
}
function _drawMenuRunners(){
  for(const r of MENU_RUNNERS){
    const facing=r.spd>0?1:-1;
    ctx.save();ctx.globalAlpha=0.13;
    ctx.translate(r.x,r.y);ctx.scale(r.sc*facing,r.sc);
    ctx.fillStyle=r.col;
    // Simple silhouette: head + body + legs
    ctx.beginPath();ctx.arc(0,-52,14,0,6.28);ctx.fill();
    ctx.fillRect(-12,-38,24,32);
    const legA=Math.sin(r.t*0.22)*0.5;
    ctx.save();ctx.translate(-7,0);ctx.rotate(legA);ctx.fillRect(-5,-2,10,26);ctx.restore();
    ctx.save();ctx.translate(7,0);ctx.rotate(-legA);ctx.fillRect(-5,-2,10,26);ctx.restore();
    const armA=Math.sin(r.t*0.22+Math.PI)*0.6;
    ctx.save();ctx.translate(-14,-28);ctx.rotate(armA);ctx.fillRect(-4,0,8,22);ctx.restore();
    ctx.save();ctx.translate(14,-28);ctx.rotate(-armA);ctx.fillRect(-4,0,8,22);ctx.restore();
    ctx.restore();
  }
}
function drawControls(){
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,CW,CH);
  ctx.shadowBlur=10;ctx.shadowColor='#FF6600';ctx.fillStyle='#FF9944';ctx.font='bold 46px Georgia,serif';ctx.textAlign='center';ctx.fillText('CONTROLS',CW*.5,60);ctx.shadowBlur=0;
  const P1=[['Move','A  /  D'],['Jump','W'],['Normal Attack','J'],['Special Attack','K'],['Shield (hold)','L'],['Emote','H'],['Special Move','S + J']];
  const P2=[['Move','← / →'],['Jump','↑'],['Normal Attack','Numpad 1'],['Special Attack','Numpad 2'],['Shield (hold)','Numpad 3'],['Emote','Numpad 0'],['Special Move','↓ + Numpad 1']];
  ctx.fillStyle='#3366FF';ctx.font='bold 24px Georgia,serif';ctx.textAlign='center';ctx.fillText('PLAYER 1',CW*.28,122);
  for(let i=0;i<P1.length;i++){const y=162+i*48;const sel=(i===5||i===6);ctx.fillStyle=sel?'rgba(255,160,0,0.1)':'rgba(255,255,255,0.03)';ctx.fillRect(CW*.05,y-22,CW*.44,40);ctx.fillStyle=sel?'#FFCC44':'#888';ctx.font='18px monospace';ctx.textAlign='left';ctx.fillText(P1[i][0],CW*.07,y);ctx.fillStyle=sel?'#FFDD77':'#FFCC44';ctx.textAlign='right';ctx.fillText(P1[i][1],CW*.47,y);}
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(CW*.5,110);ctx.lineTo(CW*.5,510);ctx.stroke();
  ctx.fillStyle='#FF3333';ctx.font='bold 24px Georgia,serif';ctx.textAlign='center';ctx.fillText('PLAYER 2',CW*.72,122);
  for(let i=0;i<P2.length;i++){const y=162+i*48;const sel=(i===5||i===6);ctx.fillStyle=sel?'rgba(255,160,0,0.1)':'rgba(255,255,255,0.03)';ctx.fillRect(CW*.52,y-22,CW*.44,40);ctx.fillStyle=sel?'#FFCC44':'#888';ctx.font='18px monospace';ctx.textAlign='left';ctx.fillText(P2[i][0],CW*.54,y);ctx.fillStyle=sel?'#FFDD77':'#FFCC44';ctx.textAlign='right';ctx.fillText(P2[i][1],CW*.96,y);}
  // S+J character list
  ctx.fillStyle='rgba(255,160,0,0.15)';ctx.fillRect(CW*.5-380,518,760,82);
  ctx.strokeStyle='#FF8800';ctx.lineWidth=1.5;ctx.strokeRect(CW*.5-380,518,760,82);
  ctx.fillStyle='#FF9944';ctx.font='bold 17px Georgia,serif';ctx.textAlign='center';ctx.fillText('~ S + J  SPECIAL MOVES (hold S/↓ then press J/Numpad1) ~',CW*.5,539);
  ctx.fillStyle='#BBAA88';ctx.font='14px monospace';ctx.textAlign='center';
  ctx.fillText('Kyle → Teleport behind foe   ·   Flip Master → Grab Combo   ·   Liam → Balloon Pop',CW*.5,562);
  ctx.fillText('Eli → Go Invisible   ·   Blue Guy → Spin Attack   ·   Most others → Ground Pound',CW*.5,582);
  ctx.fillStyle='#556';ctx.font='15px monospace';ctx.fillText('ESC during game — Quit to menu  ·  ESC here — Back',CW*.5,614);
  ctx.fillStyle='#FF9944';ctx.font='18px Georgia,serif';ctx.fillText('~ COMBAT TIPS ~',CW*.5,644);
  ctx.fillStyle='#AA7744';ctx.font='14px Georgia,serif';ctx.fillText('Higher damage % = more knockback!  ·  Ring-outs lose a stock!  ·  Hold Shield to block.',CW*.5,668);
  ctx.fillStyle='#444';ctx.font='13px monospace';ctx.fillText('ESC — Back',CW*.5,CH-14);
  if(jp['Escape'])phase='menu';
}

// ================================================================ MAIN LOOP
function loop(){
  ctx.clearRect(0,0,CW,CH);
  switch(phase){
    case'intro':    inputIntro();    drawIntro();       break;
    case'menu':     inputMenu();    drawMenu();       break;
    case'levelinput':inputLevelInput();drawLevelInput();break;
    case'charsel':  inputCharSel(); drawCharSel();    break;
    case'stagesel': inputStageSel();drawStageSel();   break;
    case'game':     inputGame();    updateGame();     drawGame(); break;
    case'victory':                  drawVictory();    break;
    case'opts':     inputOpts();    drawOpts();       break;
    case'controls':                 drawControls();   break;
    // Story mode phases
    case'storymap':     inputStoryMap();     drawStoryMap();     break;
    case'storytitle':   inputStoryTitle();   drawStoryTitle();   break;
    case'storyclear':   inputStoryClear();   drawStoryClear();   break;
    case'storyfail':    inputStoryFail();    drawStoryFail();    break;
    case'storygameover':inputStoryGameOver();drawStoryGameOver();break;
    case'storycomplete':inputStoryComplete();drawStoryComplete();break;
  }
  clearJP();
  requestAnimationFrame(loop);
}

let gTime2=0;
Object.defineProperty(window,'gTime',{get:()=>gTime2,set:v=>{gTime2=v;}});
gTime=0;
requestAnimationFrame(loop);
</script>
