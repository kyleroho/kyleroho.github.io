<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Fighters</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const CW=1280,CH=720;
canvas.width=CW;canvas.height=CH;
function resize(){const s=Math.min(innerWidth/CW,innerHeight/CH);canvas.style.width=CW*s+'px';canvas.style.height=CH*s+'px';}
resize();addEventListener('resize',resize);

// ---------------------------------------------------------------- INPUT
const keys={},jp={},jr={};
addEventListener('keydown',e=>{if(!keys[e.code])jp[e.code]=1;keys[e.code]=1;e.preventDefault();});
addEventListener('keyup',e=>{jr[e.code]=1;delete keys[e.code];});
const clearJP=()=>{for(const k in jp)delete jp[k];for(const k in jr)delete jr[k];};

// ---------------------------------------------------------------- AUDIO
let AC=null;
const initAudio=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}};
addEventListener('keydown',initAudio,{once:true});addEventListener('click',initAudio,{once:true});
let sfxOn=true;
function sfx(type){
  if(!AC||!sfxOn)return;
  try{
    const t=AC.currentTime;
    // Helper: play one osc layer
    const layer=(tp,f0,f1,dur,vol,detune=0)=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);
      o.type=tp;o.detune.value=detune;
      o.frequency.setValueAtTime(f0,t);
      if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur+0.04);
      o.start(t);o.stop(t+dur+0.06);
    };
    switch(type){
      case'hit':    layer('square',200,55,0.13,0.32);layer('sine',320,90,0.10,0.18,+8);break;
      case'bighit': layer('sawtooth',110,28,0.26,0.5);layer('square',200,50,0.18,0.28,-12);layer('sine',440,80,0.2,0.14,+6);shakeAmt=Math.max(shakeAmt,5);shakeT=Math.max(shakeT,8);break;
      case'jump':   layer('sine',320,620,0.09,0.18);layer('sine',480,800,0.07,0.08,+5);break;
      case'death':  layer('sine',880,45,0.55,0.36);layer('sawtooth',440,30,0.4,0.18,-10);layer('sine',220,15,0.6,0.1,+3);break;
      case'sel':    layer('sine',480,700,0.07,0.14);break;
      case'proj':   layer('sawtooth',440,200,0.2,0.11);layer('sine',600,250,0.15,0.07,+4);break;
      case'sp':     layer('sine',200,900,0.18,0.28);layer('sawtooth',150,600,0.14,0.16,-8);layer('sine',300,1100,0.12,0.1,+12);break;
      case'shield': layer('sine',1400,850,0.1,0.09);layer('sine',1800,1100,0.08,0.05,+5);break;
      case'win':    layer('sine',440,880,0.35,0.36);layer('sine',550,1100,0.28,0.22,+7);layer('sine',660,1320,0.2,0.14,+14);break;
      case'boss':   layer('sawtooth',80,40,0.8,0.55);layer('square',60,30,0.7,0.3,-8);break;
      case'introHit':layer('square',220,110,0.08,0.44);layer('sawtooth',180,60,0.1,0.22,-6);break;
      case'introSting':layer('sawtooth',120,600,0.35,0.42);layer('sine',180,800,0.28,0.24,+5);break;
      case'introWhoosh':layer('sine',900,150,0.18,0.22);break;
      case'roar':   layer('sawtooth',60,180,0.7,0.54);layer('square',45,120,0.6,0.28,-10);break;
      case'charge': layer('square',90,70,0.5,0.38);layer('sawtooth',70,55,0.45,0.18,-5);break;
      case'swell':  layer('sine',200,1200,0.5,0.32);layer('sine',250,1500,0.45,0.2,+7);break;
      case'logo':   layer('sawtooth',100,700,0.4,0.44);layer('sine',150,900,0.32,0.28,+8);break;
      case'land':   layer('sine',120,40,0.09,0.28);layer('square',80,25,0.07,0.14,-5);break;
      case'shieldbreak':layer('sawtooth',600,50,0.35,0.55);layer('sine',800,40,0.3,0.36,-8);layer('square',400,30,0.28,0.22,+10);break;
      default:      layer('sine',400,200,0.1,0.18);
    }
  }catch(e){}
}

// ---------------------------------------------------------------- PARTICLES
const particles=[];
let shakeAmt=0,shakeT=0;
class Particle{
  constructor(x,y,vx,vy,col,life,sz){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.col=col;this.life=this.ml=life;this.sz=sz;}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.11;this.vx*=.97;this.life--;}
  draw(){const a=this.life/this.ml;ctx.save();ctx.globalAlpha=a*.9;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,Math.max(.5,this.sz*a),0,6.28);ctx.fill();ctx.restore();}
}
function burst(x,y,n,cols,spd,life,sz){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=spd*(.4+Math.random()*.6);particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,cols[~~(Math.random()*cols.length)],life,sz));}}
function hitFX(x,y,big){if(big){burst(x,y,22,['#FF6600','#FFCC00','#FF3300','#FFF'],9,28,7);shakeAmt=9;shakeT=14;}else{burst(x,y,12,['#FFCC00','#FF8800','#FFF'],6,18,5);shakeAmt=5;shakeT=7;}}
function deathFX(x,y,col){burst(x,y,25,[col,'#FFF','#FF6600'],9,35,8);shakeAmt=12;shakeT=20;}
function tickParticles(){for(let i=particles.length-1;i>=0;i--){particles[i].tick();if(particles[i].life<=0)particles.splice(i,1);}if(shakeT>0){shakeT--;if(!shakeT)shakeAmt=0;}}
function drawParticles(){for(const p of particles)p.draw();}

// ---------------------------------------------------------------- PROJECTILES
class Projectile{
  constructor(x,y,vx,vy,r,dmg,kbx,kby,owner,col,type='ball'){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.r=r;this.dmg=dmg;this.kbx=kbx;this.kby=kby;
    this.owner=owner;this.col=col;this.type=type;this.life=160;this.dead=false;this.hitSet=new Set();
    this.angle=Math.atan2(vy,vx);this.flipDone=false;
  }
  tick(){
    this.x+=this.vx;this.y+=this.vy;this.angle=Math.atan2(this.vy,this.vx);
    if(this.type==='boomerang'){this.life--;if(this.life<80&&!this.flipDone){this.vx*=-1;this.flipDone=true;}}
    else{this.life--;}
    if(this.x<-250||this.x>CW+250||this.y<-250||this.y>CH+250||this.life<=0)this.dead=true;
  }
  draw(){
    ctx.save();ctx.fillStyle=this.col;
    if(this.type==='energy'){ctx.shadowBlur=18;ctx.shadowColor=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(this.x,this.y,this.r*.55,0,6.28);ctx.fill();}
    else if(this.type==='ball'){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.28);ctx.fill();ctx.fillStyle='rgba(255,200,0,.6)';ctx.beginPath();ctx.arc(this.x-this.r*.3,this.y-this.r*.3,this.r*.4,0,6.28);ctx.fill();}
    else if(this.type==='arrow'){ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.fillRect(-14,-2.5,28,5);ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(2,-6);ctx.lineTo(2,6);ctx.fill();}
    else if(this.type==='boomerang'){ctx.translate(this.x,this.y);ctx.rotate(gTime*0.018);ctx.fillRect(-11,-3,22,6);ctx.fillRect(-3,-11,6,22);}
    else if(this.type==='goofyface'){
      const r=this.r;ctx.translate(this.x,this.y);
      // Yellow circle face
      ctx.fillStyle='#FFCC00';ctx.strokeStyle='#000';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();ctx.stroke();
      // Left eye
      ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(-r*.28,-r*.22,r*.22,r*.28,0,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-r*.28-r*.08,-r*.22,r*.1,0,6.28);ctx.fill();
      // Right eye
      ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(r*.28,-r*.22,r*.22,r*.28,0,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(r*.28+r*.06,-r*.22+r*.1,r*.1,0,6.28);ctx.fill();
      // Crooked smile
      ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-r*.42,r*.1);ctx.quadraticCurveTo(-r*.05,r*.28,r*.42,r*.1);ctx.stroke();
      // Tongue
      ctx.fillStyle='#880022';ctx.beginPath();ctx.moveTo(-r*.08,r*.18);ctx.lineTo(-r*.08,r*.48);ctx.lineTo(r*.12,r*.48);ctx.lineTo(r*.12,r*.18);ctx.closePath();ctx.fill();
      // Stray line (goofy detail)
      ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-r*.42,r*.1);ctx.lineTo(r*.6,r*.05);ctx.stroke();
    }
    else{ctx.fillRect(this.x-this.r,this.y-this.r,this.r*2,this.r*2);}
    ctx.restore();
  }
  hits(f){
    if(f===this.owner||this.hitSet.has(f)||f.invincT>0)return false;
    if(f.state==='dead'||f.state==='spawn')return false;
    return Math.hypot(f.x+f.w/2-this.x,f.y+f.h/2-this.y)<this.r+Math.max(f.w,f.h)*.45;
  }
}

// ---------------------------------------------------------------- PHYSICS
const GRAV=0.45,TVEL=18,GFRIC=0.77,AFRIC=0.93;

// ---------------------------------------------------------------- FIGHTER BASE
class Fighter{
  constructor(cfg,x,y,idx){
    this.cfg=cfg;this.name=cfg.name;this.idx=idx;
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.w=cfg.w||50;this.h=cfg.h||65;
    this.facing=idx===0?1:-1;
    this.spd=cfg.spd||5;this.aspd=cfg.aspd||(cfg.spd*.75)||3.8;
    this.jp=cfg.jp||-14;this.wt=cfg.wt||100;this.maxJ=cfg.jumps||2;
    this.grav=cfg.grav||GRAV;this.pwr=cfg.pwr||1.0;
    this.grounded=false;this.jumpsLeft=this.maxJ;
    this.state='idle';this.stateT=0;
    this.stunT=0;this.atkCD=0;this.invincT=0;this.respawnT=0;
    this.dmg=0;this.stocks=3;
    this.hb=null;this.atkF=0;this.hitSet=new Set();
    this.shieldHP=100;this.animT=0;this.trail=[];this.emoteT=0;this.hitFlashT=0;
    this.isPrototype=false;
  }
  get cx(){return this.x+this.w*.5;}
  get cy(){return this.y+this.h*.5;}

  tick(platforms,fighters,projs){
    this.animT++;this.stateT++;
    if(this.state==='dead')return;
    if(this.state==='spawn'){if(--this.respawnT<=0)this.state='fall';return;}
    if(this.state==='grabbed')return;
    if(this.stunT>0)this.stunT--;if(this.atkCD>0)this.atkCD--;if(this.invincT>0)this.invincT--;if(this.emoteT>0)this.emoteT--;if(this.hitFlashT>0)this.hitFlashT--;
    if(!this.grounded||this.vy<0){this.vy+=this.grav;if(this.vy>TVEL)this.vy=TVEL;}
    if(this.hb){
      this.atkF++;
      const wx=this.x+this.w*.5+this.facing*this.hb.ox-this.hb.w*.5;
      const wy=this.y+this.h*.5+this.hb.oy-this.hb.h*.5;
      this.hb.wx=wx;this.hb.wy=wy;
      for(const fi of fighters){
        if(fi===this||this.hitSet.has(fi)||fi.invincT>0)continue;
        if(fi.state==='dead'||fi.state==='spawn')continue;
        const hb=wx<fi.x+fi.w&&wx+this.hb.w>fi.x&&wy<fi.y+fi.h&&wy+this.hb.h>fi.y;
        if(hb){
          this.hitSet.add(fi);
          if(fi.state==='shield'){fi.shieldHP-=this.hb.dmg*.35;this.vx=-this.facing*2.5;sfx('shield');}
          else{fi.takeHit(this.hb.dmg,this.facing*this.hb.kbx,this.hb.kby);hitFX(wx+this.hb.w*.5,wy+this.hb.h*.5,this.hb.dmg>10);sfx(this.hb.dmg>10?'bighit':'hit');}
        }
      }
      if(this.atkF>=this.hb.dur){this.hb=null;this.atkF=0;this.hitSet.clear();if(this.state==='atk'||this.state==='sp')this.state=this.grounded?'idle':'fall';}
    }
    this.x+=this.vx;this.y+=this.vy;
    const wasGrounded=this.grounded;
    this.grounded=false;
    for(const pl of platforms){
      const prevB=this.y+this.h-this.vy;
      if(this.vy>=0&&prevB<=pl.y&&this.y+this.h>=pl.y&&this.x+this.w>pl.x+3&&this.x<pl.x+pl.w-3){
        this.y=pl.y-this.h;this.vy=0;this.grounded=true;this.jumpsLeft=this.maxJ;
        // Landing puff — only if falling fast enough
        if(!wasGrounded&&this.vy===0){
          const speed=Math.abs(this.vy-TVEL*0.15);
          if(speed>2){
            const dustCol=['#CCCCCC','#BBBBBB','#DDDDDD'];
            const num=Math.min(8,~~(speed*0.7)+3);
            for(let d=0;d<num;d++){
              particles.push(new Particle(
                this.cx+(Math.random()-.5)*this.w*.7,pl.y,
                (Math.random()-.5)*3.5,-Math.random()*2.2,
                dustCol[~~(Math.random()*3)],22,Math.random()*5+3
              ));
            }
            if(speed>6)sfx('land');
          }
        }
        if(this.state==='fall'||this.state==='hit')this.state='idle';break;
      }
    }
    // Shield break
    if(this.state==='shield'&&this.shieldHP<=0){
      this.shieldHP=0;this.stunT=140;this.state='hit';
      this.vx=(Math.random()-.5)*6;this.vy=-8;
      burst(this.cx,this.cy,14,['#66AAFF','#AADDFF','#FFF'],6,22,5);
      sfx('shieldbreak');shakeAmt=Math.max(shakeAmt,7);shakeT=Math.max(shakeT,12);
    }
    if(this.grounded){if(this.state!=='hit'){this.vx*=GFRIC;if(Math.abs(this.vx)<.2)this.vx=0;}}else{this.vx*=AFRIC;}
    if((this.state==='idle'||this.state==='walk')&&!this.grounded)this.state=this.vy>0?'fall':'jump';
    if(this.state==='jump'&&this.vy>0)this.state='fall';
    if(this.state==='hit'&&this.stunT<=0)this.state=this.grounded?'idle':'fall';
    if(this.grounded&&(this.state==='idle'||this.state==='walk'))this.state=Math.abs(this.vx)>.4?'walk':'idle';
    if(this.state!=='shield')this.shieldHP=Math.min(100,this.shieldHP+.18);
    // Auto face nearest opponent during idle/walk (but not during attack or stun)
    if((this.state==='idle'||this.state==='walk')&&this.stunT===0&&this.atkCD===0){
      let nearestOpp=null,nearD=Infinity;
      for(const fi of fighters){
        if(fi===this||fi.state==='dead'||fi.state==='spawn')continue;
        const d=Math.abs(fi.cx-this.cx);
        if(d<nearD){nearD=d;nearestOpp=fi;}
      }
      if(nearestOpp)this.facing=nearestOpp.cx>this.cx?1:-1;
    }
    if((this.state==='atk'||this.state==='sp'||Math.abs(this.vx)>7)&&this.animT%3===0){this.trail.push({x:this.x,y:this.y,a:.55});if(this.trail.length>7)this.trail.shift();}
    for(const tr of this.trail)tr.a-=.08;
    this.trail=this.trail.filter(t=>t.a>0);
  }

  moveL(){if(this.stunT>25)return;const s=this.grounded?this.spd:this.aspd;this.vx=Math.max(-this.spd*(this.grounded?1:1.1),this.vx-s*.35);this.facing=-1;if(this.grounded&&this.state==='idle')this.state='walk';}
  moveR(){if(this.stunT>25)return;const s=this.grounded?this.spd:this.aspd;this.vx=Math.min(this.spd*(this.grounded?1:1.1),this.vx+s*.35);this.facing=1;if(this.grounded&&this.state==='idle')this.state='walk';}
  doJump(){if(this.jumpsLeft<=0||this.stunT>5)return;this.vy=this.jumpsLeft===this.maxJ?this.jp:this.jp*.82;this.jumpsLeft--;this.grounded=false;this.state='jump';sfx('jump');}
  doAtk(projs){if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=18;this.hb={ox:this.w*.5+2,oy:-2,w:38,h:28,dmg:7,kbx:4.5,kby:-2.5,dur:10};}
  doSp(projs){if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;this.state='sp';this.atkF=0;this.hitSet.clear();this.atkCD=36;this.hb={ox:this.w*.5-2,oy:-8,w:50,h:44,dmg:14,kbx:6.5,kby:-5.5,dur:18};sfx('sp');}
  doShield(){if(this.stunT>0)return;this.state='shield';}
  unShield(){if(this.state==='shield')this.state=this.grounded?'idle':'fall';}
  takeHit(dmg,kbx,kby){
    if(this.invincT>0)return;
    this.dmg+=dmg;
    const scale=.6+this.dmg/75;
    this.vx=kbx*scale*this.pwr;
    this.vy=kby*scale*this.pwr;
    this.stunT=14+~~(dmg*.95);
    this.state='hit';this.grounded=false;
    this.hitFlashT=8; // white flash frames
    // Combo tracking — find who hit me and update their combo
    const myIdx=fighters?fighters.indexOf(this):-1;
    if(myIdx>=0){
      const attIdx=1-myIdx; // simple 2-player assumption
      if(attIdx>=0&&attIdx<2){
        comboTimers[attIdx]=90; // reset combo window
        comboCounts[attIdx]++;
        if(comboCounts[attIdx]>=2){comboFlashT[attIdx]=70;}
      }
    }
  }
  spawnAt(stage){const sp=stage.spawns[this.idx%stage.spawns.length];this.x=sp.x;this.y=80;this.vx=0;this.vy=0;this.dmg=0;this.stunT=0;this.invincT=180;this.shieldHP=100;this.jumpsLeft=this.maxJ;this.hb=null;this.hitSet.clear();this.trail=[];this.state='spawn';this.respawnT=70;}
  oob(stage){const bz=stage.bz;return this.x+this.w<bz.l||this.x>bz.r||this.y>bz.b||this.y+this.h<bz.t;}
  doEmote(){if(this.emoteT>0||this.state==='dead'||this.state==='spawn')return;this.emoteT=120;sfx('sel');}
  // Base taunt — bounces up and down and flashes the character's color
  _drawTaunt(){
    const p=this.emoteT; // counts down 120→0
    const phase=120-p;   // counts up 0→120
    const bounce=Math.abs(Math.sin(phase*0.18))*14;
    const alpha=Math.min(1,p/12)*Math.min(1,phase/8);
    ctx.save();
    ctx.globalAlpha=alpha*(0.55+Math.sin(phase*0.35)*0.45);
    ctx.fillStyle=this.cfg.col;
    ctx.shadowBlur=22;ctx.shadowColor=this.cfg.col;
    ctx.font='bold 20px monospace';ctx.textAlign='center';
    ctx.fillText('!',this.cx,this.y-bounce-18);
    ctx.shadowBlur=0;
    ctx.restore();
  }

  draw(){
    if(this.state==='dead')return;
    // === 3D DROP SHADOW (Smash 64 style) ===
    if(curStage){
      let sY=this.y+this.h+600;
      for(const pl of curStage.plats){if(pl.x-10<this.cx&&pl.x+pl.w+10>this.cx&&pl.y>=this.y+this.h-2){if(pl.y<sY)sY=pl.y;}}
      const dist=sY-(this.y+this.h);
      const alpha=Math.max(0,0.4-dist*0.0009);
      const sx=Math.max(0.18,1-dist*0.003);
      if(alpha>0.01){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='rgba(0,0,0,0.88)';ctx.beginPath();ctx.ellipse(this.cx,sY,this.w*0.45*sx,5.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
    }
    // Trail
    for(const tr of this.trail){ctx.save();ctx.globalAlpha=tr.a*.45;ctx.fillStyle=this.cfg.col;ctx.fillRect(tr.x,tr.y,this.w,this.h);ctx.restore();}
    ctx.save();
    if(this.invincT>0&&Math.floor(this.invincT/4)%2===1)ctx.globalAlpha=.38;
    if(this.state==='shield'){
      const r=Math.max(0,44*(this.shieldHP/100));ctx.save();ctx.globalAlpha=.42;ctx.fillStyle='#66AAFF';ctx.beginPath();ctx.arc(this.cx,this.cy,r,0,6.28);ctx.fill();ctx.strokeStyle='#AADDFF';ctx.lineWidth=3;ctx.stroke();ctx.restore();
    }
    this.drawBody();
    // Hit flash — white overlay
    if(this.hitFlashT>0){
      ctx.save();ctx.globalAlpha=this.hitFlashT/8*0.85;
      ctx.fillStyle='#FFFFFF';ctx.fillRect(this.x-2,this.y-2,this.w+4,this.h+4);
      ctx.restore();
    }
    // === 3D SHADING OVERLAY (Smash 64 depth feel) ===
    ctx.save();
    const sg=ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.h);
    sg.addColorStop(0,'rgba(255,255,255,0.14)');sg.addColorStop(0.25,'rgba(255,255,255,0.03)');

class Liam extends Fighter{
  constructor(x,y,idx){
    super({name:'Liam',col:'#8833CC',w:42,h:57,spd:5,aspd:4.5,jp:-14,wt:76,pwr:.92,jumps:2,grav:.41},x,y,idx);

  }
  drawBody(){
    const f=this.facing,t=this.animT;
    if(this.balloonPhase==='inflate'||this.balloonPhase==='puffed'||this.balloonPhase==='pop'){
      // how inflated are we? 0→1
      const prog=this.balloonPhase==='puffed'?1:this.balloonPhase==='pop'?1:Math.min(1,this.balloonT/60);
      const bScale=1+prog*1.8; // grows up to 2.8x
      const wobble=this.balloonPhase==='puffed'?Math.sin(t*.18)*.04:0;
      const bw=this.baseW*bScale*(1+wobble);
      const bh=this.baseH*bScale*(1-wobble*.5);
      const bx=this.cx-bw*.5;
      const by=this.y+this.baseH-bh; // anchor feet to ground level

      // balloon body gradient
      ctx.save();
      const grad=ctx.createRadialGradient(bx+bw*.35,by+bh*.3,2,bx+bw*.5,by+bh*.5,bw*.72);
      grad.addColorStop(0,'#EE99FF');grad.addColorStop(0.5,'#AA44EE');grad.addColorStop(1,'#6600BB');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.ellipse(bx+bw*.5,by+bh*.5,bw*.5,bh*.5,0,0,6.28);ctx.fill();
      // shine

      // face (squished as it inflates)
      const faceX=bx+bw*.5;const faceY=by+bh*.42;
      const eOff=bw*.14;
      // bulging eyes
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(faceX-eOff,faceY,bw*.09,0,6.28);ctx.fill();
      ctx.fillStyle='white';ctx.beginPath();ctx.arc(faceX+eOff,faceY,bw*.09,0,6.28);ctx.fill();
      ctx.fillStyle='#3322FF';ctx.beginPath();ctx.arc(faceX-eOff+(f>0?1:-1),faceY,bw*.045,0,6.28);ctx.fill();
      ctx.fillStyle='#3322FF';ctx.beginPath();ctx.arc(faceX+eOff+(f>0?1:-1),faceY,bw*.045,0,6.28);ctx.fill();
      // puffed cheeks
      if(prog>0.4){const ca=prog*.7;ctx.save();ctx.globalAlpha=ca*.55;ctx.fillStyle='#FF99CC';ctx.beginPath();ctx.arc(faceX-bw*.32,faceY+bh*.06,bw*.14,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(faceX+bw*.32,faceY+bh*.06,bw*.14,0,6.28);ctx.fill();ctx.restore();}
      // mouth — O shape when puffed
      ctx.strokeStyle='#440022';ctx.lineWidth=2;ctx.fillStyle='#880033';
      if(prog>0.5){ctx.beginPath();ctx.ellipse(faceX,faceY+bh*.18,bw*.08,bh*.06,0,0,6.28);ctx.fill();}
      else{ctx.beginPath();ctx.arc(faceX,faceY+bh*.12,bw*.06,0,Math.PI);ctx.stroke();}
      // knot at bottom
      ctx.fillStyle='#6600BB';ctx.beginPath();ctx.arc(bx+bw*.5,by+bh*.98,bw*.06,0,6.28);ctx.fill();
      // string
      ctx.strokeStyle='#9944CC';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx+bw*.5,by+bh);ctx.lineTo(bx+bw*.5+Math.sin(t*.12)*8,by+bh+18);ctx.stroke();
      ctx.restore();
      return;

      ctx.fillStyle='#FFCC99';ctx.beginPath();ctx.arc(this.cx,this.y+this.h*.3,this.baseW*.28,0,6.28);ctx.fill();
      ctx.restore();
      return;
    }
    // normal draw
    if(this.state==='atk'){ctx.save();ctx.globalAlpha=.33;ctx.fillStyle='#CC44FF';ctx.beginPath();ctx.arc(this.cx,this.cy,55,0,6.28);ctx.fill();ctx.restore();}
    ctx.fillStyle='#AA77FF';ctx.fillRect(this.x,this.y+this.h*.32,this.w,this.h*.68);
    ctx.fillStyle='#FFCC99';ctx.beginPath();ctx.arc(this.x+this.w*.5,this.y+this.h*.18,this.w*.5,0,6.28);ctx.fill();
    ctx.fillStyle='#443300';ctx.fillRect(this.x+4,this.y,this.w-8,this.h*.12);ctx.beginPath();ctx.arc(this.x+this.w*.5,this.y+4,this.w*.5,Math.PI,0);ctx.fill();
    const eX=this.x+this.w*.5+(f>0?-8:2);
    ctx.fillStyle='#3322FF';ctx.beginPath();ctx.arc(eX,this.y+this.h*.17,3.5,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(eX+10,this.y+this.h*.17,3.5,0,6.28);ctx.fill();
    ctx.fillStyle='#FFEE00';const sa=t*.06;ctx.beginPath();ctx.arc(this.cx+Math.cos(sa)*28,this.y-16+Math.sin(sa)*9,5.5,0,6.28);ctx.fill();

      this.balloonT++;
      this.vy-=0.25; // float upward while inflating
      if(this.balloonT>=60)this.balloonPhase='puffed';
    }
    else if(this.balloonPhase==='puffed'){
      this.balloonT++;
      this.vy-=0.18;
      if(this.balloonT>=90){this._doPop(projs);}
    }
    else if(this.balloonPhase==='pop'){
      this.balloonT++;
      if(this.balloonT>=10){
        this.balloonPhase='fall';this.balloonT=0;

    else if(this.balloonPhase==='fall'){

  _drawTaunt(){
    const phase=120-this.emoteT;
    const a=Math.min(1,this.emoteT/12)*Math.min(1,phase/8);
    ctx.save();ctx.globalAlpha=a;

// ================================================================ BOSS AI — HARDEST DIFFICULTY
class BossAI{
  constructor(fighter){this.f=fighter;this.thinkT=0;this.strat='chase';this.stratT=0;}
  tick(fighters,platforms,projs){
    const me=this.f;
    if(me.state==='dead'||me.state==='spawn')return;
    this.thinkT++;
    const speed=me.bossPhase===2?2:4;
    if(this.thinkT<speed)return;
    this.thinkT=0;
    // Find target
    let tgt=null;
    for(const fi of fighters){if(fi!==me&&fi.state!=='dead'&&!fi.isPrototype){tgt=fi;break;}}
    if(!tgt)return;
    const dx=tgt.cx-me.cx,dy=tgt.cy-me.cy,dist=Math.hypot(dx,dy);
    const e=me.bossPhase===2,ag=e?1.65:1.0;
    // Rotate strategy
    this.stratT++;
    if(this.stratT>70){this.stratT=0;const r=Math.random();this.strat=r<0.45?'chase':r<0.7?'projectile':'blitz';}
    // Recovery
    if(me.y>560||me.x<55||me.x>CW-55){(dx>0?me.moveR():me.moveL());if(me.jumpsLeft>0)me.doJump();return;}
    // Dodge incoming projectiles
    for(const pr of projs){
      if(pr.owner===me)continue;
      if(Math.abs(pr.x-me.cx)<200&&Math.abs(pr.y-me.cy)<75){
        pr.x<me.cx?me.moveR():me.moveL();
        if(!me.grounded&&Math.random()<0.45)me.doJump();return;
      }
    }
    if(this.strat==='projectile'&&dist>130){
      if(me.atkCD===0&&dist<380)me.doSp(projs);
      if(dist<170){dx>0?me.moveL():me.moveR();}else{dx>0?me.moveR():me.moveL();}
    } else {
      if(dist>65){dx>0?me.moveR():me.moveL();if(dy<-65&&me.grounded&&Math.random()<0.5*ag)me.doJump();if(Math.abs(dy)<55&&Math.abs(dx)<85&&Math.random()<0.3*ag)me.doJump();}
      if(dist<120&&me.atkCD===0){const r=Math.random();if(r<0.42*ag)me.doAtk(projs);else if(r<0.62*ag)me.doSp(projs);}
      if(!me.grounded&&dist<240&&me.atkCD===0&&Math.random()<0.32*ag)me.doSp(projs);
    }
    if(e){
      if(dist<85&&me.atkCD===0&&Math.random()<0.65)me.doAtk(projs);
      if(dist<320&&me.atkCD===0&&Math.random()<0.28)me.doSp(projs);
    }
    if(dx>0)me.moveR();else me.moveL();
  }
}

// ---------------------------------------------------------------- ZAPNOODLE
class Zapnoodle extends Fighter{
  constructor(x,y,idx){
    super({name:'Zapnoodle',col:'#FFEE00',w:36,h:62,spd:6.5,aspd:5.5,jp:-16,wt:68,pwr:.9,jumps:3,grav:.38},x,y,idx);
    this.zapT=0; // zap trail timer
  }
  drawBody(){
    const f=this.facing,t=this.animT;
    // long noodle body — squiggly segments
    const seg=8,segH=this.h/seg;
    ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';
    // glow
    ctx.shadowBlur=14;ctx.shadowColor='#FFEE00';
    ctx.strokeStyle='#FFEE00';
    ctx.beginPath();
    for(let i=0;i<=seg;i++){
      const sy=this.y+i*segH;
      const sx=this.cx+(i%2===0?0:f*6)+Math.sin(t*.14+i)*(this.state==='walk'||this.state==='jump'?4:1.5);
      i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    ctx.shadowBlur=0;
    // inner yellow
    ctx.lineWidth=6;ctx.strokeStyle='#FFFAAA';
    ctx.beginPath();
    for(let i=0;i<=seg;i++){
      const sy=this.y+i*segH;
      const sx=this.cx+(i%2===0?0:f*6)+Math.sin(t*.14+i)*(this.state==='walk'||this.state==='jump'?4:1.5);
      i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    // head — round with lightning bolt eyes
    ctx.shadowBlur=10;ctx.shadowColor='#FFEE00';
    ctx.fillStyle='#FFEE00';ctx.beginPath();ctx.arc(this.cx,this.y+8,12,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(this.cx+(f>0?-4:2),this.y+7,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(this.cx+(f>0?4:10),this.y+7,4,0,6.28);ctx.fill();
    // zap pupils
    ctx.fillStyle='#FF8800';
    ctx.beginPath();ctx.arc(this.cx+(f>0?-4:2),this.y+8,2,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(this.cx+(f>0?4:10),this.y+8,2,0,6.28);ctx.fill();
    // lightning bolt on forehead
    ctx.fillStyle='#FF8800';ctx.strokeStyle='#FF4400';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(this.cx+1,this.y-3);ctx.lineTo(this.cx-3,this.y+2);ctx.lineTo(this.cx,this.y+2);ctx.lineTo(this.cx-2,this.y+7);ctx.lineTo(this.cx+4,this.y+1);ctx.lineTo(this.cx+1,this.y+1);ctx.closePath();ctx.fill();ctx.stroke();
    // zap sparks when attacking
    if(this.state==='atk'||this.state==='sp'){
      ctx.shadowBlur=12;ctx.shadowColor='#FFFF00';
      for(let i=0;i<4;i++){const a=t*.3+i*1.57;const r=20+Math.sin(t*.2+i)*6;ctx.fillStyle=i%2?'#FFFF00':'#FF8800';ctx.beginPath();ctx.arc(this.cx+Math.cos(a)*r,this.cy+Math.sin(a)*r,3,0,6.28);ctx.fill();}
      ctx.shadowBlur=0;
    }
  }
  doAtk(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // electric lash — wide short-range zap
    this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=16;
    this.hb={ox:this.w*.5-4,oy:-18,w:52,h:52,dmg:7,kbx:4,kby:-3.5,dur:10};
    burst(this.cx+this.facing*28,this.cy,6,['#FFEE00','#FFFAAA','#FF8800'],5,12,4);
    sfx('hit');
  }
  doSp(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // fire a zigzag lightning bolt projectile
    const p=new Projectile(this.x+(this.facing>0?this.w+4:-18),this.y+this.h*.2,this.facing*14,0,13,13,5.5,-4,this,'#FFEE00','energy');
    p.zapPhase=0;
    projs.push(p);
    this.atkCD=42;
    burst(this.cx,this.cy,10,['#FFEE00','#FFFAAA','#FF8800'],7,18,5);
    sfx('sp');
  }
  _drawTaunt(){
    const phase=120-this.emoteT;
    const a=Math.min(1,this.emoteT/12)*Math.min(1,phase/8);
    ctx.save();ctx.globalAlpha=a;
    // wild electric sparks flying off body
    const numSparks=6;
    for(let i=0;i<numSparks;i++){
      const ang=phase*0.22+i*(Math.PI*2/numSparks);
      const r=18+Math.sin(phase*0.3+i*1.3)*10;
      const sx=this.cx+Math.cos(ang)*r;
      const sy=this.cy+Math.sin(ang)*r*0.7;
      ctx.strokeStyle=i%2?'#FFEE00':'#FF8800';ctx.lineWidth=2;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(sx,sy);
      ctx.lineTo(sx+Math.cos(ang+0.8)*9,sy+Math.sin(ang+0.8)*9);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
    if(phase>14&&phase<106){
      const ta=Math.min(1,(phase-14)/14)*Math.min(1,(106-phase)/12);
      ctx.globalAlpha=a*ta;
      ctx.shadowBlur=16;ctx.shadowColor='#FFEE00';
      ctx.fillStyle='#FFFF88';ctx.font='bold 22px Georgia,serif';ctx.textAlign='center';
      ctx.fillText('ZAP ZAP ZAP!',this.cx,this.y-22);
      ctx.shadowBlur=0;
    }
    ctx.restore();
  }
}

// ---------------------------------------------------------------- SIR STUMBLES
class SirStumbles extends Fighter{
  constructor(x,y,idx){
    super({name:'Sir Stumbles',col:'#CC8844',w:54,h:70,spd:3.5,aspd:2.8,jp:-11.5,wt:130,pwr:1.45,jumps:2,grav:.52},x,y,idx);
    this.stumbleDir=1;this.stumbleT=0;
  }
  drawBody(){
    const f=this.facing,t=this.animT;
    const tilt=(this.state==='walk'||this.state==='hit')?Math.sin(t*.18)*.12:Math.sin(t*.06)*.05;
    ctx.save();ctx.translate(this.cx,this.y+this.h);ctx.rotate(tilt);
    // boots
    ctx.fillStyle='#553300';ctx.fillRect(-this.w*.5+2,- 14,20,14);ctx.fillRect(this.w*.5-22,-14,20,14);
    // legs — slightly bowed
    ctx.fillStyle='#884422';ctx.fillRect(-this.w*.5+5,-32,18,22);ctx.fillRect(this.w*.5-23,-32,18,22);
    // belly — big round pot belly
    ctx.fillStyle='#CC8844';ctx.beginPath();ctx.ellipse(0,-this.h*.48,this.w*.52,this.h*.38,0,0,6.28);ctx.fill();
    // arms
    const armSwing=Math.sin(t*.12)*(this.state==='walk'?0.4:0.1);
    ctx.fillStyle='#CC8844';
    ctx.save();ctx.translate(-this.w*.5+4,-this.h*.5);ctx.rotate(-armSwing);ctx.fillRect(-8,0,14,28);ctx.fillStyle='#FFCC99';ctx.fillRect(-9,26,16,12);ctx.restore();
    ctx.save();ctx.translate(this.w*.5-4,-this.h*.5);ctx.rotate(armSwing);ctx.fillRect(-6,0,14,28);ctx.fillStyle='#FFCC99';ctx.fillRect(-7,26,16,12);ctx.restore();
    // head
    ctx.fillStyle='#FFCC99';ctx.beginPath();ctx.arc(0,-this.h*.72,this.w*.38,0,6.28);ctx.fill();
    // big bushy moustache
    ctx.fillStyle='#664422';ctx.beginPath();ctx.ellipse(f>0?-6:6,-this.h*.65,14,6,-0.2,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(f>0?6:-6,-this.h*.65,14,6,0.2,0,6.28);ctx.fill();
    // eyes — wobbly
    const eyeWobble=this.stunT>0?Math.sin(t*.4)*3:0;
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(f>0?-8:0,-this.h*.77+eyeWobble,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(f>0?4:12,-this.h*.77-eyeWobble,4,0,6.28);ctx.fill();
    // monocle
    ctx.strokeStyle='#AA8800';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(f>0?-8:0,-this.h*.77+eyeWobble,7,0,6.28);ctx.stroke();
    // top hat
    ctx.fillStyle='#221100';ctx.fillRect(-16,-this.h-.5,32,9);ctx.fillRect(-11,-this.h-30,22,32);
    ctx.fillStyle='#332211';ctx.fillRect(-11,-this.h-30,22,8);
    ctx.restore();
  }
  tick(platforms,fighters,projs){
    // Sir Stumbles randomly wobbles direction while walking
    this.stumbleT++;
    if(this.stumbleT>45&&this.grounded&&this.state==='walk'){
      if(Math.random()<0.18){this.vx+=(Math.random()-.5)*3;this.stumbleT=0;}
    }
    super.tick(platforms,fighters,projs);
  }
  doAtk(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // Big wild haymaker — slow but huge
    this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=26;
    this.vx+=this.facing*4;
    this.hb={ox:this.w*.5-2,oy:-22,w:60,h:52,dmg:14,kbx:7,kby:-4,dur:16};
    sfx('bighit');
  }
  doSp(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // Stumble Charge — lurches forward dealing heavy damage on contact
    this.state='sp';this.atkF=0;this.hitSet.clear();this.atkCD=52;
    this.vx=this.facing*16;this.vy=-3;
    this.hb={ox:-10,oy:-8,w:this.w+20,h:this.h+8,dmg:20,kbx:9,kby:-6,dur:22};
    burst(this.cx,this.cy,12,['#CC8844','#FFCC99','#FFAA44'],7,20,6);
    sfx('sp');
  }
  _drawTaunt(){
    const phase=120-this.emoteT;
    const a=Math.min(1,this.emoteT/12)*Math.min(1,phase/8);
    // big belly bounce laugh
    const laugh=Math.abs(Math.sin(phase*0.22))*10;
    ctx.save();ctx.globalAlpha=a;
    ctx.translate(0,-laugh*0.5);
    // hat flying up and down
    const hatBounce=Math.abs(Math.sin(phase*0.22))*14;
    ctx.fillStyle='#221100';
    ctx.fillRect(this.cx-16,this.y-hatBounce-32,32,9);
    ctx.fillRect(this.cx-11,this.y-hatBounce-58,22,28);
    ctx.fillStyle='#332211';ctx.fillRect(this.cx-11,this.y-hatBounce-58,22,8);
    if(phase>16&&phase<108){
      const ta=Math.min(1,(phase-16)/14)*Math.min(1,(108-phase)/12);
      ctx.globalAlpha=a*ta;
      ctx.fillStyle='#FFCC99';ctx.shadowBlur=10;ctx.shadowColor='#CC8844';
      ctx.font='bold 24px Georgia,serif';ctx.textAlign='center';
      ctx.fillText('HA HA HA!',this.cx,this.y-64-hatBounce);
      ctx.shadowBlur=0;
    }
    ctx.restore();
  }
}

// ================================================================ STAGE RENDERING
let bgT=0;
function renderStage(stage){
  bgT++;
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,stage.bg[0]);g.addColorStop(1,stage.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  switch(stage.theme){
    case'forge':_bgForge();break;case'toy':_bgToy();break;case'sky':_bgSky();break;
    case'forest':_bgForest();break;case'lava':_bgLava();break;case'city':_bgCity();break;
    case'desert':_bgDesert();break;case'ice':_bgIce();break;case'final':_bgFinal();break;
    case'tower':_bgTower();break;case'rocket':_bgRocket();break;
  }
  for(const pl of stage.plats)_drawPlat(pl,stage.theme);
  for(const hz of stage.hazards||[])_drawHazard(hz);
}

function _drawPlat(pl,theme){

// ================================================================ AI CONTROLLER
class AICtrl{
  constructor(fighter,diff){
    this.f=fighter;this.diff=diff;this.thinkI=[30,18,10,5][diff];this.thinkT=0;
    this.rand=[.75,.42,.2,.06][diff];this.atkRng=[120,95,75,60][diff];
    this.jpChance=[.18,.38,.6,.8][diff];this.spChance=[.08,.18,.32,.5][diff];this.shChance=[.05,.14,.3,.52][diff];
  }
  tick(fighters,platforms,projs){
    const me=this.f;
    if(me.state==='dead'||me.state==='spawn')return;
    this.thinkT++;if(this.thinkT<this.thinkI)return;this.thinkT=0;
    let tgt=null,bestD=Infinity;
    for(const fi of fighters){if(fi===me||fi.state==='dead'||fi.state==='spawn')continue;const d=Math.hypot(fi.cx-me.cx,fi.cy-me.cy);if(d<bestD){bestD=d;tgt=fi;}}
    if(!tgt)return;
    const dx=tgt.cx-me.cx,dy=tgt.cy-me.cy,dist=Math.hypot(dx,dy);

    // Directional influence — if launched hard, try to survive by jumping
    if(me.state==='hit'&&me.vy<-6&&me.jumpsLeft>0&&Math.random()<[.1,.3,.6,.9][this.diff]){
      me.doJump();return;
    }

    // Recovery — get back to stage
    if(me.y>520||me.x<50||me.x>CW-50){this._recover(platforms);return;}

    // Edge-guard — pursue off-stage opponent when they have no jumps
    const tgtOOB=tgt.x<80||tgt.x>CW-80||tgt.y>500;
    if(tgtOOB&&tgt.jumpsLeft===0&&this.diff>=2&&Math.random()<[0,.1,.4,.7][this.diff]){
      dx>0?me.moveR():me.moveL();
      if(!me.grounded&&Math.random()<.4)me.doJump();
      if(dist<120&&me.atkCD===0){me.doSp(projs);}
      return;
    }

    // Projectile dodge
    let danger=null;
    for(const pr of projs){if(pr.owner===me)continue;if(Math.abs(pr.x-me.cx)<220&&Math.abs(pr.y-me.cy)<80){danger=pr;break;}}
    if(danger&&Math.random()>this.rand*2){
      if(Math.random()<this.shChance&&me.grounded){me.doShield();return;}
      danger.x<me.cx?me.moveR():me.moveL();
      if(!me.grounded&&Math.random()<.5)me.doJump();
      return;
    }

    // Random noise
    if(Math.random()<this.rand){const r=Math.random();if(r<.3)me.moveL();else if(r<.6)me.moveR();else if(r<.8)me.doJump();return;}

    // Spacing — don't walk into attacks when shielding
    const tooClose=dist<38&&this.diff>=2;
    if(tooClose&&Math.random()<[0,.1,.35,.6][this.diff]){
      dx>0?me.moveL():me.moveR();
      if(Math.random()<this.shChance)me.doShield();
      return;
    }

    if(dist>this.atkRng){
      dx>0?me.moveR():me.moveL();
      if(dy<-70&&me.grounded&&Math.random()<this.jpChance)me.doJump();
      if(Math.abs(dy)<40&&Math.abs(dx)<90&&Math.random()<this.jpChance*.5)me.doJump();
    } else {
      me.unShield();
      const roll=Math.random();
      if(roll<this.spChance&&me.atkCD===0){me.doSp(projs);dx>0?me.moveR():me.moveL();}
      else if(roll<.78&&me.atkCD===0){me.doAtk(projs);dx>0?me.moveR():me.moveL();}
      else if(roll<.9&&Math.random()<this.shChance){me.doShield();}
      else{me.unShield();}
      if(dy<-60&&Math.random()<.3)me.doJump();
    }
  }
  _recover(platforms){const me=this.f;let nearX=CW*.5,nearY=540,nearD=Infinity;for(const pl of platforms){const d=Math.hypot(me.cx-(pl.x+pl.w*.5),me.cy-pl.y);if(d<nearD){nearD=d;nearX=pl.x+pl.w*.5;nearY=pl.y;}}nearX>me.cx?me.moveR():me.moveL();if((me.y+me.h>nearY||me.vy>0)&&me.jumpsLeft>0)me.doJump();else if(me.jumpsLeft===0)me.doSp([]);}
}

class GameItem{
  constructor(x,y,def){
    this.x=x;this.y=y;this.def=def;this.w=34;this.h=34;
    this.vy=0;this.grounded=false;this.dead=false;
    this.bobT=Math.random()*6.28;
    this.isBomb=false;this.bombTimer=0;this.owner=null;
  }
  tick(platforms,fighters,projs,items){
    this.bobT+=0.06;
    if(this.isBomb){
      this.bombTimer--;
      if(this.bombTimer<=0){
        // EXPLODE
        burst(this.x+this.w*.5,this.y+this.h*.5,28,['#FF4400','#FFCC00','#FF8800','#FFF'],12,35,8);
        shakeAmt=12;shakeT=18;sfx('bighit');
        for(const fi of fighters){
          if(Math.hypot(fi.cx-(this.x+this.w*.5),fi.cy-(this.y+this.h*.5))<130){
            const kx=fi.cx>(this.x+this.w*.5)?7:-7;
            fi.takeHit(22,kx,-8);
          }
        }
        this.dead=true;return;
      }
    }
    if(!this.grounded){this.vy+=0.45;if(this.vy>14)this.vy=14;this.y+=this.vy;}
    for(const pl of platforms){
      const prevB=this.y+this.h-this.vy;
      if(this.vy>=0&&prevB<=pl.y&&this.y+this.h>=pl.y&&this.x+this.w>pl.x&&this.x<pl.x+pl.w){
        this.y=pl.y-this.h;this.vy=0;this.grounded=true;break;
      }
    }
    if(this.isBomb)return; // bombs don't get picked up
    // check fighter pickup
    for(const fi of fighters){
      if(fi.state==='dead'||fi.state==='spawn')continue;
      if(fi.x<this.x+this.w&&fi.x+fi.w>this.x&&fi.y<this.y+this.h&&fi.y+fi.h>this.y){
        // picked up!
        this.def.apply(fi,projs,fighters,items);
        this.dead=true;
        // show floating text
        fi._itemMsg=this.def.name;fi._itemMsgT=120;
        return;
      }
    }
  }
  draw(){
    if(this.dead)return;
    const bx=this.x;
    const by=this.isBomb?this.y:this.y+Math.sin(this.bobT)*5;
    ctx.save();
    // glow
    ctx.shadowBlur=16;ctx.shadowColor=this.def.col;
    // box
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.strokeStyle=this.def.col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,this.w,this.h,7):ctx.rect(bx,by,this.w,this.h);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
    // icon
    ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.def.icon,bx+this.w*.5,by+this.h*.5);
    ctx.textBaseline='alphabetic';
    // bomb countdown
    if(this.isBomb){
      const frac=this.bombTimer/120;
      const pulse=Math.sin(gTime*(frac<0.3?0.5:0.25))*0.5+0.5;
      ctx.globalAlpha=0.55+pulse*.45;
      ctx.fillStyle=frac<0.3?'#FF2200':'#FF8800';
      ctx.font=`bold 11px monospace`;ctx.textAlign='center';
      ctx.fillText(Math.ceil(this.bombTimer/60*10)/10+'s',bx+this.w*.5,by-5);
    }
    ctx.restore();
  }
}

// Shell projectile bounce logic — hook into Projectile.tick
const _origProjTick=Projectile.prototype.tick;
Projectile.prototype.tick=function(){
  if(this.type==='shell'){
    this.x+=this.vx;this.y+=this.vy;this.vy+=0.35;
    if(this.y>CH-120&&this.bounces>0){this.vy*=-0.7;this.bounces--;if(Math.abs(this.vy)<1)this.vy=-2;}
    if(this.x<40&&this.bounces>0){this.vx=Math.abs(this.vx);this.bounces--;}
    if(this.x>CW-40&&this.bounces>0){this.vx=-Math.abs(this.vx);this.bounces--;}
    this.life--;if(this.life<=0||this.bounces<0)this.dead=true;
    return;
  }
  _origProjTick.call(this);
};
const _origProjDraw=Projectile.prototype.draw;
Projectile.prototype.draw=function(){
  if(this.type==='shell'){
    ctx.save();ctx.fillStyle='#886633';ctx.strokeStyle='#553300';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(this.x,this.y,14,10,Math.atan2(this.vy,this.vx),0,6.28);ctx.fill();ctx.stroke();
    ctx.fillStyle='#CCAA55';ctx.beginPath();ctx.ellipse(this.x-2,this.y-2,6,4,0,0,6.28);ctx.fill();
    ctx.restore();return;
  }
  _origProjDraw.call(this);
};

  if(!curStage)return;
  const def=ITEM_DEFS[~~(Math.random()*ITEM_DEFS.length)];
  // pick a random platform to drop item on
  const plat=curStage.plats[~~(Math.random()*curStage.plats.length)];
  const ix=plat.x+20+Math.random()*(Math.max(0,plat.w-40));
  gameItems.push(new GameItem(ix,plat.y-80,def));
}

function tickItems(){
  for(let i=gameItems.length-1;i>=0;i--){
    gameItems[i].tick(curStage.plats,fighters,projs,gameItems);
    if(gameItems[i].dead)gameItems.splice(i,1);
  }
  // tick item timers on fighters
  for(const f of fighters){
    if(f._edTimer>0){f._edTimer--;if(f._edTimer===0){f.spd=f._itemSpd;f.aspd=(f._itemSpd*.75);f.jp=f._itemJp;}}
    if(f._coinTimer>0){f._coinTimer--;if(f._coinTimer===0){f.pwr=f._coinPwr;}}
    if(f._turboTimer>0){f._turboTimer--;if(f._turboTimer===0){f.pwr=f._turboPwr;f.spd=f._turboSpd;}}
    if(f._itemMsgT>0)f._itemMsgT--;
  }
  itemSpawnTimer++;
  const minStocks=fighters.length>0?Math.min(...fighters.map(f=>f.stocks>=1?f.stocks:3)):3;
  const activeInterval=minStocks<=2?3600:ITEM_SPAWN_INTERVAL; // 1min at 1-2 stocks, 2min otherwise
  if(itemSpawnTimer>=activeInterval&&gameItems.filter(it=>!it.isBomb).length<4){
    spawnItem();itemSpawnTimer=0;
  }
}

function drawItems(){
  for(const it of gameItems)it.draw();
  // draw pickup messages
  for(const f of fighters){
    if(f._itemMsgT>0&&f._itemMsg){
      const a=Math.min(1,f._itemMsgT/30);
      ctx.save();ctx.globalAlpha=a;
      ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillStyle='#FFD700';ctx.shadowBlur=8;ctx.shadowColor='#FF8800';
      ctx.fillText(f._itemMsg,f.cx,f.y-28-(120-f._itemMsgT)*.35);
      ctx.shadowBlur=0;ctx.restore();
    }
  }
}

// ====== CINEMATIC HELPERS ======
// clamp helper
const ic=(v,a,b)=>Math.max(a,Math.min(b,v));
// smooth ease in/out
const iease=t=>{t=ic(t,0,1);return t*t*(3-2*t);};

// Draw real character artwork in the intro cutscene
// opts: {col, x, y, scale, facing, pose, t, glow}
// col is used to identify which character to draw:
//   '#2288FF' = BlueGuy, '#CC1100' = RedGuy, '#8833CC' = Liam,
//   '#33AA33' = Eli, '#88AAFF' = Kyle, '#FFEE00' = Zapnoodle (ToyTeam),
//   '#CC8844' = SirStumbles (FlipMaster), '#000' = silhouette fallback
function drawIntroChar(o){
  const col=o.col||'#FFF',sc=o.scale||1,f=o.facing||1,t=o.t||0;
  const pose=o.pose||'idle';

  // Determine character base size
  let bw=50,bh=65;
  if(col==='#CC1100'){bw=58;bh=72;}
  else if(col==='#8833CC'){bw=42;bh=57;}
  else if(col==='#33AA33'){bw=46;bh=63;}
  else if(col==='#88AAFF'){bw=46;bh=63;}
  else if(col==='#FFEE00'||col==='#44BB44'){bw=45;bh=58;}
  else if(col==='#FF8800'||col==='#CC8844'){bw=40;bh=60;}

  const w=bw*sc, h=bh*sc;

  // Pose offsets — shift anchor point to simulate motion
  let offX=0, offY=0, lean=0;
  if(pose==='run'){offY=Math.sin(t*0.4)*3*sc;lean=0.12;}
  else if(pose==='jump'){offY=-6*sc;lean=0.05;}
  else if(pose==='atk'){offX=f*4*sc;lean=0.25;}
  else if(pose==='sp'){offX=f*3*sc;offY=-4*sc;lean=0.3;}
  else if(pose==='hit'){offX=-f*6*sc;lean=-0.3;}
  else if(pose==='land'){offY=5*sc;lean=0;}
  else if(pose==='crouch'){offY=8*sc;}

  ctx.save();
  if(o.glow){ctx.shadowBlur=20*sc;ctx.shadowColor=o.glow;}

  // We draw a scaled+translated version by transforming ctx
  // Characters draw relative to (this.x, this.y) top-left
  // We want the character's feet at (o.x, o.y)
  const drawX = o.x - w*0.5 + offX;
  const drawY = o.y - h + offY;

  ctx.translate(o.x + offX, o.y - h*0.5 + offY);
  ctx.rotate(lean);
  ctx.translate(-(o.x + offX), -(o.y - h*0.5 + offY));

  ctx.scale(1,1); // already in world coords

  // Build a fake fighter-like context object for drawing
  // We proxy ctx calls using the scaled position
  const fakeF = {
    x: drawX, y: drawY, w: w, h: h,
    facing: f, animT: t, state: pose,
    cx: drawX + w*0.5, cy: drawY + h*0.5,
    cfg: {col: col},
    grounded: (pose==='idle'||pose==='run'||pose==='land'||pose==='crouch'),
    trail: [], shieldHP: 100, invincT: 0, stunT: 0
  };

  ctx.shadowBlur = o.glow ? 20*sc : 0;
  if(o.glow) ctx.shadowColor = o.glow;

  // Call the appropriate character draw function
  if(col==='#2288FF') _drawBlueGuyBody(fakeF);
  else if(col==='#CC1100') _drawRedGuyBody(fakeF);
  else if(col==='#8833CC') _drawLiamBody(fakeF);
  else if(col==='#33AA33') _drawEliBody(fakeF);
  else if(col==='#88AAFF') _drawKyleBody(fakeF);
  else if(col==='#FFEE00'||col==='#44BB44') _drawToyTeamBody(fakeF);
  else if(col==='#FF8800'||col==='#CC8844') _drawFlipMasterBody(fakeF);
  else if(col==='#BB1100') _drawArcherBody(fakeF);
  else if(col==='#778899') _drawAnimatronicBody(fakeF);
  else if(col==='#AAAAAA') _drawSteelTitanBody(fakeF);
  else {
    // Silhouette fallback (for scene 6)
    ctx.fillStyle=col;
    const headR=14*sc;
    ctx.beginPath();ctx.arc(drawX+w*0.5,drawY+headR,headR,0,6.28);ctx.fill();
    ctx.fillRect(drawX+w*0.15,drawY+headR*1.8,w*0.7,h*0.45);
    ctx.fillRect(drawX+w*0.05,drawY+headR*1.4,w*0.22,h*0.35);
    ctx.fillRect(drawX+w*0.73,drawY+headR*1.4,w*0.22,h*0.35);
    ctx.fillRect(drawX+w*0.15,drawY+h*0.55,w*0.28,h*0.45);
    ctx.fillRect(drawX+w*0.57,drawY+h*0.55,w*0.28,h*0.45);
  }
  ctx.restore();
}

  ctx.beginPath();ctx.moveTo(f.cx,f.y+42*s);ctx.lineTo(f.cx-12*s,f.y+f.h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(f.cx,f.y+42*s);ctx.lineTo(f.cx+12*s,f.y+f.h);ctx.stroke();
  ctx.strokeStyle='#885500';ctx.lineWidth=3*s;ctx.beginPath();ctx.arc(f.cx+ff*20*s,f.y+29*s,15*s,-Math.PI*.5,Math.PI*.5,ff<0);ctx.stroke();
  ctx.strokeStyle='#FFCC88';ctx.lineWidth=1.5*s;ctx.beginPath();ctx.moveTo(f.cx+ff*20*s,f.y+14*s);ctx.lineTo(f.cx+ff*9*s,f.y+29*s);ctx.lineTo(f.cx+ff*20*s,f.y+44*s);ctx.stroke();
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(f.cx+(ff>0?4*s:-4*s),f.y+10*s,4*s,0,6.28);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(f.cx+(ff>0?5*s:-5*s),f.y+10*s,2*s,0,6.28);ctx.fill();
  ctx.lineWidth=1;
}

// Speed lines effect (for impact cuts)
function introSpeedLines(cx,cy,intensity,dir){
  ctx.save();
  ctx.globalAlpha=0.5*intensity;
  ctx.strokeStyle='#FFF';ctx.lineWidth=2;
  const n=14;
  for(let i=0;i<n;i++){
    const a=(i/n)*6.28+introT*0.01;
    const r0=80+(i%3)*40,r1=r0+200*intensity;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
    ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);
    ctx.stroke();
  }
  ctx.restore();
}

// Radial impact flash
function introFlash(cx,cy,r,alpha){
  ctx.save();ctx.globalAlpha=alpha;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.5,'rgba(255,240,200,0.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  ctx.restore();
}

// Soft stage platform for cutscene scenes
function introPlatform(y,w,color,top){
  const x=CW*0.5-w*0.5;
  ctx.fillStyle=color||'#3a2515';
  ctx.fillRect(x,y,w,16);
  ctx.fillStyle=top||'#FF8800';
  ctx.fillRect(x,y,w,4);
  // front face
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.moveTo(x,y+16);ctx.lineTo(x+w,y+16);
  ctx.lineTo(x+w-3,y+26);ctx.lineTo(x+3,y+26);
  ctx.closePath();ctx.fill();
}

// Wipe transition (used between scenes) — returns alpha 0..1, 1 = fully covered
// during 'cover' phase (0->0.5) it wipes in; 'reveal' phase (0.5->1) it wipes out
function introWipe(localT,coverDur,revealDur){
  // returns {alpha, side}
  if(localT<coverDur){
    return {a:iease(localT/coverDur),phase:'cover'};
  } else if(localT<coverDur+revealDur){
    return {a:1-iease((localT-coverDur)/revealDur),phase:'reveal'};
  }
  return {a:0,phase:'none'};
}

// Ambient ember/particle spawner for a scene
function introEmbers(n,cx,cy,spread){
  for(let i=0;i<n;i++){
    particles.push(new Particle(
      cx+(Math.random()-0.5)*spread, cy+(Math.random()-0.5)*spread*0.5,
      (Math.random()-0.5)*1.5, -Math.random()*2.5-0.8,
      ['#FF6600','#FF3300','#FFCC00'][~~(Math.random()*3)],
      40+~~(Math.random()*30), 2+Math.random()*2
    ));
  }
}

// ====== SCENE 1: Blue Guy vs Red Guy (introT 0-240, ~4s) ======
function introScene1(){
  const t=introT-IT.s1;
  // dark forge background with warm glow
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#1a0500');bg.addColorStop(1,'#3d1500');
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);
  const rg=ctx.createRadialGradient(CW*0.5,CH*0.85,30,CW*0.5,CH*0.85,600);
  rg.addColorStop(0,'rgba(255,90,0,0.35)');rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,CW,CH);
  if(Math.random()<0.4)introEmbers(1,CW*0.5,CH,1400);

  introPlatform(CH*0.78,520);

  // Camera cuts: shot changes every ~45 frames
  // Shot 0: wide (0-45), Shot 1: zoom blue (45-90), Shot 2: zoom red (90-135),
  // Shot 3: clash (135-180), Shot 4: red power (180-240)
  const shot=Math.floor(t/45);
  let camX=0,camY=0,camS=1;
  if(shot===0){camX=0;camY=0;camS=1+Math.sin(t*0.05)*0.02;}
  else if(shot===1){const tt=(t-45)/45;camX=-180+tt*20;camY=30;camS=1.6;}
  else if(shot===2){const tt=(t-90)/45;camX=180-tt*20;camY=30;camS=1.6;}
  else if(shot===3){const tt=(t-135)/45;camX=0;camY=0;camS=1.25+Math.sin(tt*8)*0.03;}
  else {camX=80;camY=-10;camS=1.3;}

  ctx.save();
  ctx.translate(CW*0.5,CH*0.5);
  ctx.scale(camS,camS);
  ctx.translate(-CW*0.5+camX,-CH*0.5+camY);

  // === Blue Guy (left) ===
  let blueX=CW*0.32,blueY=CH*0.78,bluePose='idle',blueF=1;
  if(t<45){bluePose='run';blueX=CW*0.20+t*2.5;}
  else if(t<90){bluePose='atk';blueX=CW*0.38;}
  else if(t<135){bluePose='run';blueX=CW*0.42-(t-90)*1.5;blueF=1;}
  else if(t<170){bluePose='jump';blueY=CH*0.78-(t-135)*1.8;}
  else if(t<200){bluePose='hit';blueX=CW*0.38+(t-170)*3;blueF=-1;}
  else {bluePose='land';blueX=CW*0.55;blueF=-1;}
  drawIntroChar({col:'#2288FF',x:blueX,y:blueY,scale:1.2,facing:blueF,pose:bluePose,t:t});

  // === Red Guy (right) ===
  let redX=CW*0.68,redY=CH*0.78,redPose='idle',redF=-1;
  if(t<45){redPose='idle';redX=CW*0.80-t*1.5;}
  else if(t<90){redPose='atk';redX=CW*0.55;}
  else if(t<135){redPose='run';redX=CW*0.60+(t-90)*1.2;redF=-1;}
  else if(t<170){redPose='atk';redX=CW*0.50;}
  else if(t<200){
    // Red Guy lands powerful attack — big hit
    redPose='sp';redX=CW*0.58;
    if(t>=178&&t<184){introFlash(blueX,blueY-20,260,0.6);introSpeedLines(blueX,blueY-20,1,0);}
  }
  else {
    // Red Guy leaps high — jump up, leaving frame upward
    redPose='jump';
    const jt=t-200;
    redY=CH*0.78-jt*jt*0.9;
    redX=CW*0.58;
  }
  drawIntroChar({col:'#CC1100',x:redX,y:redY,scale:1.25,facing:redF,pose:redPose,t:t});

  ctx.restore();

  // impact SFX timing
  if(t===0)sfx('introSting');
  if(t===50)sfx('hit');
  if(t===95)sfx('bighit');
  if(t===140)sfx('hit');
  if(t===178)sfx('bighit');
  if(t===205)sfx('jump');
}

// ====== SCENE 2: Red Guy tracking up + transition (240-360, ~2s) ======
function introScene2(){
  const t=introT-IT.s2;
  // sky backdrop fading to next-stage mood
  const skyP=ic(t/120,0,1);
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#3d1500');
  bg.addColorStop(skyP,'#1166CC');
  bg.addColorStop(1,'#7799FF');
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<4;i++){
    const cx2=((i*320+t*1.5)%(CW+200))-100;
    const cyc=110+i*60;
    ctx.beginPath();
    ctx.arc(cx2,cyc+10,30,0,6.28);
    ctx.arc(cx2+35,cyc,24,0,6.28);
    ctx.arc(cx2+62,cyc,28,0,6.28);
    ctx.fill();
  }

  // Red Guy flies up: camera tracks him. Then he falls.
  let redY,camY;
  if(t<60){
    // rising — camera follows
    redY=CH+100-t*8;
    camY=redY-CH*0.5;
  } else {
    // apex then fall — camera pulls back and holds
    const ft=t-60;
    redY=CH+100-60*8 - (-(ft-20)*Math.abs(ft-20)*0.6);
    camY=ft<25?redY-CH*0.5:camY;
  }
  camY=ic(camY||0,-300,100);
  const redX=CW*0.5+Math.sin(t*0.08)*30;

  ctx.save();
  ctx.translate(0,-Math.max(0,camY));
  drawIntroChar({col:'#CC1100',x:redX,y:redY,scale:1.3,facing:1,pose:'jump',t:t});
  // motion trail
  ctx.globalAlpha=0.3;ctx.fillStyle='#CC1100';
  for(let i=1;i<5;i++){
    ctx.fillRect(redX-23,redY+i*12-30,46,10);
  }
  ctx.restore();

  // light streaks as we transition
  if(t>80){
    const a=iease((t-80)/40);
    ctx.save();ctx.globalAlpha=a*0.4;
    ctx.fillStyle='#FFF';
    for(let i=0;i<8;i++){
      ctx.fillRect(0,(i*90+t*15)%CH,CW,2);
    }
    ctx.restore();
  }
  // white flash to transition into scene 3
  if(t>=110&&t<125){ctx.save();ctx.globalAlpha=(t-110)/15*0.9;ctx.fillStyle='#FFF';ctx.fillRect(0,0,CW,CH);ctx.restore();}

  if(t===0)sfx('jump');
  if(t===115)sfx('introWhoosh');
}

  // 0-44 Liam, 45-89 Eli, 90-134 Kyle, 135-179 Zapnoodle, 180-220 SirStumbles, then group
  const fighterSpec=[

    const sfxList=['sp','proj','hit','sp','bighit'];
    if(localT===2)sfx(sfxList[fi]||'hit');

    const gp=(t-220)/140;

// ====== SCENE 4: Cyber Dragon reveal (580-760, ~3s) ======
function introScene4(){
  const t=introT-IT.s4;
  // dark final forge
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#000000');bg.addColorStop(1,'#180000');
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);
  // red light columns
  for(let i=0;i<3;i++){
    const glow=Math.sin(introT*0.05+i)*0.5+0.5;
    ctx.save();ctx.globalAlpha=glow*0.4;
    ctx.fillStyle='#FF3300';
    ctx.fillRect(195+i*330-2,0,5,CH);ctx.restore();
  }

  // Slow zoom toward dragon face (build tension)
  const zoomP=iease(t/180);
  const zoom=1.5+zoomP*2.5; // 1.5x -> 4x
  // Eye glow intensity ramps up
  const eyeGlow=ic((t-40)/100,0,1);
  const roared=t>140;

  ctx.save();
  ctx.translate(CW*0.5,CH*0.5);
  ctx.scale(zoom,zoom);
  ctx.translate(-CW*0.5,-CH*0.5);

  // Dragon body (large, centered, facing right)
  const dx=CW*0.5,dy=CH*0.55;
  // tail
  ctx.strokeStyle='#00AA88';ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(dx-90,dy);
  ctx.lineTo(dx-180,dy+Math.sin(t*0.1)*30);ctx.stroke();
  // body
  ctx.fillStyle='#00AA88';
  ctx.beginPath();ctx.ellipse(dx,dy,80,55,0,0,6.28);ctx.fill();
  ctx.fillStyle='#008866';
  ctx.beginPath();ctx.ellipse(dx+30,dy-25,40,28,0,0,6.28);ctx.fill();
  // head
  ctx.fillStyle='#00FFCC';
  ctx.beginPath();ctx.ellipse(dx+90,dy,30,22,0,0,6.28);ctx.fill();
  // horns/spikes
  ctx.fillStyle='#00AA88';
  ctx.beginPath();ctx.moveTo(dx+80,dy-20);ctx.lineTo(dx+95,dy-45);ctx.lineTo(dx+100,dy-18);ctx.fill();
  // wings
  ctx.fillStyle='rgba(0,170,136,0.7)';
  ctx.beginPath();ctx.moveTo(dx-20,dy-30);ctx.lineTo(dx-90,dy-110);ctx.lineTo(dx+10,dy-50);ctx.fill();
  ctx.beginPath();ctx.moveTo(dx-20,dy-30);ctx.lineTo(dx-60,dy-80);ctx.lineTo(dx+5,dy-40);ctx.fill();

  // === EYES — glow dramatically ===
  const eyeCol=eyeGlow>0.3?'#FF2200':'#FFCC00';
  ctx.save();
  ctx.globalAlpha=0.4+eyeGlow*0.6;
  ctx.fillStyle=eyeCol;ctx.shadowBlur=25+eyeGlow*30;ctx.shadowColor=eyeCol;
  ctx.beginPath();ctx.arc(dx+95,dy-6,5+eyeGlow*5,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(dx+108,dy-2,4+eyeGlow*4,0,6.28);ctx.fill();
  ctx.restore();
  ctx.shadowBlur=0;

  ctx.restore(); // end zoom

  // Roar overlay — screen shake + flash + teeth
  if(roared){
    const rt=t-140;
    const shk=Math.max(0,1-rt/30)*16;
    // apply shake by re-drawing a flash
    introFlash(CW*0.5,CH*0.5,CW,0.3*Math.max(0,1-rt/15));
    if(rt<30){
      ctx.save();ctx.globalAlpha=0.5*(1-rt/30);
      ctx.fillStyle='#FF3300';ctx.fillRect(0,0,CW,CH);ctx.restore();
    }
    // roar text
    ctx.save();
    ctx.globalAlpha=Math.max(0,1-rt/40);
    ctx.fillStyle='#FF0000';ctx.shadowBlur=20;ctx.shadowColor='#FF0000';
    ctx.font='bold 64px Georgia,serif';ctx.textAlign='center';
    ctx.translate(CW*0.5,CH*0.3);
    ctx.scale(1+rt*0.02,1+rt*0.02);
    ctx.fillText('R',0,0);
    ctx.restore();
  }

  if(t===0)sfx('boss');
  if(t===140)sfx('roar');
  if(t===100)sfx('charge');
}

// ====== SCENE 5: Army charge (760-960, ~3.3s) ======
function introScene5(){
  const t=introT-IT.s5;
  // stormy sky
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#1a1a2e');bg.addColorStop(1,'#0d0d1a');
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);
  // lightning flashes
  if(Math.random()<0.04){
    ctx.save();ctx.globalAlpha=0.5;ctx.fillStyle='#CCDDFF';ctx.fillRect(0,0,CW,CH);ctx.restore();
    sfx('charge');
  }

  // High-angle camera looking down at army — perspective
  // Horizon line mid-screen, army marches from background to foreground
  const horizonY=CH*0.35;
  // ground
  const gg=ctx.createLinearGradient(0,horizonY,0,CH);
  gg.addColorStop(0,'#3a3020');gg.addColorStop(1,'#5a4525');
  ctx.fillStyle=gg;ctx.fillRect(0,horizonY,CW,CH-horizonY);

  // camera slowly tilts/pans
  const pan=(t/200)*60;

  // Draw army in rows (perspective: rows further = smaller, higher on screen)
  // Generate a deterministic-looking army
  const rows=7;
  for(let r=0;r<rows;r++){
    const rowT=(r+(t*0.012))/rows; // rows advance toward camera
    const rMod=rowT%1;
    const perspY=horizonY+rMod*(CH-horizonY);
    const perspScale=0.3+rMod*0.9;
    const count=4+Math.floor(rMod*6);
    for(let c=0;c<count;c++){
      const seed=r*17+c*5;
      const baseX=(c/count)*CW + Math.sin(seed)*30 - pan*rMod;
      const x=baseX - (baseX-CW*0.5)*0.1;
      const isTitan=(seed%4===0);
      const col=isTitan?'#AAAAAA':'#778899';
      // dust at feet for foreground rows
      if(rMod>0.6&&Math.random()<0.3){
        particles.push(new Particle(x,perspY,(Math.random()-0.5)*2,-Math.random()*1.5,['#aa9966','#887755'],30,3*perspScale));
      }
      drawIntroChar({col:col,x:x,y:perspY,scale:0.7*perspScale*(isTitan?1.4:1),facing:1,pose:'run',t:t*0.5+seed});
    }
  }
  tickParticles();drawParticles();

  // Camera shake building
  const shk=Math.min(1,t/100)*8;
  ctx.save();ctx.globalAlpha=1;
  ctx.translate((Math.random()-0.5)*shk,(Math.random()-0.5)*shk);
  // (shake applied visually by overlay redraw of edges — simpler: vignette pulse)
  ctx.restore();

  // Dust haze near horizon
  const dh=ctx.createLinearGradient(0,horizonY-20,0,horizonY+60);
  dh.addColorStop(0,'rgba(180,150,100,0)');
  dh.addColorStop(1,'rgba(180,150,100,0.4)');
  ctx.fillStyle=dh;ctx.fillRect(0,horizonY-20,CW,80);

  // Vignette
  const vg=ctx.createRadialGradient(CW*0.5,CH*0.5,CH*0.2,CW*0.5,CH*0.5,CH*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);

  if(t===0)sfx('charge');
  if(t===150)sfx('charge');
}

// ====== SCENE 6: Roster silhouette tease (960-1280, ~5.3s) ======
function introScene6(){
  const t=introT-IT.s6;
  // Fade from black
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);

  // Bright light behind 13 silhouettes, grows over time
  const lightR=iease(ic(t/200,0,1))*400+50;
  const lightA=iease(ic(t/120,0,1));
  ctx.save();
  ctx.globalAlpha=lightA;
  const lg=ctx.createRadialGradient(CW*0.5,CH*0.55,0,CW*0.5,CH*0.55,lightR);
  lg.addColorStop(0,'rgba(255,240,200,1)');
  lg.addColorStop(0.5,'rgba(255,180,80,0.7)');
  lg.addColorStop(1,'rgba(255,100,0,0)');
  ctx.fillStyle=lg;ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // God rays
  ctx.save();ctx.globalAlpha=lightA*0.3;
  ctx.fillStyle='#FFEABB';
  for(let i=0;i<7;i++){
    ctx.save();
    ctx.translate(CW*0.5,CH*0.55);
    ctx.rotate(i*0.9 + Math.sin(t*0.02+i)*0.05);
    ctx.beginPath();ctx.moveTo(-8,-60);ctx.lineTo(8,-60);ctx.lineTo(40,80);ctx.lineTo(-40,80);ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // 13 silhouettes — camera pans across then reveals all
  // Each gets unique pose based on their character
  const poses=['idle','atk','jump','sp','run','land','crouch','atk','sp','jump','idle','sp','atk'];
  const cols=CHARS.map(c=>c.col);
  const n=13;
  const panPhase=ic(t/160,0,1); // 0-160 pans, then hold
  // pan camera from left to right across lineup
  const panX=(panPhase-0.5)*240;
  ctx.save();
  ctx.translate(-panX,0);
  // Ground line
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-200,CH*0.82,CW+400,20);

  for(let i=0;i<n;i++){
    // arc positioning — front row spread
    const spacing=(CW+300)/(n-1);
    const x=-150+i*spacing;
    const y=CH*0.82;
    const sc=1.0+Math.sin(i*0.5)*0.05;
    // staggered fade-in based on pan position
    const revealT=ic((t-80-i*8)/40,0,1);
    if(revealT<=0)continue;
    ctx.save();
    ctx.globalAlpha=revealT;
    // pure black silhouette with rim light
    drawIntroChar({col:'#000',x:x,y:y,scale:sc,facing:i%2===0?1:-1,pose:poses[i],t:t+i*5});
    // rim light from behind
    ctx.globalAlpha=revealT*0.5;
    drawIntroChar({col:cols[i],x:x,y:y,scale:sc*1.02,facing:i%2===0?1:-1,pose:poses[i],t:t+i*5,glow:cols[i]});
    ctx.restore();
  }
  ctx.restore();

  // music swell
  if(t===0)sfx('swell');
  if(t===160)sfx('swell');
}

// ====== ENDING: Logo smash + flourish (1280-1480, ~3.3s) ======
function introEnding(){
  const t=introT-IT.end;
  if(t<14){
    // initial white flash
    ctx.save();ctx.globalAlpha=(1-t/14)*0.9;ctx.fillStyle='#FFF';ctx.fillRect(0,0,CW,CH);ctx.restore();
  }
  // Screen shake
  if(t<20){
    const shk=(1-t/20)*16;
    ctx.save();ctx.translate((Math.random()-0.5)*shk*2,(Math.random()-0.5)*shk*2);
  }
  // dark bg
  const bg=ctx.createLinearGradient(0,0,0,CH);
  bg.addColorStop(0,'#050000');bg.addColorStop(1,'#150300');
  ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);

  // ember particles
  if(t<120&&Math.random()<0.5)introEmbers(1,CW*0.5,CH,1400);
  tickParticles();drawParticles();

  // Title scale animation
  const flashIn=14;
  const titleScale=t<flashIn?1.4-(t/flashIn)*0.4:1.0+Math.sin(t*0.05)*0.015;
  const titleAlpha=Math.min(1,t/8);
  ctx.save();
  ctx.globalAlpha=titleAlpha;
  ctx.translate(CW*0.5,CH*0.4);
  ctx.scale(titleScale,titleScale);
  ctx.shadowBlur=40;ctx.shadowColor='#FF6600';
  ctx.fillStyle='#FF6600';
  ctx.font='bold 108px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('FORGE',0,-14);
  ctx.shadowColor='#FFCC00';ctx.shadowBlur=30;
  ctx.fillStyle='#FFCC00';
  ctx.font='bold 80px Georgia,serif';
  ctx.fillText('FIGHTERS',0,68);
  ctx.shadowBlur=0;ctx.restore();
  if(t<20)ctx.restore();

  // Subtitle
  if(t>flashIn+8){
    const sa=Math.min(1,(t-flashIn-8)/20);
    ctx.save();ctx.globalAlpha=sa*0.8;
    ctx.fillStyle='#AA8866';
    ctx.font='italic 24px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('The Ultimate Platform Fighter',CW*0.5,CH*0.4+108);
    ctx.restore();
  }
  // Tagline / flourish
  if(t>60){
    const fa=Math.min(1,(t-60)/30);
    ctx.save();ctx.globalAlpha=fa;
    ctx.fillStyle='#FFCC44';ctx.shadowBlur=10;ctx.shadowColor='#FF6600';
    ctx.font='bold 26px Georgia,serif';ctx.textAlign='center';
    ctx.fillText('13 FIGHTERS · 12 STAGES · STORY MODE',CW*0.5,CH*0.72);
    ctx.shadowBlur=0;ctx.restore();
  }
  // Press any key
  if(introT>=IT.done){
    const pa=0.4+Math.sin(introT*0.08)*0.4;
    ctx.save();ctx.globalAlpha=pa;
    ctx.fillStyle='#FFCC44';ctx.font='bold 20px monospace';ctx.textAlign='center';
    ctx.fillText('Press any key to continue',CW*0.5,CH*0.85);
    ctx.restore();
  }
  // final fade to black
  if(t>170){
    const fa=iease(ic((t-170)/30,0,1));
    ctx.save();ctx.globalAlpha=fa;ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);ctx.restore();
  }

  if(t===0)sfx('logo');
  if(t===60)sfx('swell');
}

// ====== MAIN INTRO DRIVER ======
function drawIntro(){
  introT++;
  const t=introT;
  // dispatch by scene
  if(t<IT.s2)introScene1();
  else if(t<IT.s3)introScene2();
  else if(t<IT.s7)introScene3();
  else if(t<IT.s4)introScene7();
  else if(t<IT.s5)introScene4();
  else if(t<IT.s6)introScene5();
  else if(t<IT.end)introScene6();
  else introEnding();

  // === Cross-scene fade transitions (black wipes between scenes) ===
  const fades=[
    {at:IT.s2-12, dur:24}, // into scene 2
    {at:IT.s3-12, dur:24}, // into scene 3
    {at:IT.s7-12, dur:24}, // into scene 7
    {at:IT.s4-12, dur:24}, // into scene 4
    {at:IT.s5-12, dur:24}, // into scene 5
    {at:IT.s6-12, dur:24}, // into scene 6
    {at:IT.end-12, dur:24},// into ending
  ];
  for(const f of fades){
    if(t>=f.at && t<f.at+f.dur){
      const lt=t-f.at;
      const a=lt<f.dur/2?iease(lt/(f.dur/2)):1-iease((lt-f.dur/2)/(f.dur/2));
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);ctx.restore();
    }
  }

  // Opening fade-in from black
  if(t<20){
    ctx.save();ctx.globalAlpha=1-t/20;ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);ctx.restore();
  }
  // Skip hint — fades in after 60 frames, only shows during scenes (not ending)
  if(t>60&&t<IT.end){
    const ha=Math.min(1,(t-60)/40)*0.5;
    ctx.save();ctx.globalAlpha=ha;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(CW-220,CH-38,218,28);
    ctx.fillStyle='#AAAAAA';ctx.font='13px monospace';ctx.textAlign='right';
    ctx.fillText('Press any key to skip',CW-10,CH-18);
    ctx.restore();
  }
}

  const P1=new CHARS[storyPlayerChar].Cls(curStage.spawns[0].x-25,curStage.spawns[0].y-75,0);
  P1.stocks=storyStockCnt;
  let P2;
  if(ss.isBoss){
    P2=new Prototype(curStage.spawns[1].x-25,curStage.spawns[1].y-75,1);

  } else {
    P2=new CHARS[ss.enemyIdx].Cls(curStage.spawns[1].x-25,curStage.spawns[1].y-75,1);
    P2.stocks=1;
    aiCtrls=[new AICtrl(P2,ss.diff)];
  }
  fighters=[P1,P2];
  phase='game';
}

    if(cheatBuf.length===CHEAT_SEQ.length&&cheatBuf.every((v,i)=>v===CHEAT_SEQ[i])){

  if(jp['Enter']||jp['KeyJ']||jp['Space']){
    sfx('sel');

    else if(menuSel===2){csMode='cpu';csReady=[false,false];phase='charsel';}
    else if(menuSel===3){phase='opts';optSel=0;}

}
function inputLevelInput(){
  for(const k in jp){

      const d=k.slice(-1);

  }

      storyPlayerChar=0;storyStage=n-1;storyLives=3;storyStockCnt=storyStockCnt||3;
      sfx('sel');storyTitleT=0;phase='storytitle';

}

function inputCharSel(){
  if(!csReady[0]){
    if(jp['KeyA']){csP1=(csP1-1+CHARS.length)%CHARS.length;sfx('sel');}
    if(jp['KeyD']){csP1=(csP1+1)%CHARS.length;sfx('sel');}
    if(jp['KeyJ']){csReady[0]=true;sfx('sel');}
  }
  if(csMode==='1v1'&&!csReady[1]){
    if(jp['ArrowLeft']){csP2=(csP2-1+CHARS.length)%CHARS.length;sfx('sel');}
    if(jp['ArrowRight']){csP2=(csP2+1)%CHARS.length;sfx('sel');}
    if(jp['Numpad1']||jp['KeyL']){csReady[1]=true;sfx('sel');}
  }
  if(csMode==='cpu'){
    if(!csReady[1])csReady[1]=true;
    // ←/→ = CPU character,  ↑/↓ = CPU difficulty
    if(jp['ArrowLeft']){csP2=(csP2-1+CHARS.length)%CHARS.length;sfx('sel');}
    if(jp['ArrowRight']){csP2=(csP2+1)%CHARS.length;sfx('sel');}
    if(jp['ArrowUp']){cpuDiff=Math.min(3,cpuDiff+1);sfx('sel');}
    if(jp['ArrowDown']){cpuDiff=Math.max(0,cpuDiff-1);sfx('sel');}
  }
  if(csMode==='story'){
    // Only P1 picks; P2 set by story
    if(!csReady[1])csReady[1]=true;
    if(jp['ArrowLeft']){csP1=(csP1-1+CHARS.length)%CHARS.length;sfx('sel');}
    if(jp['ArrowRight']){csP1=(csP1+1)%CHARS.length;sfx('sel');}
  }
  if(jp['Escape']){phase='menu';csReady=[false,false];}
  if(csReady[0]&&csReady[1]){
    sfx('sel');
    if(csMode==='story'){
      storyPlayerChar=csP1;storyStage=0;storyLives=3;
      phase='storymap';

      phase='stagesel';
    }

function inputStageSel(){
  if(jp['KeyA']||jp['ArrowLeft']){stageSel=(stageSel-1+STAGES.length)%STAGES.length;sfx('sel');}
  if(jp['KeyD']||jp['ArrowRight']){stageSel=(stageSel+1)%STAGES.length;sfx('sel');}

}

function inputGame(){

  if(p1&&p1.state!=='dead'&&p1.state!=='spawn'){
    if(keys['KeyA'])p1.moveL();if(keys['KeyD'])p1.moveR();
    if(jp['KeyW'])p1.doJump();
    if(jp['KeyJ']){
      if(keys['KeyS']&&p1.doGrabCombo)p1.doGrabCombo(fighters,projs);
      else if(keys['KeyS']&&p1.doGoofyFace)p1.doGoofyFace(projs);
      else if(keys['KeyS']&&p1.doTeleport)p1.doTeleport();
      else if(keys['KeyS']&&p1.doInvis)p1.doInvis();
      else p1.doAtk(projs);
    }
    if(jp['KeyK'])p1.doSp(projs);if(keys['KeyL'])p1.doShield();else p1.unShield();
    if(jp['KeyH']&&p1.doEmote)p1.doEmote();
  }
  if(p2&&p2.state!=='dead'&&p2.state!=='spawn'&&aiCtrls.length===0){
    if(keys['ArrowLeft'])p2.moveL();if(keys['ArrowRight'])p2.moveR();
    if(jp['ArrowUp'])p2.doJump();
    if(jp['Numpad1']){
      if(keys['ArrowDown']&&p2.doGrabCombo)p2.doGrabCombo(fighters,projs);
      else if(keys['ArrowDown']&&p2.doTeleport)p2.doTeleport();
      else if(keys['ArrowDown']&&p2.doInvis)p2.doInvis();
      else p2.doAtk(projs);
    }
    if(jp['Numpad2'])p2.doSp(projs);if(keys['Numpad3'])p2.doShield();else p2.unShield();
    if(jp['Numpad0']&&p2.doEmote)p2.doEmote();
  }
  if(jp['Escape'])phase='menu';
}

function inputOpts(){
  if(jp['ArrowUp']||jp['KeyW']){optSel=(optSel-1+3)%3;sfx('sel');}
  if(jp['ArrowDown']||jp['KeyS']){optSel=(optSel+1)%3;sfx('sel');}
  if(jp['ArrowLeft']||jp['KeyA']){if(optSel===0)stockCnt=Math.max(1,stockCnt-1);if(optSel===1)sfxOn=!sfxOn;sfx('sel');}
  if(jp['ArrowRight']||jp['KeyD']){if(optSel===0)stockCnt=Math.min(5,stockCnt+1);if(optSel===1)sfxOn=!sfxOn;sfx('sel');}

}

// ================================================================ GAME UPDATE
function updateGame(){
  gTime++;
  for(const ai of aiCtrls)ai.tick(fighters,curStage.plats,projs);
  for(const f of fighters){
    f.tick(curStage.plats,fighters,projs);
    if(f.state!=='dead'&&f.state!=='spawn'&&f.oob(curStage)){
      sfx('death');deathFX(f.cx,f.cy,f.cfg.col);
      f.stocks--;
      // Stock-loss freeze frame + kill feed
      stockFreezeT=22;
      shakeAmt=12;shakeT=18;
      killFeed.unshift({name:f.name,col:f.cfg.col,t:180,stock:f.stocks});
      if(f.stocks<=0){f.state='dead';}
      else f.spawnAt(curStage);
    }
  }
  // Boss HP → death
  if(storyBossMode){
    const boss=fighters.find(f=>f.isPrototype);
    if(boss&&boss.bossHP<=0&&boss.state!=='dead'){
      boss.state='dead';deathFX(boss.cx,boss.cy,boss.cfg.col);sfx('death');
      burst(boss.cx,boss.cy,55,['#FFD700','#FF6600','#FFF','#FFCC00','#FF3300'],14,55,10);
      shakeAmt=20;shakeT=45;
    }
  }
  // Projectiles
  for(let i=projs.length-1;i>=0;i--){
    const pr=projs[i];pr.tick();
    for(const fi of fighters){
      if(pr.hits(fi)){fi.takeHit(pr.dmg,pr.kbx*Math.sign(pr.vx),pr.kby);hitFX(pr.x,pr.y,pr.dmg>12);sfx(pr.dmg>12?'bighit':'hit');pr.hitSet.add(fi);pr.dead=true;break;}
    }
    if(pr.dead)projs.splice(i,1);
  }
  // Hazards
  for(const hz of curStage.hazards||[]){
    if(hz.type==='lava'){for(const f of fighters){if(f.state==='dead'||f.state==='spawn'||f.invincT>0)continue;if(f.x+f.w>hz.x&&f.x<hz.x+hz.w&&f.y+f.h>hz.y&&f.y<hz.y+38)f.takeHit(2,0,-5);}}
    else if(hz.type==='laser'){for(const f of fighters){if(f.state==='dead'||f.state==='spawn'||f.invincT>0)continue;if(f.x+f.w>hz.x&&f.x<hz.x+hz.w&&f.y+f.h>hz.y&&f.y<hz.y+hz.h)f.takeHit(3,0,-7);}}
  }
  tickParticles();
  tickItems();
  // Tick combo timers
  for(let i=0;i<2;i++){
    if(comboTimers[i]>0){comboTimers[i]--;if(comboTimers[i]===0)comboCounts[i]=0;}
    if(comboFlashT[i]>0)comboFlashT[i]--;
  }
  if(stockFreezeT>0){stockFreezeT--;return;} // freeze frame on stock loss
  // Kill feed age
  killFeed=killFeed.filter(k=>k.t-->0);
  // Win check
  const alive=fighters.filter(f=>f.state!=='dead');
  if(alive.length<=1&&fighters.length>1){
    winnerIdx=alive.length===1?fighters.indexOf(alive[0]):-1;
    if(storyMode){
      sfx('win');
      if(winnerIdx===0){storeClearT=0;phase='storyclear';}
      else{storyLives--;if(storyLives<=0){storyGameOverT=0;phase='storygameover';}else{storyFailT=0;phase='storyfail';}}
    } else {vicT=0;phase='victory';sfx('win');}
  }
}

// ================================================================ DRAW: GAME
function drawGame(){
  const sx=shakeT>0?(Math.random()-.5)*shakeAmt*2:0;
  const sy=shakeT>0?(Math.random()-.5)*shakeAmt*2:0;
  ctx.save();ctx.translate(sx,sy);
  renderStage(curStage);drawParticles();
  drawItems();
  for(const pr of projs)pr.draw();
  for(const f of fighters)f.draw();

  // Item pickup name popups
  for(const f of fighters){
    if(f._itemMsgT>0){
      f._itemMsgT--;
      const a=Math.min(1,f._itemMsgT/18)*Math.min(1,(120-f._itemMsgT)/10);
      const rise=(120-f._itemMsgT)*0.55;
      ctx.save();ctx.globalAlpha=a;
      ctx.fillStyle='rgba(0,0,0,0.7)';
      const tw=ctx.measureText(f._itemMsg||'').width+28;
      ctx.fillRect(f.cx-tw/2,f.y-62-rise,tw,26);
      ctx.strokeStyle='#FFCC00';ctx.lineWidth=1.5;ctx.strokeRect(f.cx-tw/2,f.y-62-rise,tw,26);
      ctx.fillStyle='#FFEE88';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText('★ '+(f._itemMsg||''),f.cx,f.y-44-rise);
      ctx.restore();
    }
    // Low stock danger glow around fighter (1 stock left)
    if(f.stocks===1&&f.state!=='dead'&&f.state!=='spawn'){
      const pulse=0.18+Math.sin(gTime*0.18)*0.14;
      ctx.save();ctx.globalAlpha=pulse;
      ctx.strokeStyle='#FF2200';ctx.lineWidth=4;ctx.shadowBlur=18;ctx.shadowColor='#FF2200';
      ctx.strokeRect(f.x-4,f.y-4,f.w+8,f.h+8);
      ctx.shadowBlur=0;ctx.restore();
    }
  }

  ctx.restore();
  drawGameHUD();
}

function drawGameHUD(){
  // ---- Bottom panel background ----
  ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,CH-106,CW,106);
  ctx.strokeStyle='rgba(255,100,0,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,CH-106);ctx.lineTo(CW,CH-106);ctx.stroke();

  for(let i=0;i<fighters.length;i++){
    const f=fighters[i],left=i===0;
    const cardX=left?24:CW-474;

    // Card bg + border
    const cardCol=left?'rgba(40,80,255,.16)':'rgba(255,40,40,.16)';
    const borderCol=left?'#3366FF':'#FF3344';
    ctx.fillStyle=cardCol;ctx.fillRect(cardX,CH-102,450,98);
    ctx.strokeStyle=borderCol;ctx.lineWidth=2;ctx.strokeRect(cardX,CH-102,450,98);

    // Character portrait — mini version of real art
    ctx.save();
    ctx.beginPath();ctx.rect(cardX+4,CH-100,54,54);ctx.clip();
    const fakeF={x:cardX+4,y:CH-100,w:54,h:54,cx:cardX+31,cy:CH-73,facing:left?1:-1,animT:gTime,state:'idle',cfg:{col:f.cfg.col},grounded:true,trail:[],shieldHP:100,invincT:0,stunT:0};
    const drawFn={'Blue Guy':_drawBlueGuyBody,'Red Guy':_drawRedGuyBody,'Liam':_drawLiamBody,'Eli':_drawEliBody,'Flip Master':_drawFlipMasterBody,'Toy Team':_drawToyTeamBody,'Kyle':_drawKyleBody,'Archer':_drawArcherBody,'Animatronic':null,'Cyber Dragon':null,'Steel Titan':null,'Zapnoodle':_drawZapnoodlePortrait,'Sir Stumbles':null,'The Prototype':null}[f.name];
    if(drawFn){try{drawFn(fakeF);}catch(e){}}
    else{ctx.fillStyle=f.cfg.col;ctx.fillRect(cardX+4,CH-100,54,54);}
    ctx.restore();

    // Name
    ctx.fillStyle='#CCC';ctx.font='bold 13px monospace';ctx.textAlign=left?'left':'right';
    ctx.fillText(f.name,left?cardX+64:cardX+446,CH-86);
    // CPU tag
    if(aiCtrls.length>0&&i===1&&!storyBossMode){
      ctx.fillStyle='#4488FF';ctx.font='11px monospace';
      ctx.fillText(`CPU [${['Easy','Normal','Hard','Insane'][cpuDiff]}]`,left?cardX+64:cardX+446,CH-72);
    }

    if(storyBossMode&&i===1&&f.isPrototype){
      // Boss HP bar
      const hpPct=f.bossHP/f.bossMaxHP;
      const bx=cardX+64,bw=376,bh=22,by=CH-68;
      ctx.fillStyle='#111';ctx.fillRect(bx,by,bw,bh);
      const hpCol=f.bossPhase===2?`hsl(${hpPct*30},100%,50%)`:`hsl(${hpPct*90+20},100%,50%)`;
      ctx.fillStyle=hpCol;
      if(f.bossPhase===2){ctx.shadowBlur=10;ctx.shadowColor='#FF3300';}
      ctx.fillRect(bx,by,bw*hpPct,bh);ctx.shadowBlur=0;
      if(f.bossPhase===2){ctx.save();ctx.globalAlpha=0.3+Math.sin(gTime*0.15)*0.2;ctx.fillStyle='#FF0000';ctx.fillRect(bx,by,bw*hpPct,bh);ctx.restore();}
      ctx.strokeStyle=f.bossPhase===2?'#FF4400':'#FFCC00';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
      ctx.fillStyle='#FFF';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText(f.bossPhase===2?'⚡ PHASE 2 ⚡':'BOSS HP',bx+bw/2,by+bh-5);
      ctx.textAlign='right';ctx.fillStyle='#FFCC00';ctx.font='bold 14px monospace';
      ctx.fillText(`${Math.ceil(f.bossHP)} / ${f.bossMaxHP}`,bx+bw,by-4);
    } else {
      const pct=~~f.dmg;

      // Damage bar — drawn FIRST so % text renders on top of it cleanly
      const barPct=Math.min(1,pct/200);
      const bx2=left?cardX+64:cardX+4,bw2=378,bh2=10,by2=CH-70;
      ctx.fillStyle='#111';ctx.fillRect(bx2,by2,bw2,bh2);
      const barCol=barPct<0.25?'#44FF88':barPct<0.5?'#FFEE44':barPct<0.75?'#FF8800':'#FF2200';
      ctx.fillStyle=barCol;ctx.fillRect(bx2,by2,bw2*barPct,bh2);
      if(barPct>0.75){ctx.save();ctx.globalAlpha=0.3+Math.sin(gTime*0.3)*0.3;ctx.fillStyle='#FF0000';ctx.fillRect(bx2,by2,bw2*barPct,bh2);ctx.restore();}

      // Damage % text — drawn AFTER bar so it's always on top, no overlap
      const dcol=pct<50?'#FFFFFF':pct<100?'#FFDD44':pct<150?'#FF8800':'#FF2200';
      const dpulse=pct>100?(1+Math.sin(gTime*0.22)*0.08):1;
      ctx.save();
      ctx.translate(left?cardX+200:cardX+240,CH-30);
      ctx.scale(dpulse,dpulse);
      ctx.fillStyle=f.state==='dead'?'#444':dcol;
      if(pct>150){ctx.shadowBlur=16;ctx.shadowColor='#FF2200';}
      ctx.font='bold 46px monospace';ctx.textAlign='center';
      ctx.fillText(f.state==='dead'?'KO':pct+'%',0,0);
      ctx.shadowBlur=0;ctx.restore();

      // Stock orbs
      for(let s=0;s<4;s++){
        const alive2=s<f.stocks;
        const ox=left?bx2+s*30:bx2+bw2-s*30-12;
        const oy=CH-38;
        if(alive2){
          ctx.shadowBlur=8;ctx.shadowColor=f.cfg.col;
          ctx.fillStyle=f.cfg.col;ctx.beginPath();ctx.arc(ox+6,oy,9,0,6.28);ctx.fill();
          ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(ox+3,oy-3,4,0,6.28);ctx.fill();
          ctx.shadowBlur=0;
        } else {
          ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(ox+6,oy,9,0,6.28);ctx.fill();
          ctx.strokeStyle='#333';ctx.lineWidth=1.5;ctx.stroke();
        }
      }
    }
  }

  // ---- Combo counters ----
  for(let i=0;i<2;i++){
    if(comboFlashT[i]>0&&comboCounts[i]>=2){
      const ca=Math.min(1,comboFlashT[i]/20)*Math.min(1,(comboFlashT[i]>50?70-comboFlashT[i]:comboFlashT[i])/10);
      const cx2=i===0?280:CW-280;
      const cy2=CH-160-Math.max(0,(comboFlashT[i]-50)*2);
      ctx.save();ctx.globalAlpha=ca;
      const sc2=1+Math.sin(comboFlashT[i]*0.25)*0.08;
      ctx.translate(cx2,cy2);ctx.scale(sc2,sc2);
      ctx.shadowBlur=22;ctx.shadowColor=fighters[i]?fighters[i].cfg.col:'#FF8800';
      ctx.fillStyle='#FFCC00';ctx.font='bold 54px Georgia,serif';ctx.textAlign='center';
      ctx.fillText(`${comboCounts[i]} HIT`,0,0);
      ctx.fillStyle='#FFF';ctx.font='bold 18px monospace';
      ctx.fillText('COMBO!',0,28);
      ctx.shadowBlur=0;ctx.restore();
    }
  }

  // ---- Kill feed (top right) ----
  for(let k=0;k<killFeed.length&&k<3;k++){
    const kf=killFeed[k];
    const ka=Math.min(1,kf.t/20)*Math.min(1,(kf.t>160?180-kf.t:kf.t)/12);
    ctx.save();ctx.globalAlpha=ka;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(CW-360,10+k*36,350,30);
    ctx.strokeStyle=kf.col;ctx.lineWidth=1.5;ctx.strokeRect(CW-360,10+k*36,350,30);

function drawStoryMap(){
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#050010');g.addColorStop(1,'#100005');

    if(done&&!ss.isBoss){ctx.fillStyle='#44FF66';ctx.font='16px monospace';ctx.fillText('✓',bx+nodeW-12,by+12);}
    if(current){ctx.fillStyle='#FFCC00';ctx.font='bold 16px monospace';ctx.fillText('▼',bx+nodeW/2,by-8);}
