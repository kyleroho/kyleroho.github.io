<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Fighters</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas{display:block;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const CW=1280,CH=720;
canvas.width=CW;canvas.height=CH;
function resize(){const s=Math.min(innerWidth/CW,innerHeight/CH);canvas.style.width=CW*s+'px';canvas.style.height=CH*s+'px';}
resize();addEventListener('resize',resize);

// ---------------------------------------------------------------- INPUT
const keys={},jp={},jr={};
addEventListener('keydown',e=>{if(!keys[e.code])jp[e.code]=1;keys[e.code]=1;e.preventDefault();});
addEventListener('keyup',e=>{jr[e.code]=1;delete keys[e.code];});
const clearJP=()=>{for(const k in jp)delete jp[k];for(const k in jr)delete jr[k];};

// ---------------------------------------------------------------- AUDIO
let AC=null;
const initAudio=()=>{if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}};
addEventListener('keydown',initAudio,{once:true});addEventListener('click',initAudio,{once:true});
let sfxOn=true;
function sfx(type){
  if(!AC||!sfxOn)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime;
    const cfg={
      hit:['square',[200,t,55,t+.13],[.35,t,.001,t+.16]],
      bighit:['sawtooth',[110,t,28,t+.25],[.55,t,.001,t+.3]],
      jump:['sine',[320,t,620,t+.09],[.18,t,.001,t+.13]],
      death:['sine',[880,t,45,t+.55],[.4,t,.001,t+.6]],
      sel:['sine',[480,t,700,t+.07],[.15,t,.001,t+.14]],
      proj:['sawtooth',[440,t,200,t+.2],[.12,t,.001,t+.24]],
      sp:['sine',[200,t,900,t+.18],[.3,t,.001,t+.32]],
      shield:['sine',[1400,t,850,t+.1],[.1,t,.001,t+.14]],
      win:['sine',[440,t,880,t+.4],[.4,t,.001,t+.6]],
      boss:['sawtooth',[80,t,40,t+.8],[.6,t,.001,t+.9]],
    }[type]||['sine',[400,t,200,t+.1],[.2,t,.001,t+.15]];
    o.type=cfg[0];
    o.frequency.setValueAtTime(cfg[1][0],cfg[1][1]);
    o.frequency.exponentialRampToValueAtTime(cfg[1][2],cfg[1][3]);
    g.gain.setValueAtTime(cfg[2][0],cfg[2][1]);
    g.gain.exponentialRampToValueAtTime(cfg[2][2],cfg[2][3]);
    o.start(t);o.stop(t+cfg[2][3]-t+.05);
  }catch(e){}
}

// ---------------------------------------------------------------- PARTICLES
const particles=[];
let shakeAmt=0,shakeT=0;
class Particle{
  constructor(x,y,vx,vy,col,life,sz){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.col=col;this.life=this.ml=life;this.sz=sz;}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.11;this.vx*=.97;this.life--;}
  draw(){const a=this.life/this.ml;ctx.save();ctx.globalAlpha=a*.9;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,Math.max(.5,this.sz*a),0,6.28);ctx.fill();ctx.restore();}
}
function burst(x,y,n,cols,spd,life,sz){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=spd*(.4+Math.random()*.6);particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,cols[~~(Math.random()*cols.length)],life,sz));}}
function hitFX(x,y,big){if(big){burst(x,y,22,['#FF6600','#FFCC00','#FF3300','#FFF'],9,28,7);shakeAmt=9;shakeT=14;}else{burst(x,y,12,['#FFCC00','#FF8800','#FFF'],6,18,5);shakeAmt=5;shakeT=7;}}
function deathFX(x,y,col){burst(x,y,25,[col,'#FFF','#FF6600'],9,35,8);shakeAmt=12;shakeT=20;}
function tickParticles(){for(let i=particles.length-1;i>=0;i--){particles[i].tick();if(particles[i].life<=0)particles.splice(i,1);}if(shakeT>0){shakeT--;if(!shakeT)shakeAmt=0;}}
function drawParticles(){for(const p of particles)p.draw();}

// ---------------------------------------------------------------- PROJECTILES
class Projectile{
  constructor(x,y,vx,vy,r,dmg,kbx,kby,owner,col,type='ball'){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.r=r;this.dmg=dmg;this.kbx=kbx;this.kby=kby;
    this.owner=owner;this.col=col;this.type=type;this.life=160;this.dead=false;this.hitSet=new Set();
    this.angle=Math.atan2(vy,vx);this.flipDone=false;
  }
  tick(){
    this.x+=this.vx;this.y+=this.vy;this.angle=Math.atan2(this.vy,this.vx);
    if(this.type==='boomerang'){this.life--;if(this.life<80&&!this.flipDone){this.vx*=-1;this.flipDone=true;}}
    else{this.life--;}
    if(this.x<-250||this.x>CW+250||this.y<-250||this.y>CH+250||this.life<=0)this.dead=true;
  }
  draw(){
    ctx.save();ctx.fillStyle=this.col;
    if(this.type==='energy'){ctx.shadowBlur=18;ctx.shadowColor=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(this.x,this.y,this.r*.55,0,6.28);ctx.fill();}
    else if(this.type==='ball'){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.28);ctx.fill();ctx.fillStyle='rgba(255,200,0,.6)';ctx.beginPath();ctx.arc(this.x-this.r*.3,this.y-this.r*.3,this.r*.4,0,6.28);ctx.fill();}
    else if(this.type==='arrow'){ctx.translate(this.x,this.y);ctx.rotate(this.angle);ctx.fillRect(-14,-2.5,28,5);ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(2,-6);ctx.lineTo(2,6);ctx.fill();}
    else if(this.type==='boomerang'){ctx.translate(this.x,this.y);ctx.rotate(gTime*0.018);ctx.fillRect(-11,-3,22,6);ctx.fillRect(-3,-11,6,22);}
    else if(this.type==='goofyface'){
      const r=this.r;ctx.translate(this.x,this.y);
      // Yellow circle face
      ctx.fillStyle='#FFCC00';ctx.strokeStyle='#000';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();ctx.stroke();
      // Left eye
      ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(-r*.28,-r*.22,r*.22,r*.28,0,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-r*.28-r*.08,-r*.22,r*.1,0,6.28);ctx.fill();
      // Right eye
      ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(r*.28,-r*.22,r*.22,r*.28,0,0,6.28);ctx.fill();ctx.stroke();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(r*.28+r*.06,-r*.22+r*.1,r*.1,0,6.28);ctx.fill();
      // Crooked smile
      ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-r*.42,r*.1);ctx.quadraticCurveTo(-r*.05,r*.28,r*.42,r*.1);ctx.stroke();
      // Tongue
      ctx.fillStyle='#880022';ctx.beginPath();ctx.moveTo(-r*.08,r*.18);ctx.lineTo(-r*.08,r*.48);ctx.lineTo(r*.12,r*.48);ctx.lineTo(r*.12,r*.18);ctx.closePath();ctx.fill();
      // Stray line (goofy detail)
      ctx.strokeStyle='#000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(-r*.42,r*.1);ctx.lineTo(r*.6,r*.05);ctx.stroke();
    }
    else{ctx.fillRect(this.x-this.r,this.y-this.r,this.r*2,this.r*2);}
    ctx.restore();
  }
  hits(f){
    if(f===this.owner||this.hitSet.has(f)||f.invincT>0)return false;
    if(f.state==='dead'||f.state==='spawn')return false;
    return Math.hypot(f.x+f.w/2-this.x,f.y+f.h/2-this.y)<this.r+Math.max(f.w,f.h)*.45;
  }
}

// ---------------------------------------------------------------- PHYSICS
const GRAV=0.45,TVEL=18,GFRIC=0.77,AFRIC=0.93;

// ---------------------------------------------------------------- FIGHTER BASE
class Fighter{
  constructor(cfg,x,y,idx){
    this.cfg=cfg;this.name=cfg.name;this.idx=idx;
    this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.w=cfg.w||50;this.h=cfg.h||65;
    this.facing=idx===0?1:-1;
    this.spd=cfg.spd||5;this.aspd=cfg.aspd||(cfg.spd*.75)||3.8;
    this.jp=cfg.jp||-14;this.wt=cfg.wt||100;this.maxJ=cfg.jumps||2;
    this.grav=cfg.grav||GRAV;this.pwr=cfg.pwr||1.0;
    this.grounded=false;this.jumpsLeft=this.maxJ;
    this.state='idle';this.stateT=0;
    this.stunT=0;this.atkCD=0;this.invincT=0;this.respawnT=0;
    this.dmg=0;this.stocks=3;
    this.hb=null;this.atkF=0;this.hitSet=new Set();
    this.shieldHP=100;this.animT=0;this.trail=[];
    this.isPrototype=false;
  }
  get cx(){return this.x+this.w*.5;}
  get cy(){return this.y+this.h*.5;}

  tick(platforms,fighters,projs){
    this.animT++;this.stateT++;
    if(this.state==='dead')return;
    if(this.state==='spawn'){if(--this.respawnT<=0)this.state='fall';return;}
    if(this.state==='grabbed')return;
    if(this.stunT>0)this.stunT--;if(this.atkCD>0)this.atkCD--;if(this.invincT>0)this.invincT--;
    if(!this.grounded||this.vy<0){this.vy+=this.grav;if(this.vy>TVEL)this.vy=TVEL;}
    if(this.hb){
      this.atkF++;
      const wx=this.x+this.w*.5+this.facing*this.hb.ox-this.hb.w*.5;
      const wy=this.y+this.h*.5+this.hb.oy-this.hb.h*.5;
      this.hb.wx=wx;this.hb.wy=wy;
      for(const fi of fighters){
        if(fi===this||this.hitSet.has(fi)||fi.invincT>0)continue;
        if(fi.state==='dead'||fi.state==='spawn')continue;
        const hb=wx<fi.x+fi.w&&wx+this.hb.w>fi.x&&wy<fi.y+fi.h&&wy+this.hb.h>fi.y;
        if(hb){
          this.hitSet.add(fi);
          if(fi.state==='shield'){fi.shieldHP-=this.hb.dmg*.35;this.vx=-this.facing*2.5;sfx('shield');}
          else{fi.takeHit(this.hb.dmg,this.facing*this.hb.kbx,this.hb.kby);hitFX(wx+this.hb.w*.5,wy+this.hb.h*.5,this.hb.dmg>10);sfx(this.hb.dmg>10?'bighit':'hit');}
        }
      }
      if(this.atkF>=this.hb.dur){this.hb=null;this.atkF=0;this.hitSet.clear();if(this.state==='atk'||this.state==='sp')this.state=this.grounded?'idle':'fall';}
    }
    this.x+=this.vx;this.y+=this.vy;
    this.grounded=false;
    for(const pl of platforms){
      const prevB=this.y+this.h-this.vy;
      if(this.vy>=0&&prevB<=pl.y&&this.y+this.h>=pl.y&&this.x+this.w>pl.x+3&&this.x<pl.x+pl.w-3){
        this.y=pl.y-this.h;this.vy=0;this.grounded=true;this.jumpsLeft=this.maxJ;
        if(this.state==='fall'||this.state==='hit')this.state='idle';break;
      }
    }
    if(this.grounded){if(this.state!=='hit'){this.vx*=GFRIC;if(Math.abs(this.vx)<.2)this.vx=0;}}else{this.vx*=AFRIC;}
    if((this.state==='idle'||this.state==='walk')&&!this.grounded)this.state=this.vy>0?'fall':'jump';
    if(this.state==='jump'&&this.vy>0)this.state='fall';
    if(this.state==='hit'&&this.stunT<=0)this.state=this.grounded?'idle':'fall';
    if(this.grounded&&(this.state==='idle'||this.state==='walk'))this.state=Math.abs(this.vx)>.4?'walk':'idle';
    if(this.state!=='shield')this.shieldHP=Math.min(100,this.shieldHP+.18);
    if((this.state==='atk'||this.state==='sp'||Math.abs(this.vx)>7)&&this.animT%3===0){this.trail.push({x:this.x,y:this.y,a:.55});if(this.trail.length>7)this.trail.shift();}
    for(const tr of this.trail)tr.a-=.08;
    this.trail=this.trail.filter(t=>t.a>0);
  }

  moveL(){if(this.stunT>25)return;const s=this.grounded?this.spd:this.aspd;this.vx=Math.max(-this.spd*(this.grounded?1:1.1),this.vx-s*.35);this.facing=-1;if(this.grounded&&this.state==='idle')this.state='walk';}
  moveR(){if(this.stunT>25)return;const s=this.grounded?this.spd:this.aspd;this.vx=Math.min(this.spd*(this.grounded?1:1.1),this.vx+s*.35);this.facing=1;if(this.grounded&&this.state==='idle')this.state='walk';}
  doJump(){if(this.jumpsLeft<=0||this.stunT>5)return;this.vy=this.jumpsLeft===this.maxJ?this.jp:this.jp*.82;this.jumpsLeft--;this.grounded=false;this.state='jump';sfx('jump');}
  doAtk(projs){if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=18;this.hb={ox:this.w*.5+2,oy:-2,w:38,h:28,dmg:7,kbx:4.5,kby:-2.5,dur:10};}
  doSp(projs){if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;this.state='sp';this.atkF=0;this.hitSet.clear();this.atkCD=36;this.hb={ox:this.w*.5-2,oy:-8,w:50,h:44,dmg:14,kbx:6.5,kby:-5.5,dur:18};sfx('sp');}
  doShield(){if(this.stunT>0)return;this.state='shield';}
  unShield(){if(this.state==='shield')this.state=this.grounded?'idle':'fall';}
  takeHit(dmg,kbx,kby){if(this.invincT>0)return;this.dmg+=dmg;const scale=.6+this.dmg/75;this.vx=kbx*scale*this.pwr;this.vy=kby*scale*this.pwr;this.stunT=14+~~(dmg*.95);this.state='hit';this.grounded=false;}
  spawnAt(stage){const sp=stage.spawns[this.idx%stage.spawns.length];this.x=sp.x;this.y=80;this.vx=0;this.vy=0;this.dmg=0;this.stunT=0;this.invincT=180;this.shieldHP=100;this.jumpsLeft=this.maxJ;this.hb=null;this.hitSet.clear();this.trail=[];this.state='spawn';this.respawnT=70;}
  oob(stage){const bz=stage.bz;return this.x+this.w<bz.l||this.x>bz.r||this.y>bz.b||this.y+this.h<bz.t;}

  draw(){
    if(this.state==='dead')return;
    // === 3D DROP SHADOW (Smash 64 style) ===
    if(curStage){
      let sY=this.y+this.h+600;
      for(const pl of curStage.plats){if(pl.x-10<this.cx&&pl.x+pl.w+10>this.cx&&pl.y>=this.y+this.h-2){if(pl.y<sY)sY=pl.y;}}
      const dist=sY-(this.y+this.h);
      const alpha=Math.max(0,0.4-dist*0.0009);
      const sx=Math.max(0.18,1-dist*0.003);
      if(alpha>0.01){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='rgba(0,0,0,0.88)';ctx.beginPath();ctx.ellipse(this.cx,sY,this.w*0.45*sx,5.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}
    }
    // Trail
    for(const tr of this.trail){ctx.save();ctx.globalAlpha=tr.a*.45;ctx.fillStyle=this.cfg.col;ctx.fillRect(tr.x,tr.y,this.w,this.h);ctx.restore();}
    ctx.save();
    if(this.invincT>0&&Math.floor(this.invincT/4)%2===1)ctx.globalAlpha=.38;
    if(this.state==='shield'){
      const r=Math.max(0,44*(this.shieldHP/100));ctx.save();ctx.globalAlpha=.42;ctx.fillStyle='#66AAFF';ctx.beginPath();ctx.arc(this.cx,this.cy,r,0,6.28);ctx.fill();ctx.strokeStyle='#AADDFF';ctx.lineWidth=3;ctx.stroke();ctx.restore();
    }
    this.drawBody();
    // === 3D SHADING OVERLAY (Smash 64 depth feel) ===
    ctx.save();
    const sg=ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.h);
    sg.addColorStop(0,'rgba(255,255,255,0.14)');sg.addColorStop(0.25,'rgba(255,255,255,0.03)');
    sg.addColorStop(0.75,'rgba(0,0,0,0.03)');sg.addColorStop(1,'rgba(0,0,0,0.22)');
    ctx.fillStyle=sg;ctx.fillRect(this.x,this.y,this.w,this.h);
    const sdg=ctx.createLinearGradient(this.x,0,this.x+this.w,0);
    sdg.addColorStop(0,'rgba(0,0,0,0.14)');sdg.addColorStop(0.2,'rgba(0,0,0,0)');
    sdg.addColorStop(0.8,'rgba(0,0,0,0)');sdg.addColorStop(1,'rgba(0,0,0,0.14)');
    ctx.fillStyle=sdg;ctx.fillRect(this.x,this.y,this.w,this.h);
    ctx.restore();
    if(this.stunT>35){for(let i=0;i<3;i++){const a=this.animT*.16+i*2.09;ctx.fillStyle='#FFFF44';ctx.font='13px serif';ctx.textAlign='center';ctx.fillText('★',this.cx+Math.cos(a)*22,this.y-8+Math.sin(a)*8);}}
    if(this.state==='spawn'){ctx.fillStyle=this.cfg.col;ctx.globalAlpha=.55+Math.sin(this.animT*.2)*.35;ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.fillText('▼ INCOMING',this.cx,this.y-25);}
    ctx.restore();
  }
  drawBody(){
    ctx.fillStyle=this.cfg.col;ctx.fillRect(this.x,this.y,this.w,this.h);
    ctx.fillStyle='white';ctx.fillRect(this.x+8,this.y+15,10,10);ctx.fillRect(this.x+30,this.y+15,10,10);
  }
}

// ================================================================ CHARACTERS
class BlueGuy extends Fighter{
  constructor(x,y,idx){super({name:'Blue Guy',col:'#2288FF',w:50,h:65,spd:5.5,aspd:4.2,jp:-14.5,wt:95,pwr:1,jumps:2,grav:.44},x,y,idx);}
  drawBody(){
    const t=this.animT,f=this.facing,bob=Math.sin(t*.09)*4;
    ctx.fillStyle='#2288FF';ctx.beginPath();ctx.arc(this.x+(f>0?-13:this.w+13),this.y+this.h*.66+bob,10,0,6.28);ctx.fill();
    const hxd=this.state==='atk'?(f>0?this.w+20:-20):13+2;
    const hyd=this.state==='atk'?-10:-bob;
    ctx.beginPath();ctx.arc(this.x+(f>0?this.w+hxd:-(hxd)),this.y+this.h*.66+hyd,10,0,6.28);ctx.fill();
    ctx.fillStyle='#2288FF';ctx.fillRect(this.x,this.y,this.w,this.h-8);
    ctx.fillStyle='rgba(0,30,100,.22)';ctx.fillRect(this.x+(f>0?0:this.w*.65),this.y,this.w*.35,this.h-8);
    const eX=f>0?this.x+8:this.x+this.w-30;
    ctx.fillStyle='white';ctx.fillRect(eX,this.y+16,10,10);ctx.fillRect(eX+16,this.y+16,10,10);
    ctx.fillStyle='#0044CC';ctx.fillRect(eX+3,this.y+18,5,7);ctx.fillRect(eX+19,this.y+18,5,7);
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(this.x+5,this.y+5,10,5);
  }
  doSp(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    this.state='sp';this.atkF=0;this.hitSet.clear();
    if(!this.grounded){this.vy=-18;this.vx=this.facing*6;this.atkCD=42;this.hb={ox:0,oy:-32,w:this.w,h:36,dmg:9,kbx:.5,kby:-7,dur:18};}
    else{this.atkCD=40;this.hb={ox:-22,oy:-10,w:this.w+44,h:this.h+20,dmg:11,kbx:5.5,kby:-4,dur:24};}
    sfx('sp');
  }
}

class RedGuy extends Fighter{
  constructor(x,y,idx){super({name:'Red Guy',col:'#CC1100',w:58,h:72,spd:4,aspd:3,jp:-12,wt:125,pwr:1.35,jumps:2,grav:.5},x,y,idx);}
  drawBody(){
    const f=this.facing;
    ctx.fillStyle='#881100';ctx.fillRect(this.x-8,this.y+12,15,22);ctx.fillRect(this.x+this.w-7,this.y+12,15,22);
    ctx.fillStyle='#CC1100';ctx.fillRect(this.x,this.y,this.w,this.h);
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(this.x,this.y,this.w*.28,this.h);
    ctx.fillStyle='#AA0000';ctx.fillRect(this.x+this.w*.28,this.y+20,this.w*.44,this.h*.5);
    const eX=f>0?this.x+10:this.x+this.w-38;
    ctx.fillStyle='#FF5500';ctx.fillRect(eX,this.y+22,14,9);ctx.fillRect(eX+18,this.y+22,14,9);
    ctx.strokeStyle='#660000';ctx.lineWidth=3;ctx.beginPath();
    if(f>0){ctx.moveTo(this.x+8,this.y+20);ctx.lineTo(this.x+26,this.y+24);}
    else{ctx.moveTo(this.x+32,this.y+24);ctx.lineTo(this.x+50,this.y+20);}
    ctx.stroke();
  }

  doAtk(projs){if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;this.vy-=3;this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=14;this.hb={ox:this.w*.5-8,oy:-22,w:44,h:38,dmg:8,kbx:4,kby:-4.5,dur:10};}

    const opp=fighters.find(f=>f!==this&&f.state!=='dead'&&f.state!=='spawn'&&!f.grabbedBy);
    if(!opp)return;

    sfx('sel');
  }
  tick(platforms,fighters,projs){
    if(this.grabPhase){this._tickGrab(platforms,fighters,projs);return;}
    super.tick(platforms,fighters,projs);
  }
  _tickGrab(platforms,fighters,projs){
    this.animT++;this.stateT++;this.grabT++;
    const opp=this.grabTarget;
    if(this.grabPhase==='approach'){
      this.vx=this.facing*9.5;
      if(!this.grounded){this.vy+=this.grav;if(this.vy>TVEL)this.vy=TVEL;}
      this.x+=this.vx;this.y+=this.vy;
      this.grounded=false;
      for(const pl of platforms){
        const prevB=this.y+this.h-this.vy;
        if(this.vy>=0&&prevB<=pl.y&&this.y+this.h>=pl.y&&this.x+this.w>pl.x+3&&this.x<pl.x+pl.w-3){
          this.y=pl.y-this.h;this.vy=0;this.grounded=true;this.jumpsLeft=this.maxJ;break;
        }
      }
      if(!opp||opp.state==='dead'||opp.state==='spawn'||opp.invincT>0){this._endGrab();return;}
      const reach=this.facing>0
        ?(opp.x<this.x+this.w+34&&opp.x+opp.w>this.x&&Math.abs((opp.y+opp.h*.5)-(this.y+this.h*.5))<this.h)
        :(opp.x+opp.w>this.x-34&&opp.x<this.x+this.w&&Math.abs((opp.y+opp.h*.5)-(this.y+this.h*.5))<this.h);
      if(reach){
        this.grabPhase='spawn';this.grabT=0;
        this.vx=0;
        opp.grabbedBy=this;opp.state='grabbed';opp.vx=0;opp.vy=0;opp.hb=null;opp.invincT=999999;
        let gy=this.y+this.h;
        for(const pl of platforms){if(this.x+this.w>pl.x&&this.x<pl.x+pl.w&&pl.y>=this.y){gy=Math.min(gy,pl.y);}}
        this.trampoline={x:this.x+this.w*.5-44,y:gy-10,w:88,h:14,t:0};
        burst(this.cx,this.cy,14,['#FFCC00','#FF8800','#FFF'],6,18,5);
        sfx('hit');
      } else if(this.grabT>26){
        this._endGrab();return;
      }
    } else if(this.grabPhase==='spawn'){
      this.trampoline.t++;
      if(this.trampoline.t>10){
        this.grabPhase='rise';this.grabT=0;
        this.vy=-9.5;this.grounded=false;
        sfx('jump');burst(this.trampoline.x+this.trampoline.w*.5,this.trampoline.y,16,['#FF8800','#FFCC00','#FFF'],7,22,6);
        shakeAmt=6;shakeT=10;
      }
      opp.x=this.x+this.facing*(this.w*.15);opp.y=this.y;opp.vx=0;opp.vy=0;
    } else if(this.grabPhase==='rise'){
      this.vy+=this.grav*.85;if(this.vy>TVEL)this.vy=TVEL;
      this.y+=this.vy;
      opp.x=this.x+this.facing*(this.w*.15);opp.y=this.y;opp.vx=0;opp.vy=0;
      if(this.vy>=0){
        this.grabPhase='throw';this.grabT=0;
        opp.grabbedBy=null;opp.invincT=10;
        opp.state='hit';opp.grounded=false;
        opp.vx=this.facing*13;opp.vy=-6;
        opp.stunT=30;opp.dmg+=6;
        hitFX(opp.cx,opp.cy,true);sfx('bighit');
        burst(opp.cx,opp.cy,18,['#FF8800','#FFCC00','#FFF','#FF3300'],9,26,6);
      }
    } else if(this.grabPhase==='throw'){
      this.vy+=this.grav;if(this.vy>TVEL)this.vy=TVEL;
      this.y+=this.vy;
      this.x+=this.vx;this.vx*=AFRIC;
      this.grounded=false;
      for(const pl of platforms){
        const prevB=this.y+this.h-this.vy;
        if(this.vy>=0&&prevB<=pl.y&&this.y+this.h>=pl.y&&this.x+this.w>pl.x+3&&this.x<pl.x+pl.w-3){
          this.y=pl.y-this.h;this.vy=0;this.grounded=true;this.jumpsLeft=this.maxJ;break;
        }
      }
      if(this.grounded||this.grabT>40)this._endGrab();
    }
    if(this.trampoline){this.trampoline.life=(this.trampoline.life||0)+1;if(this.trampoline.life>50&&this.grabPhase!=='spawn'&&this.grabPhase!=='rise')this.trampoline=null;}
    for(const tr of this.trail)tr.a-=.08;
    this.trail=this.trail.filter(t=>t.a>0);
  }
  _endGrab(){
    if(this.grabTarget){
      const opp=this.grabTarget;
      if(opp.grabbedBy===this){opp.grabbedBy=null;if(opp.invincT>9999)opp.invincT=10;if(opp.state==='grabbed')opp.state=opp.grounded?'idle':'fall';}
    }
    this.grabPhase=null;this.grabTarget=null;this.atkCD=20;
    this.state=this.grounded?'idle':'fall';
  }
  _drawTrampoline(){
    const tr=this.trampoline;
    ctx.save();
    ctx.fillStyle='#444';ctx.fillRect(tr.x-6,tr.y+8,8,18);ctx.fillRect(tr.x+tr.w-2,tr.y+8,8,18);
    ctx.fillStyle='#2299FF';ctx.fillRect(tr.x,tr.y,tr.w,8);

    for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(tr.x+4+i*(tr.w-8)/4,tr.y);ctx.lineTo(tr.x+4+i*(tr.w-8)/4,tr.y+8);ctx.stroke();}
    ctx.restore();
  }
}

class Prototype extends Fighter{
  constructor(x,y,idx){

  }
  takeHit(dmg,kbx,kby){
    if(this.invincT>0)return;
    // Reduced knockback — boss is anchored
    const ks=this.bossPhase===2?0.45:0.28;
    this.vx=kbx*ks;this.vy=kby*ks;
    this.stunT=Math.min(20,6+~~(dmg*0.45));
    this.state='hit';this.grounded=false;
    // Lose HP instead of damage %
    const hpLoss=dmg*0.65;
    this.bossHP=Math.max(0,this.bossHP-hpLoss);
    this.dmg+=dmg*0.2;
    // Enter phase 2 at 50 HP
    if(this.bossHP<=50&&this.bossPhase===1){
      this.bossPhase=2;this.enrageTimer=90;
      burst(this.cx,this.cy,35,['#FF3300','#FF6600','#FFCC00','#FFF'],11,38,8);
      shakeAmt=16;shakeT=30;sfx('boss');
    }
  }
  oob(stage){
    const bz=stage.bz;
    const out=this.x+this.w<bz.l||this.x>bz.r||this.y>bz.b||this.y+this.h<bz.t;
    if(out&&this.state!=='dead'){
      if(this.x+this.w<bz.l){this.x=bz.l+60;this.vx=8;}
      if(this.x>bz.r){this.x=bz.r-this.w-60;this.vx=-8;}
      if(this.y>bz.b){this.y=200;this.vy=0;}
      if(this.y+this.h<bz.t){this.y=bz.t+30;this.vy=5;}
      this.invincT=55;

      this.enrageTimer--;

    }

    ctx.fillStyle=e?'#FF3300':'#FFD700';ctx.shadowBlur=28;ctx.shadowColor=e?'#FF0000':'#FFAA00';

    // Chest diamond energy core
    ctx.fillStyle=e?'#FF2200':'#FFD700';

    ctx.beginPath();

      this.atkCD=e?35:46;

// ================================================================ BOSS AI — HARDEST DIFFICULTY
class BossAI{
  constructor(fighter){this.f=fighter;this.thinkT=0;this.strat='chase';this.stratT=0;}
  tick(fighters,platforms,projs){
    const me=this.f;
    if(me.state==='dead'||me.state==='spawn')return;
    this.thinkT++;
    const speed=me.bossPhase===2?2:4;
    if(this.thinkT<speed)return;
    this.thinkT=0;
    // Find target
    let tgt=null;
    for(const fi of fighters){if(fi!==me&&fi.state!=='dead'&&!fi.isPrototype){tgt=fi;break;}}
    if(!tgt)return;
    const dx=tgt.cx-me.cx,dy=tgt.cy-me.cy,dist=Math.hypot(dx,dy);
    const e=me.bossPhase===2,ag=e?1.65:1.0;
    // Rotate strategy
    this.stratT++;
    if(this.stratT>70){this.stratT=0;const r=Math.random();this.strat=r<0.45?'chase':r<0.7?'projectile':'blitz';}
    // Recovery
    if(me.y>560||me.x<55||me.x>CW-55){(dx>0?me.moveR():me.moveL());if(me.jumpsLeft>0)me.doJump();return;}
    // Dodge incoming projectiles
    for(const pr of projs){
      if(pr.owner===me)continue;
      if(Math.abs(pr.x-me.cx)<200&&Math.abs(pr.y-me.cy)<75){
        pr.x<me.cx?me.moveR():me.moveL();
        if(!me.grounded&&Math.random()<0.45)me.doJump();return;
      }
    }
    if(this.strat==='projectile'&&dist>130){
      if(me.atkCD===0&&dist<380)me.doSp(projs);
      if(dist<170){dx>0?me.moveL():me.moveR();}else{dx>0?me.moveR():me.moveL();}
    } else {
      if(dist>65){dx>0?me.moveR():me.moveL();if(dy<-65&&me.grounded&&Math.random()<0.5*ag)me.doJump();if(Math.abs(dy)<55&&Math.abs(dx)<85&&Math.random()<0.3*ag)me.doJump();}
      if(dist<120&&me.atkCD===0){const r=Math.random();if(r<0.42*ag)me.doAtk(projs);else if(r<0.62*ag)me.doSp(projs);}
      if(!me.grounded&&dist<240&&me.atkCD===0&&Math.random()<0.32*ag)me.doSp(projs);
    }
    if(e){
      if(dist<85&&me.atkCD===0&&Math.random()<0.65)me.doAtk(projs);
      if(dist<320&&me.atkCD===0&&Math.random()<0.28)me.doSp(projs);
    }
    if(dx>0)me.moveR();else me.moveL();
  }
}

// ---------------------------------------------------------------- ZAPNOODLE
class Zapnoodle extends Fighter{
  constructor(x,y,idx){
    super({name:'Zapnoodle',col:'#FFEE00',w:36,h:62,spd:6.5,aspd:5.5,jp:-16,wt:68,pwr:.9,jumps:3,grav:.38},x,y,idx);
    this.zapT=0; // zap trail timer
  }
  drawBody(){
    const f=this.facing,t=this.animT;
    // long noodle body — squiggly segments
    const seg=8,segH=this.h/seg;
    ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';
    // glow
    ctx.shadowBlur=14;ctx.shadowColor='#FFEE00';
    ctx.strokeStyle='#FFEE00';
    ctx.beginPath();
    for(let i=0;i<=seg;i++){
      const sy=this.y+i*segH;
      const sx=this.cx+(i%2===0?0:f*6)+Math.sin(t*.14+i)*(this.state==='walk'||this.state==='jump'?4:1.5);
      i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    ctx.shadowBlur=0;
    // inner yellow
    ctx.lineWidth=6;ctx.strokeStyle='#FFFAAA';
    ctx.beginPath();
    for(let i=0;i<=seg;i++){
      const sy=this.y+i*segH;
      const sx=this.cx+(i%2===0?0:f*6)+Math.sin(t*.14+i)*(this.state==='walk'||this.state==='jump'?4:1.5);
      i===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);
    }
    ctx.stroke();
    // head — round with lightning bolt eyes
    ctx.shadowBlur=10;ctx.shadowColor='#FFEE00';
    ctx.fillStyle='#FFEE00';ctx.beginPath();ctx.arc(this.cx,this.y+8,12,0,6.28);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(this.cx+(f>0?-4:2),this.y+7,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(this.cx+(f>0?4:10),this.y+7,4,0,6.28);ctx.fill();
    // zap pupils
    ctx.fillStyle='#FF8800';
    ctx.beginPath();ctx.arc(this.cx+(f>0?-4:2),this.y+8,2,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(this.cx+(f>0?4:10),this.y+8,2,0,6.28);ctx.fill();
    // lightning bolt on forehead
    ctx.fillStyle='#FF8800';ctx.strokeStyle='#FF4400';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(this.cx+1,this.y-3);ctx.lineTo(this.cx-3,this.y+2);ctx.lineTo(this.cx,this.y+2);ctx.lineTo(this.cx-2,this.y+7);ctx.lineTo(this.cx+4,this.y+1);ctx.lineTo(this.cx+1,this.y+1);ctx.closePath();ctx.fill();ctx.stroke();
    // zap sparks when attacking
    if(this.state==='atk'||this.state==='sp'){
      ctx.shadowBlur=12;ctx.shadowColor='#FFFF00';
      for(let i=0;i<4;i++){const a=t*.3+i*1.57;const r=20+Math.sin(t*.2+i)*6;ctx.fillStyle=i%2?'#FFFF00':'#FF8800';ctx.beginPath();ctx.arc(this.cx+Math.cos(a)*r,this.cy+Math.sin(a)*r,3,0,6.28);ctx.fill();}
      ctx.shadowBlur=0;
    }
  }
  doAtk(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // electric lash — wide short-range zap
    this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=16;
    this.hb={ox:this.w*.5-4,oy:-18,w:52,h:52,dmg:7,kbx:4,kby:-3.5,dur:10};
    burst(this.cx+this.facing*28,this.cy,6,['#FFEE00','#FFFAAA','#FF8800'],5,12,4);
    sfx('hit');
  }
  doSp(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // fire a zigzag lightning bolt projectile
    const p=new Projectile(this.x+(this.facing>0?this.w+4:-18),this.y+this.h*.2,this.facing*14,0,13,13,5.5,-4,this,'#FFEE00','energy');
    p.zapPhase=0;
    projs.push(p);
    this.atkCD=42;
    burst(this.cx,this.cy,10,['#FFEE00','#FFFAAA','#FF8800'],7,18,5);
    sfx('sp');
  }
}

class SirStumbles extends Fighter{
  constructor(x,y,idx){
    super({name:'Sir Stumbles',col:'#CC8844',w:54,h:70,spd:3.5,aspd:2.8,jp:-11.5,wt:130,pwr:1.45,jumps:2,grav:.52},x,y,idx);
    this.stumbleDir=1;this.stumbleT=0;
  }
  drawBody(){
    const f=this.facing,t=this.animT;
    const tilt=(this.state==='walk'||this.state==='hit')?Math.sin(t*.18)*.12:Math.sin(t*.06)*.05;
    ctx.save();ctx.translate(this.cx,this.y+this.h);ctx.rotate(tilt);
    // boots
    ctx.fillStyle='#553300';ctx.fillRect(-this.w*.5+2,- 14,20,14);ctx.fillRect(this.w*.5-22,-14,20,14);
    // legs — slightly bowed
    ctx.fillStyle='#884422';ctx.fillRect(-this.w*.5+5,-32,18,22);ctx.fillRect(this.w*.5-23,-32,18,22);
    // belly — big round pot belly
    ctx.fillStyle='#CC8844';ctx.beginPath();ctx.ellipse(0,-this.h*.48,this.w*.52,this.h*.38,0,0,6.28);ctx.fill();
    // arms
    const armSwing=Math.sin(t*.12)*(this.state==='walk'?0.4:0.1);
    ctx.fillStyle='#CC8844';
    ctx.save();ctx.translate(-this.w*.5+4,-this.h*.5);ctx.rotate(-armSwing);ctx.fillRect(-8,0,14,28);ctx.fillStyle='#FFCC99';ctx.fillRect(-9,26,16,12);ctx.restore();
    ctx.save();ctx.translate(this.w*.5-4,-this.h*.5);ctx.rotate(armSwing);ctx.fillRect(-6,0,14,28);ctx.fillStyle='#FFCC99';ctx.fillRect(-7,26,16,12);ctx.restore();
    // head
    ctx.fillStyle='#FFCC99';ctx.beginPath();ctx.arc(0,-this.h*.72,this.w*.38,0,6.28);ctx.fill();
    // big bushy moustache
    ctx.fillStyle='#664422';ctx.beginPath();ctx.ellipse(f>0?-6:6,-this.h*.65,14,6,-0.2,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(f>0?6:-6,-this.h*.65,14,6,0.2,0,6.28);ctx.fill();
    // eyes — wobbly
    const eyeWobble=this.stunT>0?Math.sin(t*.4)*3:0;
    ctx.fillStyle='#222';ctx.beginPath();ctx.arc(f>0?-8:0,-this.h*.77+eyeWobble,4,0,6.28);ctx.fill();ctx.beginPath();ctx.arc(f>0?4:12,-this.h*.77-eyeWobble,4,0,6.28);ctx.fill();
    // monocle
    ctx.strokeStyle='#AA8800';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(f>0?-8:0,-this.h*.77+eyeWobble,7,0,6.28);ctx.stroke();
    // top hat
    ctx.fillStyle='#221100';ctx.fillRect(-16,-this.h-.5,32,9);ctx.fillRect(-11,-this.h-30,22,32);
    ctx.fillStyle='#332211';ctx.fillRect(-11,-this.h-30,22,8);
    ctx.restore();
  }
  tick(platforms,fighters,projs){
    // Sir Stumbles randomly wobbles direction while walking
    this.stumbleT++;
    if(this.stumbleT>45&&this.grounded&&this.state==='walk'){
      if(Math.random()<0.18){this.vx+=(Math.random()-.5)*3;this.stumbleT=0;}
    }
    super.tick(platforms,fighters,projs);
  }
  doAtk(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // Big wild haymaker — slow but huge
    this.state='atk';this.atkF=0;this.hitSet.clear();this.atkCD=26;
    this.vx+=this.facing*4;
    this.hb={ox:this.w*.5-2,oy:-22,w:60,h:52,dmg:14,kbx:7,kby:-4,dur:16};
    sfx('bighit');
  }
  doSp(projs){
    if(this.atkCD>0||this.stunT>0||this.state==='atk'||this.state==='sp')return;
    // Stumble Charge — lurches forward dealing heavy damage on contact
    this.state='sp';this.atkF=0;this.hitSet.clear();this.atkCD=52;
    this.vx=this.facing*16;this.vy=-3;
    this.hb={ox:-10,oy:-8,w:this.w+20,h:this.h+8,dmg:20,kbx:9,kby:-6,dur:22};
    burst(this.cx,this.cy,12,['#CC8844','#FFCC99','#FFAA44'],7,20,6);
    sfx('sp');
  }
}

// ================================================================ STAGE RENDERING
let bgT=0;
function renderStage(stage){
  bgT++;
  const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,stage.bg[0]);g.addColorStop(1,stage.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  switch(stage.theme){
    case'forge':_bgForge();break;case'toy':_bgToy();break;case'sky':_bgSky();break;
    case'forest':_bgForest();break;case'lava':_bgLava();break;case'city':_bgCity();break;
    case'desert':_bgDesert();break;case'ice':_bgIce();break;case'final':_bgFinal();break;
    case'tower':_bgTower();break;case'rocket':_bgRocket();break;
  }
  for(const pl of stage.plats)_drawPlat(pl,stage.theme);
  for(const hz of stage.hazards||[])_drawHazard(hz);
}

// ================================================================ AI CONTROLLER
class AICtrl{
  constructor(fighter,diff){
    this.f=fighter;this.diff=diff;this.thinkI=[30,18,10,5][diff];this.thinkT=0;
    this.rand=[.75,.42,.2,.06][diff];this.atkRng=[120,95,75,60][diff];
    this.jpChance=[.18,.38,.6,.8][diff];this.spChance=[.08,.18,.32,.5][diff];this.shChance=[.05,.14,.3,.52][diff];
  }
  tick(fighters,platforms,projs){
    const me=this.f;
    if(me.state==='dead'||me.state==='spawn')return;
    this.thinkT++;if(this.thinkT<this.thinkI)return;this.thinkT=0;
    let tgt=null,bestD=Infinity;
    for(const fi of fighters){if(fi===me||fi.state==='dead'||fi.state==='spawn')continue;const d=Math.hypot(fi.cx-me.cx,fi.cy-me.cy);if(d<bestD){bestD=d;tgt=fi;}}
    if(!tgt)return;
    const dx=tgt.cx-me.cx,dy=tgt.cy-me.cy,dist=Math.hypot(dx,dy);
    if(me.y>570||me.x<40||me.x>CW-40){this._recover(platforms);return;}
    let danger=null;
    for(const pr of projs){if(pr.owner===me)continue;if(Math.abs(pr.x-me.cx)<220&&Math.abs(pr.y-me.cy)<80){danger=pr;break;}}
    if(danger&&Math.random()>this.rand*2){if(Math.random()<this.shChance){me.doShield();return;}danger.x<me.cx?me.moveR():me.moveL();if(!me.grounded&&Math.random()<.5)me.doJump();return;}
    if(Math.random()<this.rand){const r=Math.random();if(r<.3)me.moveL();else if(r<.6)me.moveR();else if(r<.8)me.doJump();return;}
    if(dist>this.atkRng){dx>0?me.moveR():me.moveL();if(dy<-70&&me.grounded&&Math.random()<this.jpChance)me.doJump();if(Math.abs(dy)<40&&Math.abs(dx)<90&&Math.random()<this.jpChance*.5)me.doJump();}
    else{me.unShield();const roll=Math.random();if(roll<this.spChance&&me.atkCD===0){me.doSp(projs);dx>0?me.moveR():me.moveL();}else if(roll<.78&&me.atkCD===0){me.doAtk(projs);dx>0?me.moveR():me.moveL();}else if(roll<.9&&Math.random()<this.shChance){me.doShield();}else{me.unShield();}if(dy<-60&&Math.random()<.3)me.doJump();}
  }
  _recover(platforms){const me=this.f;let nearX=CW*.5,nearY=540,nearD=Infinity;for(const pl of platforms){const d=Math.hypot(me.cx-(pl.x+pl.w*.5),me.cy-pl.y);if(d<nearD){nearD=d;nearX=pl.x+pl.w*.5;nearY=pl.y;}}nearX>me.cx?me.moveR():me.moveL();if((me.y+me.h>nearY||me.vy>0)&&me.jumpsLeft>0)me.doJump();else if(me.jumpsLeft===0)me.doSp([]);}
}

class GameItem{
  constructor(x,y,def){
    this.x=x;this.y=y;this.def=def;this.w=34;this.h=34;
    this.vy=0;this.grounded=false;this.dead=false;
    this.bobT=Math.random()*6.28;
    this.isBomb=false;this.bombTimer=0;this.owner=null;
  }
  tick(platforms,fighters,projs,items){
    this.bobT+=0.06;
    if(this.isBomb){
      this.bombTimer--;
      if(this.bombTimer<=0){
        // EXPLODE
        burst(this.x+this.w*.5,this.y+this.h*.5,28,['#FF4400','#FFCC00','#FF8800','#FFF'],12,35,8);
        shakeAmt=12;shakeT=18;sfx('bighit');
        for(const fi of fighters){
          if(Math.hypot(fi.cx-(this.x+this.w*.5),fi.cy-(this.y+this.h*.5))<130){
            const kx=fi.cx>(this.x+this.w*.5)?7:-7;
            fi.takeHit(22,kx,-8);
          }
        }
        this.dead=true;return;
      }
    }
    if(!this.grounded){this.vy+=0.45;if(this.vy>14)this.vy=14;this.y+=this.vy;}
    for(const pl of platforms){
      const prevB=this.y+this.h-this.vy;
      if(this.vy>=0&&prevB<=pl.y&&this.y+this.h>=pl.y&&this.x+this.w>pl.x&&this.x<pl.x+pl.w){
        this.y=pl.y-this.h;this.vy=0;this.grounded=true;break;
      }
    }
    if(this.isBomb)return; // bombs don't get picked up
    // check fighter pickup
    for(const fi of fighters){
      if(fi.state==='dead'||fi.state==='spawn')continue;
      if(fi.x<this.x+this.w&&fi.x+fi.w>this.x&&fi.y<this.y+this.h&&fi.y+fi.h>this.y){
        // picked up!
        this.def.apply(fi,projs,fighters,items);
        this.dead=true;
        // show floating text
        fi._itemMsg=this.def.name;fi._itemMsgT=120;
        return;
      }
    }
  }
  draw(){
    if(this.dead)return;
    const bx=this.x;
    const by=this.isBomb?this.y:this.y+Math.sin(this.bobT)*5;
    ctx.save();
    // glow
    ctx.shadowBlur=16;ctx.shadowColor=this.def.col;
    // box
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.strokeStyle=this.def.col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,this.w,this.h,7):ctx.rect(bx,by,this.w,this.h);ctx.fill();ctx.stroke();
    ctx.shadowBlur=0;
    // icon
    ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.def.icon,bx+this.w*.5,by+this.h*.5);
    ctx.textBaseline='alphabetic';
    // bomb countdown
    if(this.isBomb){
      const frac=this.bombTimer/120;
      const pulse=Math.sin(gTime*(frac<0.3?0.5:0.25))*0.5+0.5;
      ctx.globalAlpha=0.55+pulse*.45;
      ctx.fillStyle=frac<0.3?'#FF2200':'#FF8800';
      ctx.font=`bold 11px monospace`;ctx.textAlign='center';
      ctx.fillText(Math.ceil(this.bombTimer/60*10)/10+'s',bx+this.w*.5,by-5);
    }
    ctx.restore();
  }
}

// Shell projectile bounce logic — hook into Projectile.tick
const _origProjTick=Projectile.prototype.tick;
Projectile.prototype.tick=function(){
  if(this.type==='shell'){
    this.x+=this.vx;this.y+=this.vy;this.vy+=0.35;
    if(this.y>CH-120&&this.bounces>0){this.vy*=-0.7;this.bounces--;if(Math.abs(this.vy)<1)this.vy=-2;}
    if(this.x<40&&this.bounces>0){this.vx=Math.abs(this.vx);this.bounces--;}
    if(this.x>CW-40&&this.bounces>0){this.vx=-Math.abs(this.vx);this.bounces--;}
    this.life--;if(this.life<=0||this.bounces<0)this.dead=true;
    return;
  }
  _origProjTick.call(this);
};
const _origProjDraw=Projectile.prototype.draw;
Projectile.prototype.draw=function(){
  if(this.type==='shell'){
    ctx.save();ctx.fillStyle='#886633';ctx.strokeStyle='#553300';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(this.x,this.y,14,10,Math.atan2(this.vy,this.vx),0,6.28);ctx.fill();ctx.stroke();
    ctx.fillStyle='#CCAA55';ctx.beginPath();ctx.ellipse(this.x-2,this.y-2,6,4,0,0,6.28);ctx.fill();
    ctx.restore();return;
  }
  _origProjDraw.call(this);
};

// Items array & spawn timer
let gameItems=[];
let itemSpawnTimer=0;
const ITEM_SPAWN_INTERVAL=7200; // every 2 minutes

function spawnItem(){
  if(!curStage)return;
  const def=ITEM_DEFS[~~(Math.random()*ITEM_DEFS.length)];
  // pick a random platform to drop item on
  const plat=curStage.plats[~~(Math.random()*curStage.plats.length)];
  const ix=plat.x+20+Math.random()*(Math.max(0,plat.w-40));
  gameItems.push(new GameItem(ix,plat.y-80,def));
}

function tickItems(){
  for(let i=gameItems.length-1;i>=0;i--){
    gameItems[i].tick(curStage.plats,fighters,projs,gameItems);
    if(gameItems[i].dead)gameItems.splice(i,1);
  }
  // tick item timers on fighters
  for(const f of fighters){
    if(f._edTimer>0){f._edTimer--;if(f._edTimer===0){f.spd=f._itemSpd;f.aspd=(f._itemSpd*.75);f.jp=f._itemJp;}}
    if(f._coinTimer>0){f._coinTimer--;if(f._coinTimer===0){f.pwr=f._coinPwr;}}
    if(f._turboTimer>0){f._turboTimer--;if(f._turboTimer===0){f.pwr=f._turboPwr;f.spd=f._turboSpd;}}
    if(f._itemMsgT>0)f._itemMsgT--;
  }
  itemSpawnTimer++;
  const minStocks=fighters.length>0?Math.min(...fighters.map(f=>f.stocks>=1?f.stocks:3)):3;
  const activeInterval=minStocks<=2?3600:ITEM_SPAWN_INTERVAL; // 1min at 1-2 stocks, 2min otherwise
  if(itemSpawnTimer>=activeInterval&&gameItems.filter(it=>!it.isBomb).length<4){
    spawnItem();itemSpawnTimer=0;
  }
}

function drawItems(){
  for(const it of gameItems)it.draw();
  // draw pickup messages

      ctx.shadowBlur=0;ctx.restore();
    }
  }
}

// ================================================================ GAME UPDATE
function updateGame(){
  gTime++;
  for(const ai of aiCtrls)ai.tick(fighters,curStage.plats,projs);
  for(const f of fighters){
    f.tick(curStage.plats,fighters,projs);
    if(f.state!=='dead'&&f.state!=='spawn'&&f.oob(curStage)){
      sfx('death');deathFX(f.cx,f.cy,f.cfg.col);
      f.stocks--;
      if(f.stocks<=0){f.state='dead';}
      else f.spawnAt(curStage);
    }
  }
  // Boss HP → death
  if(storyBossMode){
    const boss=fighters.find(f=>f.isPrototype);
    if(boss&&boss.bossHP<=0&&boss.state!=='dead'){
      boss.state='dead';deathFX(boss.cx,boss.cy,boss.cfg.col);sfx('death');
      burst(boss.cx,boss.cy,55,['#FFD700','#FF6600','#FFF','#FFCC00','#FF3300'],14,55,10);
      shakeAmt=20;shakeT=45;
    }
  }
  // Projectiles
  for(let i=projs.length-1;i>=0;i--){
    const pr=projs[i];pr.tick();
    for(const fi of fighters){
      if(pr.hits(fi)){fi.takeHit(pr.dmg,pr.kbx*Math.sign(pr.vx),pr.kby);hitFX(pr.x,pr.y,pr.dmg>12);sfx(pr.dmg>12?'bighit':'hit');pr.hitSet.add(fi);pr.dead=true;break;}
    }
    if(pr.dead)projs.splice(i,1);
  }
  // Hazards
  for(const hz of curStage.hazards||[]){
    if(hz.type==='lava'){for(const f of fighters){if(f.state==='dead'||f.state==='spawn'||f.invincT>0)continue;if(f.x+f.w>hz.x&&f.x<hz.x+hz.w&&f.y+f.h>hz.y&&f.y<hz.y+38)f.takeHit(2,0,-5);}}
    else if(hz.type==='laser'){for(const f of fighters){if(f.state==='dead'||f.state==='spawn'||f.invincT>0)continue;if(f.x+f.w>hz.x&&f.x<hz.x+hz.w&&f.y+f.h>hz.y&&f.y<hz.y+hz.h)f.takeHit(3,0,-7);}}
  }
  tickParticles();
  tickItems();
  // Win check
  const alive=fighters.filter(f=>f.state!=='dead');
  if(alive.length<=1&&fighters.length>1){
    winnerIdx=alive.length===1?fighters.indexOf(alive[0]):-1;
    if(storyMode){
      sfx('win');
      if(winnerIdx===0){storeClearT=0;phase='storyclear';}
      else{storyLives--;if(storyLives<=0){storyGameOverT=0;phase='storygameover';}else{storyFailT=0;phase='storyfail';}}
    } else {vicT=0;phase='victory';sfx('win');}
  }
}

function drawStoryMap(){

    ctx.fillStyle='#AA4400';ctx.font='14px monospace';ctx.fillText('100 HP · Phase 2 at 50% · Extremely aggressive',CW*.5,502);

  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,CW,CH);
  ctx.shadowBlur=10;ctx.shadowColor='#FF6600';ctx.fillStyle='#FF9944';ctx.font='bold 46px Georgia,serif';ctx.textAlign='center';ctx.fillText('CONTROLS',CW*.5,75);ctx.shadowBlur=0;
  const P1=[['Move','A  /  D'],['Jump','W'],['Normal Attack','J'],['Special Attack','K'],['Shield (hold)','L']];
  const P2=[['Move','← / →'],['Jump','↑'],['Normal Attack','Numpad 1'],['Special Attack','Numpad 2'],['Shield (hold)','Numpad 3']];
  ctx.fillStyle='#3366FF';ctx.font='bold 26px Georgia,serif';ctx.textAlign='center';ctx.fillText('PLAYER 1',CW*.28,148);
  for(let i=0;i<P1.length;i++){const y=195+i*54;ctx.fillStyle='#888';ctx.font='20px monospace';ctx.textAlign='left';ctx.fillText(P1[i][0],CW*.06,y);ctx.fillStyle='#FFCC44';ctx.textAlign='right';ctx.fillText(P1[i][1],CW*.48,y);}
  ctx.strokeStyle='#2a2a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(CW*.5,135);ctx.lineTo(CW*.5,500);ctx.stroke();
  ctx.fillStyle='#FF3333';ctx.font='bold 26px Georgia,serif';ctx.textAlign='center';ctx.fillText('PLAYER 2',CW*.72,148);
  for(let i=0;i<P2.length;i++){const y=195+i*54;ctx.fillStyle='#888';ctx.font='20px monospace';ctx.textAlign='left';ctx.fillText(P2[i][0],CW*.53,y);ctx.fillStyle='#FFCC44';ctx.textAlign='right';ctx.fillText(P2[i][1],CW*.95,y);}
  ctx.fillStyle='#556';ctx.font='17px monospace';ctx.textAlign='center';ctx.fillText('ESC during game — Quit to menu',CW*.5,548);
  ctx.fillStyle='#FF9944';ctx.font='20px Georgia,serif';ctx.fillText('~ COMBAT TIPS ~',CW*.5,598);
  ctx.fillStyle='#AA7744';ctx.font='16px Georgia,serif';ctx.fillText('Higher damage % = more knockback!  ·  Ring-outs lose a stock!',CW*.5,630);ctx.fillText('Hold Shield to block  ·  Specials (K/Numpad2) have cool-downs.',CW*.5,658);
  ctx.fillStyle='#444';ctx.font='14px monospace';ctx.fillText('ESC — Back',CW*.5,CH-18);
  if(jp['Escape'])phase='menu';
}

// ================================================================ MAIN LOOP
function loop(){
  ctx.clearRect(0,0,CW,CH);
  switch(phase){
    case'menu':     inputMenu();    drawMenu();       break;
    case'levelinput':inputLevelInput();drawLevelInput();break;
    case'charsel':  inputCharSel(); drawCharSel();    break;
    case'stagesel': inputStageSel();drawStageSel();   break;
    case'game':     inputGame();    updateGame();     drawGame(); break;
    case'victory':                  drawVictory();    break;
    case'opts':     inputOpts();    drawOpts();       break;
    case'controls':                 drawControls();   break;
    // Story mode phases
    case'storymap':     inputStoryMap();     drawStoryMap();     break;
    case'storytitle':   inputStoryTitle();   drawStoryTitle();   break;
    case'storyclear':   inputStoryClear();   drawStoryClear();   break;
    case'storyfail':    inputStoryFail();    drawStoryFail();    break;
    case'storygameover':inputStoryGameOver();drawStoryGameOver();break;
    case'storycomplete':inputStoryComplete();drawStoryComplete();break;
  }
  clearJP();
  requestAnimationFrame(loop);
}

let gTime2=0;
Object.defineProperty(window,'gTime',{get:()=>gTime2,set:v=>{gTime2=v;}});
gTime=0;
requestAnimationFrame(loop);
</script>
