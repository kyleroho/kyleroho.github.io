<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DUNGEON DEPTHS — Pixel Forge Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;color:#eee;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
canvas{display:block;image-rendering:pixelated;border:2px solid #333;box-shadow:0 0 40px rgba(255,100,0,.15);touch-action:none;max-width:96vw;}
#stage{position:relative;line-height:0;}
#pausebtn{position:absolute;top:8px;right:8px;width:44px;height:44px;font-size:20px;line-height:1;background:rgba(0,0,0,.55);color:#ffd700;border:1px solid rgba(255,215,0,.5);border-radius:8px;cursor:pointer;touch-action:none;z-index:5;}
#pausebtn:active{background:rgba(255,215,0,.25);}
#touchbar{display:none;gap:10px;margin-top:8px;justify-content:center;}
.tbtn{min-width:96px;min-height:48px;font-size:18px;font-family:inherit;color:#fff;background:#2a1a08;border:1px solid #a60;border-radius:10px;cursor:pointer;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 12px;}
.tbtn small{font-size:10px;color:#f84;}
.tbtn:active{background:#4a2a10;}
@media (pointer:coarse){#touchbar{display:flex;}}
@media (max-width:480px){#ui{font-size:11px;gap:10px;}.bar{width:64px;}}
#ui{display:flex;gap:16px;align-items:center;padding:8px 16px;flex-wrap:wrap;justify-content:center;font-size:12px;max-width:640px;width:100%;}
#ui span{color:#aaa;}#ui b{color:#fff;}
.bar-wrap{display:flex;align-items:center;gap:6px;}
.bar{height:10px;border-radius:3px;overflow:hidden;background:#222;width:80px;}
.bar-fill{height:100%;border-radius:3px;transition:width .3s;}
#hpbar .bar-fill{background:linear-gradient(90deg,#c00,#f44);}
#mpbar .bar-fill{background:linear-gradient(90deg,#006,#44f);}
#xpbar .bar-fill{background:linear-gradient(90deg,#660,#ff0);}
a{color:#f84;font-size:11px;text-decoration:none;}a:hover{color:#fc8;}
</style>
</head>
<body>
<div id="ui">
  <div class="bar-wrap" id="hpbar"><span>❤️</span><div class="bar"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div><b id="hp-txt">20/20</b></div>
  <div class="bar-wrap" id="mpbar"><span>💙</span><div class="bar"><div class="bar-fill" id="mp-fill" style="width:100%"></div></div><b id="mp-txt">10/10</b></div>
  <div class="bar-wrap" id="xpbar"><span>⭐</span><div class="bar"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div><b id="xp-txt">Lv1</b></div>
  <span>💰<b id="gold-txt">0</b></span>
  <span>🏆<b id="floor-txt">Floor 1</b></span>
  <span>🏅<b id="best-txt">–</b></span>
  <span id="msg-txt" style="color:#f84;"></span>
  <a href="index.html">← Back</a>
</div>
<div id="stage">
<canvas id="c" width="640" height="480"></canvas>
<button id="pausebtn" aria-label="Pause">⏸️</button>
</div>
<div id="touchbar">
  <button class="tbtn" id="btn-fire">🔥<small>Fireball</small></button>
  <button class="tbtn" id="btn-heal">✨<small>Heal</small></button>
</div>

<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=640,H=480,TS=32; // tile size
const COLS=20,ROWS=15;

// ── COLOURS ──
const COL={
  wall:'#1a0a00',wallLit:'#3a1a08',floor:'#0d0d0d',floorLit:'#1a1510',
  player:'#4fc3f7',enemy:'#f44',boss:'#f84',item:'#ffd700',
  stairs:'#88ff88',door:'#8b4513',
  fireball:'#ff6600',slash:'#88ccff',
  ui:'#ffd700',
};

// ── TILES ──
const T={WALL:0,FLOOR:1,DOOR:2,STAIRS:3,CHEST:4};

// ── STATE ──
let map=[],rooms=[],entities=[],items=[];
let px=1,py=1,floor=1;
let hp=20,maxHp=20,mp=10,maxMp=10,xp=0,xpNext=50,gold=0,level=1;
let atk=5,def=2,spells=['Fireball','Heal'];
let camX=0,camY=0;
let msgs=[],msgTimer=0;
let gameState='playing'; // playing, dead, levelup, paused, won
let selectedSpell=0;
let keys={};
let visMap=[];
let animTick=0;
let particles=[];
let levelUpChoices=[];

// ── DEPTHS: biomes, elites, relics ──
const FINAL_FLOOR=7;
const BIOMES=[
  {name:'Ember Caves',   wall:'#1a0a00',wallLit:'#3a1a08',floor:'#0d0d0d',floorLit:'#1a1510',foe:'Goblin',     foeEmoji:'👺'},
  {name:'Crystal Caverns',wall:'#0a0618',wallLit:'#2a1a4e',floor:'#0b0b14',floorLit:'#181430',foe:'Cave Bat',   foeEmoji:'🦇'},
  {name:'Sunken Halls',  wall:'#001014',wallLit:'#083038',floor:'#0a0e0e',floorLit:'#122a28',foe:'Drowned One',foeEmoji:'🧟'},
  {name:'The Abyss',     wall:'#100006',wallLit:'#30060a',floor:'#0a0708',floorLit:'#1c0c10',foe:'Abyss Spawn',foeEmoji:'😈'},
];
function biomeFor(f){
  if(f<=2) return BIOMES[0];
  if(f<=4) return BIOMES[1];
  if(f<=6) return BIOMES[2];
  return BIOMES[3];
}
function lightRange(){ return Math.max(3, 6-Math.floor((floor-1)/2)); }

// Relics from chests — blessed and cursed
let hexAtk=0;    // +enemy atk from the Greed Idol
let vampHeal=0;  // heal-on-kill from the Vampiric Fang
let relics=[];
const RELICS=[
  {name:'Whetstone',     desc:'+3 ATK',                 cursed:false, apply:()=>{atk+=3;}},
  {name:'Heart Vial',    desc:'+8 Max HP',              cursed:false, apply:()=>{maxHp+=8;hp=Math.min(maxHp,hp+8);}},
  {name:'Mana Crystal',  desc:'+5 Max MP',              cursed:false, apply:()=>{maxMp+=5;mp=Math.min(maxMp,mp+5);}},
  {name:'Iron Skin',     desc:'+2 DEF',                 cursed:false, apply:()=>{def+=2;}},
  {name:'Cursed Blade',  desc:'+5 ATK, −6 Max HP',      cursed:true,  apply:()=>{atk+=5;maxHp-=6;hp=Math.min(hp,maxHp);}},
  {name:'Greed Idol',    desc:'+40 gold, foes +1 ATK',  cursed:true,  apply:()=>{gold+=40;hexAtk+=1;}},
  {name:'Vampiric Fang', desc:'Heal 3 on kill, −2 DEF', cursed:true,  apply:()=>{vampHeal+=3;def-=2;}},
];

// Tap-to-move pathing
let autoPath=[];
let autoAttack=null;
let lastStepT=0;

// ── SAVE (best run) ──
const SAVE_KEY='pfg2_dungeon_depths';
let save={bestFloor:0,bestLevel:0,wins:0};
function loadSave(){
  try{
    // Migrate any legacy key, never wipe
    for(const k of ['dungeon_depths_save','dungeonDepthsSave',SAVE_KEY]){
      const raw=localStorage.getItem(k);
      if(raw){ const d=JSON.parse(raw); if(d&&typeof d==='object') save=Object.assign(save,d); }
    }
    localStorage.setItem(SAVE_KEY,JSON.stringify(save));
  }catch(e){/* storage unavailable */}
}
function writeSave(){
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){}
}
function noteProgress(){
  if(floor>save.bestFloor) save.bestFloor=floor;
  if(level>save.bestLevel) save.bestLevel=level;
  writeSave();
}

// ── MAP GENERATION ──
function genMap(){
  map=Array.from({length:ROWS},()=>Array(COLS).fill(T.WALL));
  visMap=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  rooms=[];entities=[];items=[];

  // Dig rooms
  const attempts=40;
  for(let a=0;a<attempts;a++){
    const rw=3+Math.floor(Math.random()*5);
    const rh=3+Math.floor(Math.random()*4);
    const rx=1+Math.floor(Math.random()*(COLS-rw-2));
    const ry=1+Math.floor(Math.random()*(ROWS-rh-2));
    // Check overlap
    let ok=true;
    for(const r of rooms){
      if(rx<r.x+r.w+1&&rx+rw>r.x-1&&ry<r.y+r.h+1&&ry+rh>r.y-1){ok=false;break;}
    }
    if(ok){
      for(let y=ry;y<ry+rh;y++) for(let x=rx;x<rx+rw;x++) map[y][x]=T.FLOOR;
      rooms.push({x:rx,y:ry,w:rw,h:rh});
    }
    if(rooms.length>=8) break;
  }

  // Safety: need a start room and a separate stairs room
  if(rooms.length<2){ genMap(); return; }

  // Connect rooms with corridors
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1],b=rooms[i];
    const ax=a.x+Math.floor(a.w/2),ay=a.y+Math.floor(a.h/2);
    const bx=b.x+Math.floor(b.w/2),by=b.y+Math.floor(b.h/2);
    let cx=ax,cy=ay;
    while(cx!==bx){cx+=cx<bx?1:-1;if(cy>0&&cy<ROWS-1)map[cy][cx]=T.FLOOR;}
    while(cy!==by){cy+=cy<by?1:-1;if(cx>0&&cx<COLS-1)map[cy][cx]=T.FLOOR;}
  }

  // Spawn player in first room
  const r0=rooms[0];
  px=r0.x+1;py=r0.y+1;

  // Stairs in last room
  const rLast=rooms[rooms.length-1];
  map[rLast.y+1][rLast.x+1]=T.STAIRS;

  // Enemies
  for(let i=1;i<rooms.length;i++){
    const r=rooms[i];
    const isBossRoom=i===rooms.length-1;
    if(isBossRoom){
      spawnEnemy(r.x+Math.floor(r.w/2),r.y+Math.floor(r.h/2),true);
    } else {
      const n=1+Math.floor(Math.random()*2)+Math.floor(floor/2);
      for(let j=0;j<Math.min(n,3);j++){
        const ex=r.x+1+Math.floor(Math.random()*(r.w-2));
        const ey=r.y+1+Math.floor(Math.random()*(r.h-2));
        spawnEnemy(ex,ey,false);
      }
    }
  }

  // Items/chests
  for(let i=0;i<rooms.length;i++){
    if(Math.random()<0.4){
      const r=rooms[i];
      items.push({x:r.x+Math.floor(r.w/2),y:r.y+Math.floor(r.h/2),
        type:Math.random()<0.5?'hp':'mp',picked:false});
    }
  }

  // Relic chests (T.CHEST was defined but never placed)
  const chestRooms=rooms.filter((r,i)=>i>0&&i<rooms.length-1);
  if(chestRooms.length){
    const r=chestRooms[Math.floor(Math.random()*chestRooms.length)];
    for(let t=0;t<10;t++){
      const cx=r.x+1+Math.floor(Math.random()*(r.w-2));
      const cy=r.y+1+Math.floor(Math.random()*(r.h-2));
      if(map[cy][cx]===T.FLOOR
        &&!entities.some(e=>!e.dead&&e.x===cx&&e.y===cy)
        &&!items.some(i=>i.x===cx&&i.y===cy)){
        map[cy][cx]=T.CHEST;break;
      }
    }
  }

  computeVis();
}

function spawnEnemy(x,y,boss){
  const B=biomeFor(floor);
  const finalBoss=boss&&floor>=FINAL_FLOOR;
  let hp=boss?(finalBoss?220:30+floor*15):(8+floor*3+Math.floor(Math.random()*6));
  let eAtk=boss?(finalBoss?22:4+floor*2):(2+floor);
  let name=boss?(finalBoss?'THE ABYSSAL HEART':`BOSS Lv${floor}`):B.foe;
  let emoji=boss?(finalBoss?'💀':'👹'):B.foeEmoji;
  let elite=false;
  if(!boss&&Math.random()<0.10+floor*0.02){
    elite=true;hp=Math.floor(hp*1.6);eAtk+=2;name='Elite '+name;
  }
  entities.push({x,y,hp,maxHp:hp,atk:eAtk,
    boss,elite,dead:false,moveTimer:0,name,emoji,id:Math.random()});
}

// ── VISIBILITY ──
function computeVis(){
  // Simple FOV: mark tiles near player as visible.
  // Old "visible" tiles decay to "seen" first (fixes see-through-walls).
  const range=lightRange();
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(visMap[y][x]===2) visMap[y][x]=1;
  }
  for(let dy=-range;dy<=range;dy++){
    for(let dx=-range;dx<=range;dx++){
      const nx=px+dx,ny=py+dy;
      if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>range) continue;
      // Raycast
      const steps=Math.ceil(dist*2);
      let blocked=false;
      for(let s=1;s<steps;s++){
        const rx=Math.round(px+dx*s/steps);
        const ry=Math.round(py+dy*s/steps);
        if(rx<0||rx>=COLS||ry<0||ry>=ROWS) break;
        if(map[ry][rx]===T.WALL){blocked=true;break;}
      }
      if(!blocked){
        visMap[ny][nx]=2; // visible
      }
    }
  }
}

// ── CAMERA ──
function updateCam(){
  const tw=TS,th=TS;
  const targetX=px*tw-W/2+tw/2;
  const targetY=py*th-H/2+th/2;
  camX+=(targetX-camX)*0.15;
  camY+=(targetY-camY)*0.15;
  camX=Math.max(0,Math.min(camX,COLS*tw-W));
  camY=Math.max(0,Math.min(camY,ROWS*th-H));
}

// ── MOVEMENT ──
// Returns true if the step was consumed (moved/attacked/opened/descended)
function tryMove(dx,dy){
  const nx=px+dx,ny=py+dy;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS) return false;
  if(map[ny][nx]===T.WALL) return false;

  // Attack enemy?
  const enemy=entities.find(e=>e.x===nx&&e.y===ny&&!e.dead);
  if(enemy){
    attackEnemy(enemy);
    return true;
  }

  // Open chest?
  if(map[ny][nx]===T.CHEST){
    openChest(nx,ny);
  }

  // Pick up item?
  const item=items.find(i=>i.x===nx&&i.y===ny&&!i.picked);
  if(item){
    item.picked=true;
    if(item.type==='hp'){hp=Math.min(maxHp,hp+8);msg('❤️ +8 HP',COL.item);}
    else{mp=Math.min(maxMp,mp+5);msg('💙 +5 MP',COL.item);}
    spawnParticles(nx*TS+TS/2-camX,ny*TS+TS/2-camY,COL.item,8);
  }

  // Stairs?
  if(map[ny][nx]===T.STAIRS){
    floor++;
    noteProgress();
    autoPath=[];autoAttack=null;
    msg(`⬇️ Floor ${floor} — ${biomeFor(floor).name}!`,COL.stairs);
    genMap();
    updateHUD();
    return true;
  }

  px=nx;py=ny;
  computeVis();
  enemyTurn();
  return true;
}

function openChest(x,y){
  map[y][x]=T.FLOOR;
  const relic=RELICS[Math.floor(Math.random()*RELICS.length)];
  relics.push(relic.name);
  relic.apply();
  msg((relic.cursed?'☠️ CURSED: ':'🎁 ')+relic.name+'! '+relic.desc,
    relic.cursed?'#c9a0ff':'#ffd700');
  spawnParticles(x*TS+TS/2-camX,y*TS+TS/2-camY,
    relic.cursed?'#a060ff':COL.item,12);
}

function attackEnemy(e){
  const dmg=Math.max(1,atk-Math.floor(Math.random()*2)+Math.floor(Math.random()*3));
  e.hp-=dmg;
  spawnParticles(e.x*TS+TS/2-camX,e.y*TS+TS/2-camY,COL.slash,6);
  msg(`⚔️ Hit ${e.name} for ${dmg}!`,'#88ccff');
  if(e.hp<=0){
    e.dead=true;
    const xpGain=(e.boss?(20+floor*10):(5+floor*2))*(e.elite?2:1);
    const goldGain=(e.boss?(15+floor*5):(2+floor))*(e.elite?2:1);
    xp+=xpGain;gold+=goldGain;
    msg(`💀 Killed! +${xpGain}XP +${goldGain}💰`,COL.item);
    spawnParticles(e.x*TS+TS/2-camX,e.y*TS+TS/2-camY,'#ff4400',20);
    onKill(e);
    if(gameState!=='won') checkLevelUp();
  }
  enemyTurn();
}

// Shared kill effects: relic heals + final-boss victory
function onKill(e){
  if(vampHeal>0&&hp>0) hp=Math.min(maxHp,hp+vampHeal);
  if(e.boss&&floor>=FINAL_FLOOR) winGame();
}

function winGame(){
  gameState='won';
  autoPath=[];autoAttack=null;
  save.wins++;noteProgress();
  msg('🏆 THE ABYSSAL HEART IS SLAIN!','#ffd700');
  updateHUD();
}

function enemyTurn(){
  if(gameState!=='playing') return;
  for(const e of entities){
    if(e.dead) continue;
    const dist=Math.abs(e.x-px)+Math.abs(e.y-py);
    if(dist<=8){
      // Move toward player
      if(dist>1){
        const dx=Math.sign(px-e.x),dy=Math.sign(py-e.y);
        // Try horizontal then vertical
        if(dx!==0&&map[e.y][e.x+dx]!==T.WALL&&!entities.find(o=>!o.dead&&o.x===e.x+dx&&o.y===e.y)){
          e.x+=dx;
        } else if(dy!==0&&map[e.y+dy]&&map[e.y+dy][e.x]!==T.WALL&&!entities.find(o=>!o.dead&&o.x===e.x&&o.y===e.y+dy)){
          e.y+=dy;
        }
      }
      // Attack player
      if(Math.abs(e.x-px)+Math.abs(e.y-py)===1){
        const dmg=Math.max(0,e.atk+hexAtk-def+Math.floor(Math.random()*2));
        hp-=dmg;
        msg(`${e.emoji} ${e.name} hit you for ${dmg}!`,'#ff4444');
        spawnParticles(px*TS+TS/2-camX,py*TS+TS/2-camY,'#ff0000',4);
        if(hp<=0){hp=0;gameState='dead';noteProgress();}
      }
    }
  }
  updateHUD();
}

function castSpell(){
  if(selectedSpell===0){ // Fireball
    if(mp<4){msg('Not enough MP!','#f84');return;}
    mp-=4;
    // Hit nearest enemy in range
    const targets=entities.filter(e=>!e.dead&&Math.sqrt((e.x-px)**2+(e.y-py)**2)<=5);
    if(targets.length===0){msg('No target!','#f84');return;}
    const t=targets.sort((a,b)=>(Math.abs(a.x-px)+Math.abs(a.y-py))-(Math.abs(b.x-px)+Math.abs(b.y-py)))[0];
    const dmg=atk*2+5;
    t.hp-=dmg;
    spawnParticles(t.x*TS+TS/2-camX,t.y*TS+TS/2-camY,COL.fireball,15);
    msg(`🔥 Fireball! ${dmg} dmg!`,COL.fireball);
    if(t.hp<=0){
      t.dead=true;xp+=10+floor*3;gold+=3;
      msg('💀 Burned!',COL.fireball);
      onKill(t);
      if(gameState!=='won') checkLevelUp();
    }
  } else { // Heal
    if(mp<3){msg('Not enough MP!','#f84');return;}
    mp-=3;
    const heal=Math.floor(maxHp*0.3);
    hp=Math.min(maxHp,hp+heal);
    spawnParticles(px*TS+TS/2-camX,py*TS+TS/2-camY,'#00ff88',10);
    msg(`✨ Healed ${heal} HP!`,'#00ff88');
  }
  updateHUD();
}

function checkLevelUp(){
  if(xp>=xpNext){
    xp-=xpNext;xpNext=Math.floor(xpNext*1.5);level++;
    gameState='levelup';
    levelUpChoices=[
      {name:'Strength',desc:`ATK +${2+level}`,apply:()=>{atk+=2+level;}},
      {name:'Vitality',desc:`Max HP +${8+level*2}`,apply:()=>{maxHp+=8+level*2;hp=Math.min(hp+8,maxHp);}},
      {name:'Arcana',desc:`Max MP +5, spells stronger`,apply:()=>{maxMp+=5;mp=Math.min(mp+5,maxMp);}},
      {name:'Defense',desc:`DEF +${1+Math.floor(level/2)}`,apply:()=>{def+=1+Math.floor(level/2);}},
    ];
    // shuffle, pick 3
    levelUpChoices.sort(()=>Math.random()-.5);
    levelUpChoices=levelUpChoices.slice(0,3);
  }
}

// ── PARTICLES ──
function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    particles.push({x,y,vx:(Math.random()-.5)*4,vy:-1-Math.random()*3,
      color,life:30,maxLife:30,size:2+Math.random()*3});
  }
}

// ── MESSAGES ──
function msg(text,color='#fff'){
  msgs.unshift({text,color,life:120});
  if(msgs.length>4) msgs.pop();
  document.getElementById('msg-txt').textContent=text;
  document.getElementById('msg-txt').style.color=color;
}

// ── HUD ──
function updateHUD(){
  document.getElementById('hp-fill').style.width=(hp/maxHp*100)+'%';
  document.getElementById('hp-txt').textContent=`${hp}/${maxHp}`;
  document.getElementById('mp-fill').style.width=(mp/maxMp*100)+'%';
  document.getElementById('mp-txt').textContent=`${mp}/${maxMp}`;
  document.getElementById('xp-fill').style.width=(xp/xpNext*100)+'%';
  document.getElementById('xp-txt').textContent=`Lv${level}`;
  document.getElementById('gold-txt').textContent=gold;
  document.getElementById('floor-txt').textContent=`Floor ${floor} · ${biomeFor(floor).name}`;
  document.getElementById('best-txt').textContent=
    save.bestFloor?`F${save.bestFloor}${save.wins?` 🏆${save.wins}`:''}`:'–';
}

// ── DRAW ──
function drawTile(x,y,vis){
  const t=map[y][x];
  const sx=x*TS-camX,sy=y*TS-camY;
  if(sx+TS<0||sx>W||sy+TS<0||sy>H) return;

  const B=biomeFor(floor);
  const dim=vis===1?0.35:1;
  ctx.globalAlpha=dim;

  if(t===T.WALL){
    ctx.fillStyle=vis===2?B.wallLit:B.wall;
    ctx.fillRect(sx,sy,TS,TS);
    // Top highlight
    ctx.fillStyle='rgba(255,255,255,0.05)';
    ctx.fillRect(sx,sy,TS,2);
  } else {
    ctx.fillStyle=vis===2?B.floorLit:B.floor;
    ctx.fillRect(sx,sy,TS,TS);
    // Floor dots
    if(vis===2){
      ctx.fillStyle='rgba(255,255,255,0.03)';
      ctx.fillRect(sx+8,sy+8,2,2);
      ctx.fillRect(sx+22,sy+22,2,2);
    }
  }

  if(vis===2){
    if(t===T.STAIRS){
      ctx.fillStyle=COL.stairs;
      ctx.font='20px serif';
      ctx.textAlign='center';
      ctx.fillText('▼',sx+TS/2,sy+TS/2+7);
    }
    if(t===T.CHEST){
      ctx.font='20px serif';
      ctx.textAlign='center';
      ctx.fillText('🎁',sx+TS/2,sy+TS/2+7);
    }
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  // Tiles
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(visMap[y][x]>0) drawTile(x,y,visMap[y][x]);
  }

  // Items
  for(const item of items){
    if(item.picked||visMap[item.y]?.[item.x]!==2) continue;
    const sx=item.x*TS-camX,sy=item.y*TS-camY;
    ctx.font='18px serif';ctx.textAlign='center';
    ctx.fillText(item.type==='hp'?'❤️':'💙',sx+TS/2,sy+TS/2+6);
  }

  // Entities
  for(const e of entities){
    if(e.dead||visMap[e.y]?.[e.x]!==2) continue;
    const sx=e.x*TS-camX,sy=e.y*TS-camY;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.ellipse(sx+TS/2,sy+TS-4,8,4,0,0,Math.PI*2);ctx.fill();
    // Emoji
    ctx.font=(e.boss?'24px':'18px')+' serif';
    ctx.textAlign='center';
    ctx.fillText(e.emoji,sx+TS/2,sy+TS/2+7);
    // Elite ring
    if(e.elite){
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;
      ctx.strokeRect(sx+3,sy+3,TS-6,TS-6);
      ctx.lineWidth=1;
    }
    // HP bar
    const bw=TS-4,bh=4;
    ctx.fillStyle='#300';ctx.fillRect(sx+2,sy+2,bw,bh);
    ctx.fillStyle=e.boss?'#f84':'#f44';
    ctx.fillRect(sx+2,sy+2,bw*(e.hp/e.maxHp),bh);
  }

  // Player
  {
    const sx=px*TS-camX,sy=py*TS-camY;
    // Glow
    ctx.shadowColor=COL.player;ctx.shadowBlur=12;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.ellipse(sx+TS/2,sy+TS-4,8,4,0,0,Math.PI*2);ctx.fill();
    ctx.font='20px serif';ctx.textAlign='center';
    ctx.fillText('🧙',sx+TS/2,sy+TS/2+7);
    ctx.shadowBlur=0;
  }

  // Particles
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=2;
  }
  ctx.globalAlpha=1;

  // Messages
  msgs.forEach((m,i)=>{
    m.life--;
    ctx.globalAlpha=Math.min(1,m.life/30);
    ctx.fillStyle=m.color;
    ctx.font='12px "Courier New"';ctx.textAlign='left';
    ctx.fillText(m.text,8,H-16-i*18);
  });
  msgs=msgs.filter(m=>m.life>0);
  ctx.globalAlpha=1;

  // Spell bar
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.fillRect(W-140,H-50,130,42);
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.strokeRect(W-140,H-50,130,42);
  spells.forEach((s,i)=>{
    const sel=i===selectedSpell;
    ctx.fillStyle=sel?'rgba(255,215,0,.2)':'rgba(255,255,255,.05)';
    ctx.fillRect(W-134+i*62,H-44,56,32);
    if(sel){ctx.strokeStyle='#ffd700';ctx.lineWidth=1;ctx.strokeRect(W-134+i*62,H-44,56,32);}
    ctx.fillStyle=sel?'#ffd700':'#aaa';
    ctx.font='10px "Courier New"';ctx.textAlign='center';
    ctx.fillText(['🔥 F','✨ H'][i],W-106+i*62,H-26);
    ctx.fillText(['4MP','3MP'][i],W-106+i*62,H-16);
    ctx.lineWidth=1;
  });
  ctx.fillStyle='#666';ctx.font='10px "Courier New"';ctx.textAlign='left';
  ctx.fillText('[Q/E] spell [F] cast',W-134,H-54);

  // Overlays
  if(gameState==='dead') drawDead();
  if(gameState==='won') drawWon();
  if(gameState==='levelup') drawLevelUp();
  if(gameState==='paused') drawPaused();
}

function drawDead(){
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f44';ctx.font='bold 48px "Courier New"';ctx.textAlign='center';
  ctx.fillText('YOU DIED',W/2,H/2-20);
  ctx.fillStyle='#aaa';ctx.font='16px "Courier New"';
  ctx.fillText(`Floor ${floor} — Level ${level} — ${gold}💰 gold`,W/2,H/2+20);
  ctx.fillStyle='#ffd700';ctx.font='14px "Courier New"';
  ctx.fillText('Press R to restart',W/2,H/2+60);
}

function drawWon(){
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 36px "Courier New"';ctx.textAlign='center';
  ctx.fillText('🏆 DEPTHS CONQUERED!',W/2,H/2-40);
  ctx.fillStyle='#aaa';ctx.font='16px "Courier New"';
  ctx.fillText(`Level ${level} — ${gold}💰 gold — ${relics.length} relics`,W/2,H/2+0);
  ctx.fillStyle='#8f8';ctx.font='14px "Courier New"';
  ctx.fillText(`Wins: ${save.wins}`,W/2,H/2+28);
  ctx.fillStyle='#ffd700';ctx.font='14px "Courier New"';
  ctx.fillText('Press R to delve again',W/2,H/2+60);
}

function drawPaused(){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 40px "Courier New"';ctx.textAlign='center';
  ctx.fillText('⏸️ PAUSED',W/2,H/2-10);
  ctx.fillStyle='#aaa';ctx.font='14px "Courier New"';
  ctx.fillText('Press P / Esc or tap ⏸️ to resume',W/2,H/2+24);
}

function drawLevelUp(){
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 32px "Courier New"';ctx.textAlign='center';
  ctx.fillText(`⭐ LEVEL UP! Lv${level}`,W/2,H/2-100);
  ctx.fillStyle='#aaa';ctx.font='13px "Courier New"';
  ctx.fillText('Choose an upgrade:',W/2,H/2-65);
  levelUpChoices.forEach((c,i)=>{
    const bx=W/2-180,by=H/2-40+i*60;
    ctx.fillStyle='rgba(255,215,0,.1)';ctx.fillRect(bx,by,360,50);
    ctx.strokeStyle='rgba(255,215,0,.4)';ctx.strokeRect(bx,by,360,50);
    ctx.fillStyle='#ffd700';ctx.font='bold 14px "Courier New"';ctx.textAlign='left';
    ctx.fillText(`[${i+1}] ${c.name}`,bx+12,by+20);
    ctx.fillStyle='#aaa';ctx.font='12px "Courier New"';
    ctx.fillText(c.desc,bx+12,by+38);
  });
}

// ── INPUT ──
function togglePause(){
  if(gameState==='playing'){gameState='paused';autoPath=[];autoAttack=null;}
  else if(gameState==='paused'){gameState='playing';}
}

document.addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){
    if(gameState==='playing'||gameState==='paused'){e.preventDefault();togglePause();}
    return;
  }
  if(gameState==='dead'||gameState==='won'){
    if(e.key==='r'||e.key==='R'){restart();}
    return;
  }
  if(gameState==='levelup'){
    const n=parseInt(e.key);
    if(n>=1&&n<=levelUpChoices.length){
      levelUpChoices[n-1].apply();
      gameState='playing';
      msg(`💪 ${levelUpChoices[n-1].name} upgraded!`,'#ffd700');
      updateHUD();
    }
    return;
  }
  if(gameState!=='playing') return;
  e.preventDefault();
  const mv={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
    KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
  if(mv[e.code]){autoPath=[];autoAttack=null;tryMove(...mv[e.code]);}
  if(e.code==='KeyQ') selectedSpell=(selectedSpell-1+spells.length)%spells.length;
  if(e.code==='KeyE') selectedSpell=(selectedSpell+1)%spells.length;
  if(e.code==='KeyF') castSpell();
  if(e.code==='Space') castSpell();
});

// ── TAP-TO-MOVE (grid BFS; also enables desktop click-to-move) ──
function walkableForPath(x,y){
  if(x<0||y<0||x>=COLS||y>=ROWS) return false;
  if(map[y][x]===T.WALL) return false;
  if(entities.some(o=>!o.dead&&o.x===x&&o.y===y)) return false;
  return true;
}
function findPath(sx,sy,tx,ty){
  if(sx===tx&&sy===ty) return [];
  const prev=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  const q=[[sx,sy]];prev[sy][sx]=[sx,sy];
  while(q.length){
    const [cx,cy]=q.shift();
    if(cx===tx&&cy===ty) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(!walkableForPath(nx,ny)||prev[ny][nx]) continue;
      prev[ny][nx]=[cx,cy];
      q.push([nx,ny]);
    }
  }
  if(!prev[ty][tx]) return [];
  const path=[];let c=[tx,ty];
  while(!(c[0]===sx&&c[1]===sy)){path.unshift({x:c[0],y:c[1]});c=prev[c[1]][c[0]];}
  return path;
}
function tapTile(tx,ty){
  if(tx<0||tx>=COLS||ty<0||ty>=ROWS||gameState!=='playing') return;
  autoPath=[];autoAttack=null;
  const foe=entities.find(o=>!o.dead&&o.x===tx&&o.y===ty);
  if(foe){
    if(Math.abs(foe.x-px)+Math.abs(foe.y-py)===1){tryMove(foe.x-px,foe.y-py);return;}
    // Walk up to a free tile beside the enemy, then bump-attack
    let best=null,bd=1e9;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ax=foe.x+dx,ay=foe.y+dy;
      if(!walkableForPath(ax,ay)) continue;
      const d=Math.abs(ax-px)+Math.abs(ay-py);
      if(d<bd){bd=d;best={x:ax,y:ay};}
    }
    if(best){autoPath=findPath(px,py,best.x,best.y);if(autoPath.length)autoAttack=foe;}
    return;
  }
  if(!walkableForPath(tx,ty)) return;
  autoPath=findPath(px,py,tx,ty);
}
function stepAuto(now){
  if(gameState!=='playing'){autoPath=[];autoAttack=null;return;}
  if(!autoPath.length&&!autoAttack) return;
  if(now-lastStepT<150) return;
  lastStepT=now;
  // Stop and let the player react if a hostile closes in (unless it's our chosen target)
  const threat=entities.find(e=>!e.dead&&e!==autoAttack
    &&Math.abs(e.x-px)+Math.abs(e.y-py)===1);
  if(threat){
    autoPath=[];autoAttack=null;
    msg('⚠️ Enemy nearby!','#f84');
    return;
  }
  if(autoPath.length){
    const s=autoPath[0];
    const dx=s.x-px,dy=s.y-py;
    if(dx===0&&dy===0){autoPath.shift();return;}
    if(Math.abs(dx)+Math.abs(dy)!==1){autoPath=[];autoAttack=null;return;} // safety: never cut corners
    const ok=tryMove(dx,dy);
    if(px===s.x&&py===s.y) autoPath.shift();      // moved onto the node
    else if(!ok){autoPath=[];autoAttack=null;}     // blocked
    // else: bump-attacked in place — keep the head node and retry next tick
    return;
  }
  // Path done: finish the bump-attack if the target is still beside us
  if(autoAttack&&!autoAttack.dead
    &&Math.abs(autoAttack.x-px)+Math.abs(autoAttack.y-py)===1){
    tryMove(autoAttack.x-px,autoAttack.y-py);
  }
  autoAttack=null;
}

C.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=C.getBoundingClientRect();
  const tx=Math.floor((e.clientX-r.left)/r.width*COLS);
  const ty=Math.floor((e.clientY-r.top)/r.height*ROWS);
  tapTile(tx,ty);
});
C.addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('pausebtn').addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();togglePause();
});
function bindSpellBtn(id,idx){
  document.getElementById(id).addEventListener('pointerdown',e=>{
    e.preventDefault();
    if(gameState!=='playing') return;
    selectedSpell=idx;castSpell();
  });
}
bindSpellBtn('btn-fire',0);
bindSpellBtn('btn-heal',1);

// No pull-to-refresh / scroll fighting on touch
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&gameState==='playing') togglePause();
});

// Fit canvas to screen, preserving 4:3
function fitGame(){
  const availW=Math.min(window.innerWidth*0.96,640);
  const availH=Math.max(200,window.innerHeight-200);
  let w=availW,h=w*3/4;
  if(h>availH){h=availH;w=h*4/3;}
  C.style.width=w+'px';C.style.height=h+'px';
}
window.addEventListener('resize',fitGame);
window.addEventListener('orientationchange',()=>setTimeout(fitGame,120));

function restart(){
  hp=20;maxHp=20;mp=10;maxMp=10;xp=0;xpNext=50;gold=0;level=1;
  atk=5;def=2;floor=1;gameState='playing';msgs=[];particles=[];
  selectedSpell=0;hexAtk=0;vampHeal=0;relics=[];
  autoPath=[];autoAttack=null;
  genMap();updateHUD();
}

// ── LOOP ──
function loop(){
  animTick++;
  stepAuto(performance.now());
  updateCam();
  draw();
  requestAnimationFrame(loop);
}

loadSave();
genMap();
updateHUD();
fitGame();
loop();
</script>
