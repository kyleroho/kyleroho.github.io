<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Worm Wars</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{touch-action:none;overscroll-behavior:none;}
body{background:#080808;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;}
canvas{display:block;border:2px solid #222;touch-action:none;}
#hud{width:640px;height:40px;background:#0a0a0a;border:2px solid #222;border-bottom:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
.hp{font-size:12px;letter-spacing:1px;}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080808ee;z-index:20;}
#msg h1{font-size:50px;font-weight:900;letter-spacing:4px;color:#ffcc44;margin-bottom:8px;text-align:center;}
#msg p{color:#444;font-size:13px;margin-bottom:22px;text-align:center;line-height:2.4;}
.btn{background:transparent;border:2px solid #ffcc44;color:#ffcc44;padding:12px 36px;font-size:14px;letter-spacing:3px;cursor:pointer;transition:all .2s;}
.btn:hover{background:#ffcc4422;}
#menuStats{color:#555;font-size:12px;margin-top:18px;letter-spacing:1px;text-align:center;line-height:2;}
#pauseBtn{position:fixed;top:10px;right:10px;z-index:80;width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid #888;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#pauseOv{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.65);z-index:30;color:#ffcc44;font-size:34px;font-weight:900;letter-spacing:4px;}
#pauseOv span{font-size:13px;color:#888;letter-spacing:2px;margin-top:10px;font-weight:400;}
.tbtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;z-index:70;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
.tbtn:active{background:rgba(255,255,255,.30);}
#dUp{left:96px;bottom:calc(176px + env(safe-area-inset-bottom));}
#dDn{left:96px;bottom:calc(16px + env(safe-area-inset-bottom));}
#dLt{left:16px;bottom:calc(96px + env(safe-area-inset-bottom));}
#dRt{left:176px;bottom:calc(96px + env(safe-area-inset-bottom));}
</style>
</head>
<body>
<button id="pauseBtn" aria-label="Pause">⏸</button>
<div id="pauseOv">PAUSED<span>PRESS P TO RESUME</span></div>
<div id="hud">
  <span class="hp" style="color:#ff6644">P1 ●●●●● <span id="s1">0</span></span>
  <span style="color:#555;font-size:10px;letter-spacing:3px;">WORM WARS</span>
  <span class="hp" style="color:#4488ff"><span id="s2">0</span> ●●●●● P2</span>
</div>
<canvas id="cv" width="640" height="480"></canvas>
<div id="touchUI" style="display:none">
  <button class="tbtn" id="dUp" aria-label="Up">▲</button>
  <button class="tbtn" id="dDn" aria-label="Down">▼</button>
  <button class="tbtn" id="dLt" aria-label="Left">◀</button>
  <button class="tbtn" id="dRt" aria-label="Right">▶</button>
</div>
<div id="msg">
  <h1>WORM WARS</h1>
  <p id="hint"><b style="color:#ff6644">P1</b> WASD to slither<br><b style="color:#4488ff">P2</b> Arrow Keys<br><br>Crash into the other worm to kill them.<br>Eat food to grow. First to 5 wins!</p>
  <button class="btn" onclick="startGame()">▶ BATTLE</button>
  <div id="menuStats"></div>
</div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=640,H=480,T=10;
var COLS=W/T,ROWS=H/T;
var keys={};
var worms=[],food=[],particles=[];
var score=[0,0];
var gameState='menu',frame=0;
var SPEED=6; // frames per move
var paused=false,roundOver=false;
var sdMargin=0,sdTick=0,bestLen=0; // sudden-death shrinking arena
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var aiMode=isTouch; // touch: P1 on dpad/swipe, P2 becomes an AI bot. Desktop keyboard 2P unchanged.

var LSKEY='pfg2_worm_wars';
function loadStats(){try{var s=JSON.parse(localStorage.getItem(LSKEY));if(s&&typeof s.p1==='number')return s;}catch(e){}return{p1:0,p2:0,best:0};}
function saveStats(){try{localStorage.setItem(LSKEY,JSON.stringify(stats));}catch(e){}}
var stats=loadStats();

var WORM_DEFS=[
  {col:'#ff6644',headCol:'#ff8866',dir:{x:1,y:0},startX:5,startY:ROWS/2|0,keys:{up:'w',dn:'s',lt:'a',rt:'d'}},
  {col:'#4488ff',headCol:'#66aaff',dir:{x:-1,y:0},startX:COLS-6,startY:ROWS/2|0,keys:{up:'ArrowUp',dn:'ArrowDown',lt:'ArrowLeft',rt:'ArrowRight'}},
];

function makeWorm(def,i){
  var segs=[];
  for(var j=0;j<6;j++) segs.push({x:def.startX-(def.dir.x*j),y:def.startY});
  return{segs:segs,dir:{x:def.dir.x,y:def.dir.y},nextDir:{x:def.dir.x,y:def.dir.y},
    col:def.col,headCol:def.headCol,keys:def.keys,alive:true,pid:i,growQ:0,
    moveEvery:SPEED,boost:0};
}

function startGame(){
  document.getElementById('msg').style.display='none';
  document.getElementById('pauseOv').style.display='none';
  paused=false;roundOver=false;
  sdMargin=0;sdTick=0;bestLen=0;
  worms=WORM_DEFS.map(function(d,i){return makeWorm(d,i);});
  food=[];particles=[];frame=0;
  spawnFood();spawnFood();spawnFood();
  gameState='play';
}

function spawnFood(){
  var occ=new Set();
  worms.forEach(function(w){w.segs.forEach(function(s){occ.add(s.x+','+s.y);});});
  food.forEach(function(f){occ.add(f.x+','+f.y);});
  var tries=0,x,y;
  do{x=1+Math.floor(Math.random()*(COLS-2));y=1+Math.floor(Math.random()*(ROWS-2));tries++;}
  while(occ.has(x+','+y)&&tries<100);
  var r=Math.random();
  var type=r<.07?'boost':r<.12?'gold':r<.30?'mega':'normal';
  food.push({x,y,anim:Math.random()*Math.PI*2,type:type});
}

// Simple AI for P2 on touch devices: seeks food, avoids walls/bodies, fears enemy head.
function aiThink(w){
  var dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
  var head=w.segs[0];
  var other=worms[1-w.pid];
  var oh=(other&&other.alive)?other.segs[0]:null;
  var best=null,bestScore=-1e9;
  dirs.forEach(function(d){
    if(d.x===-w.dir.x&&d.y===-w.dir.y) return; // no 180° reversal
    var nx=head.x+d.x,ny=head.y+d.y;
    if(nx<sdMargin||nx>=COLS-sdMargin||ny<sdMargin||ny>=ROWS-sdMargin) return;
    if(w.segs.some(function(s){return s.x===nx&&s.y===ny;})) return;
    if(other&&other.alive&&other.segs.some(function(s){return s.x===nx&&s.y===ny;})) return;
    var sc=0;
    if(oh&&(Math.abs(oh.x-nx)+Math.abs(oh.y-ny))<=1) sc-=50; // head-on danger
    var nf=1e9;
    food.forEach(function(f){var dd=Math.abs(f.x-nx)+Math.abs(f.y-ny);if(dd<nf)nf=dd;});
    sc-=nf; // closer food = better
    var free=0;
    dirs.forEach(function(d2){var ax=nx+d2.x,ay=ny+d2.y;
      if(ax>=sdMargin&&ax<COLS-sdMargin&&ay>=sdMargin&&ay<ROWS-sdMargin)free++;});
    sc+=free*2; // prefer open space
    sc+=Math.random()*2;
    if(sc>bestScore){bestScore=sc;best=d;}
  });
  if(best) w.nextDir={x:best.x,y:best.y};
}

function update(){
  if(gameState!=='play') return;
  frame++;

  if(roundOver){
    // freeze worms after a kill, keep food/particles animating
    food.forEach(function(f){f.anim+=.06;});
    for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1);}
    return;
  }

  // sudden death: after 45s the arena starts shrinking
  if(frame>2700){
    sdTick++;
    if(sdTick>=300){sdTick=0;if(sdMargin<18)sdMargin++;}
  }

  // Direction input (P2 via AI on touch devices)
  worms.forEach(function(w){
    if(!w.alive) return;
    if(aiMode&&w.pid===1){aiThink(w);return;}
    var K=w.keys;
    if((keys[K.up])&&w.dir.y!==1)w.nextDir={x:0,y:-1};
    if((keys[K.dn])&&w.dir.y!==-1)w.nextDir={x:0,y:1};
    if((keys[K.lt])&&w.dir.x!==1)w.nextDir={x:-1,y:0};
    if((keys[K.rt])&&w.dir.x!==-1)w.nextDir={x:1,y:0};
  });

  worms.forEach(function(w){
    if(!w.alive) return;
    if(w.boost>0){w.boost--;if(w.boost===0)w.moveEvery=SPEED;}
    if(frame%w.moveEvery!==0) return;
    w.dir=w.nextDir;
    var head=w.segs[0];
    var nx=head.x+w.dir.x,ny=head.y+w.dir.y;
    // wall / sudden-death boundary collision
    if(nx<sdMargin||nx>=COLS-sdMargin||ny<sdMargin||ny>=ROWS-sdMargin){killWorm(w);return;}
    // self collision
    if(w.segs.slice(1).some(function(s){return s.x===nx&&s.y===ny;})){killWorm(w);return;}
    // other worm collision
    var other=worms.filter(function(o){return o!==w&&o.alive;})[0];
    if(other&&other.segs.some(function(s){return s.x===nx&&s.y===ny;})){killWorm(w);return;}

    w.segs.unshift({x:nx,y:ny});
    if(w.segs.length>bestLen)bestLen=w.segs.length;
    // eat food
    var fi=food.findIndex(function(f){return f.x===nx&&f.y===ny;});
    if(fi>=0){
      var ff=food[fi];food.splice(fi,1);
      if(ff.type==='mega')w.growQ+=5;
      else if(ff.type==='gold')w.growQ+=4;
      else if(ff.type==='boost'){w.boost=300;w.moveEvery=3;}
      else w.growQ+=1;
      spawnFood();
      spawnParts(nx*T+T/2,ny*T+T/2,ff.type==='gold'?'#ffcc00':ff.type==='boost'?'#ff8800':w.col,12);
    }
    if(w.growQ>0){w.growQ--;}
    else{w.segs.pop();}
  });

  food.forEach(function(f){f.anim+=.06;});

  for(var j=particles.length-1;j>=0;j--){var q=particles[j];q.x+=q.vx;q.y+=q.vy;q.life--;if(q.life<=0)particles.splice(j,1);}

  // check if any dead (scored exactly once per round)
  var dead=worms.filter(function(w){return!w.alive;});
  if(dead.length>0){
    roundOver=true;
    dead.forEach(function(w){
      var winner=1-w.pid;
      score[winner]++;
      document.getElementById('s'+[1,2][winner]).textContent=score[winner];
    });
    if(score[0]>=5||score[1]>=5){gameOver();}
    else{setTimeout(initRound,1200);}
  }
}

function initRound(){
  roundOver=false;sdMargin=0;sdTick=0;
  worms=WORM_DEFS.map(function(d,i){return makeWorm(d,i);});
  food=[];particles=[];frame=0;
  spawnFood();spawnFood();spawnFood();
}

function killWorm(w){
  w.alive=false;
  w.segs.forEach(function(s){spawnParts(s.x*T+T/2,s.y*T+T/2,w.col,2);});
}

function spawnParts(x,y,col,n){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,col,life:15+Math.random()*15,r:1.5+Math.random()*1.5});}
}

function statsLine(){
  return 'MATCH WINS — P1: '+stats.p1+' · P2: '+stats.p2+'<br>BEST LENGTH: '+stats.best;
}

function gameOver(){
  gameState='over';
  var w=score[0]>=5?0:1;
  stats['p'+(w+1)]++;
  stats.best=Math.max(stats.best,bestLen);
  saveStats();
  document.getElementById('msg').style.display='flex';
  document.getElementById('msg').innerHTML=
    '<h1 style="color:'+(w===0?'#ff6644':'#4488ff')+'">P'+(w+1)+' WINS!</h1>'+
    '<p style="color:#444">Score: '+score[0]+' — '+score[1]+'</p>'+
    '<div style="color:#555;font-size:12px;margin-bottom:22px;letter-spacing:1px;text-align:center;line-height:2;">'+statsLine()+'</div>'+
    '<button class="btn" onclick="score=[0,0];document.getElementById(\'s1\').textContent=0;document.getElementById(\'s2\').textContent=0;startGame()">REMATCH</button>';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0c0c0c';ctx.fillRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle='#111';ctx.lineWidth=.5;
  for(var x=0;x<W;x+=T)ctx.strokeRect(x,0,T,H);

  // particles
  particles.forEach(function(p){ctx.globalAlpha=p.life/30;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;

  // food
  food.forEach(function(f){
    var fp=.6+Math.sin(f.anim)*.4;
    if(f.type==='boost'){
      ctx.shadowColor='#ff8800';ctx.shadowBlur=12*fp;ctx.fillStyle='#ff8800';
      var cx=f.x*T+T/2,cy=f.y*T+T/2;
      ctx.beginPath();ctx.moveTo(cx,cy-5);ctx.lineTo(cx+5,cy);ctx.lineTo(cx,cy+5);ctx.lineTo(cx-5,cy);ctx.closePath();ctx.fill();
    }else if(f.type==='gold'){
      ctx.shadowColor='#ffcc00';ctx.shadowBlur=16*fp;ctx.fillStyle='#ffcc00';
      ctx.fillRect(f.x*T,f.y*T,T,T);
    }else{
      ctx.shadowColor=f.type==='mega'?'#ffcc00':'#44ff44';ctx.shadowBlur=12*fp;
      if(f.type==='mega'){ctx.fillStyle='#ffcc00';ctx.fillRect(f.x*T+1,f.y*T+1,T-2,T-2);}
      else{ctx.fillStyle='#44ff44';ctx.beginPath();ctx.arc(f.x*T+T/2,f.y*T+T/2,T*.38,0,Math.PI*2);ctx.fill();}
    }
    ctx.shadowBlur=0;
  });

  // worms
  worms.forEach(function(w){
    w.segs.forEach(function(s,i){
      var isHead=i===0;
      ctx.shadowColor=w.col;ctx.shadowBlur=isHead?12:0;
      var col=isHead?(w.boost>0?'#ffcc00':w.headCol):w.col;
      // darken tail
      var t=i/w.segs.length;
      ctx.globalAlpha=w.alive?1-t*.3:.3;
      ctx.fillStyle=col;
      ctx.fillRect(s.x*T+1,s.y*T+1,T-2,T-2);
      if(isHead){
        // eyes
        var ex=s.x*T+(w.dir.x>0?T-4:w.dir.x<0?1:T/2-2);
        var ey=s.y*T+(w.dir.y>0?T-4:w.dir.y<0?1:T/2-2);
        ctx.fillStyle='#fff';ctx.fillRect(ex,ey,3,3);
        ctx.fillStyle='#000';ctx.fillRect(ex+1,ey+1,1,1);
      }
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    });
  });

  // sudden-death shrinking arena
  if(gameState==='play'&&frame>2700){
    ctx.strokeStyle='rgba(255,40,40,.8)';ctx.lineWidth=3;
    ctx.strokeRect(sdMargin*T+1,sdMargin*T+1,(COLS-2*sdMargin)*T-2,(ROWS-2*sdMargin)*T-2);
    if(sdMargin<3){
      ctx.fillStyle='#ff4444';ctx.font='bold 22px sans-serif';ctx.textAlign='center';
      ctx.fillText('SUDDEN DEATH',W/2,34);
    }
  }
}

document.addEventListener('keydown',function(e){
  if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  keys[e.key]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',function(e){keys[e.key]=false;});

function togglePause(){
  if(gameState!=='play')return;
  paused=!paused;
  document.getElementById('pauseOv').style.display=paused?'flex':'none';
}
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&gameState==='play'&&!paused)togglePause();
});

function loop(){if(!paused)update();draw();requestAnimationFrame(loop);}
loop();

// ---------- touch controls (dpad + swipe), wired into the same keys{} mechanism ----------
var dpadCount={};
function bindDir(id,k){
  var el=document.getElementById(id);if(!el)return;
  dpadCount[k]=0;
  el.addEventListener('touchstart',function(e){e.preventDefault();dpadCount[k]++;keys[k]=true;},{passive:false});
  var end=function(e){e.preventDefault();if(dpadCount[k]>0)dpadCount[k]--;if(dpadCount[k]===0)keys[k]=false;};
  el.addEventListener('touchend',end,{passive:false});
  el.addEventListener('touchcancel',end,{passive:false});
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
  el.addEventListener('mousedown',function(e){e.preventDefault();keys[k]=true;});
  el.addEventListener('mouseup',function(){keys[k]=false;});
}
function pulseKey(k){
  keys[k]=true;
  setTimeout(function(){if((dpadCount[k]||0)===0)keys[k]=false;},150);
}
bindDir('dUp','w');bindDir('dDn','s');bindDir('dLt','a');bindDir('dRt','d');

var swp=null;
cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.changedTouches[0];swp={x:t.clientX,y:t.clientY};},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();if(!swp)return;
  var t=e.changedTouches[0],dx=t.clientX-swp.x,dy=t.clientY-swp.y;swp=null;
  var ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<24)return;
  if(ax>ay)pulseKey(dx>0?'d':'a');else pulseKey(dy>0?'s':'w');
},{passive:false});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});

function fitScreen(){
  var s=Math.min(window.innerWidth/640,(window.innerHeight-40)/480);
  if(!isTouch)s=Math.min(s,1); // desktop keeps its native 640x480 size
  var w=Math.floor(640*s),h=Math.floor(480*s);
  cv.style.width=w+'px';cv.style.height=h+'px';
  document.getElementById('hud').style.width=w+'px';
}
window.addEventListener('resize',fitScreen);
window.addEventListener('orientationchange',function(){setTimeout(fitScreen,200);});

if(isTouch){
  document.getElementById('touchUI').style.display='block';
  document.getElementById('hint').innerHTML=
    '<b style="color:#ff6644">P1</b> dpad or swipe to slither<br><b style="color:#4488ff">P2</b> is a CPU bot<br><br>'+
    'Crash into the other worm to kill them.<br>Eat food to grow. First to 5 wins!';
}
document.getElementById('menuStats').innerHTML=statsLine();
fitScreen();
</script>
</body>
</html>
