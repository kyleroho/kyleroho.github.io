<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slime Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a1a0a;overflow:hidden;height:100vh;height:100dvh;width:100vw;font-family:'Nunito',sans-serif;color:#ccffcc;position:fixed;inset:0;}
#app{display:flex;height:100vh;height:100dvh;}
#lab{flex:1;position:relative;touch-action:none;min-width:0;}
canvas{display:block;width:100%;height:100%;touch-action:none;}
#sidebar{width:260px;background:#051005;border-left:2px solid #1a4a1a;display:flex;flex-direction:column;overflow:hidden;}
#sid-top{padding:12px;border-bottom:1px solid #1a4a1a;}
#sid-top h2{font-family:'Fredoka One',cursive;color:#88ff88;font-size:20px;margin-bottom:4px;}
#coins{font-size:12px;color:#ffcc44;letter-spacing:1px;}
#statLine{font-size:11px;color:#44aa44;margin-top:6px;letter-spacing:1px;}
#bestLine{font-size:10px;color:#2a6a2a;margin-top:2px;letter-spacing:1px;}
#recipes{padding:8px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;}
#recipes h3{font-size:10px;letter-spacing:3px;color:#1a6a1a;margin-bottom:6px;}
.recipe{background:#0d1e0d;border:1px solid #1a4a1a;border-radius:5px;padding:6px 8px;margin-bottom:4px;font-size:11px;transition:all .15s;}
.recipe:hover{border-color:#44ff44;background:#112211;}
.recipe.locked{opacity:.35;}
.recipe.unlocked{cursor:pointer;}
.recipe .rname{font-weight:900;color:#88ff88;margin-bottom:2px;}
.recipe .rmix{color:#33aa33;}
.recipe .runlock{color:#ffcc44;font-size:10px;}
#shop{padding:8px;border-top:1px solid #1a4a1a;}
#shop h3{font-size:10px;letter-spacing:3px;color:#1a6a1a;margin-bottom:6px;}
.sbtn{display:block;width:100%;background:#0a180a;border:1px solid #1a5a1a;color:#66ff66;padding:6px 8px;font-size:11px;cursor:pointer;border-radius:4px;margin-bottom:4px;text-align:left;transition:all .15s;}
.sbtn:hover{border-color:#44ff44;background:#112211;}
.sbtn span{float:right;color:#ffcc44;}
#sellBtn.on{background:#442200;border-color:#ffaa00;color:#ffcc44;}
#notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0d2a0d;border:1px solid #44ff44;padding:8px 20px;font-size:13px;color:#88ff88;pointer-events:none;opacity:0;transition:opacity .3s;z-index:20;font-family:'Fredoka One',cursive;}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1a0aee;z-index:30;padding:16px;}
#msg h1{font-family:'Fredoka One',cursive;font-size:52px;color:#88ff88;margin-bottom:8px;}
#msg p{color:#336633;font-size:13px;margin-bottom:22px;text-align:center;line-height:2.2;}
.gbtn{background:transparent;border:2px solid #44ff44;color:#88ff88;padding:12px 36px;font-family:'Fredoka One',cursive;font-size:18px;cursor:pointer;border-radius:8px;transition:all .2s;}
.gbtn:hover{background:#44ff4422;box-shadow:0 0 20px #44ff4444;}
.iconbtn{position:absolute;top:10px;width:44px;height:44px;border-radius:10px;background:#0d2a0dcc;border:2px solid #44ff44;color:#88ff88;font-size:20px;cursor:pointer;z-index:15;display:none;align-items:center;justify-content:center;line-height:1;padding:0;}
body.playing .iconbtn{display:flex;}
#pauseBtn{right:10px;}
#muteBtn{right:64px;}
#panelBtn{position:fixed;bottom:14px;right:14px;width:52px;height:52px;border-radius:26px;background:#0d2a0dee;border:2px solid #44ff44;color:#88ff88;font-size:24px;cursor:pointer;z-index:25;display:none;align-items:center;justify-content:center;padding:0;}
#vic{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0a1a0add;z-index:40;flex-direction:column;text-align:center;padding:20px;}
#vic.show{display:flex;}
#vic h1{font-family:'Fredoka One',cursive;font-size:40px;color:#ffdd44;margin-bottom:10px;}
#vic p{color:#88ff88;font-size:14px;margin-bottom:20px;line-height:1.8;}
@media (max-width:760px){
  #app{flex-direction:column;}
  #lab{flex:1;min-height:0;}
  #sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;max-height:48vh;border-left:none;border-top:2px solid #1a4a1a;transform:translateY(105%);transition:transform .25s;z-index:24;background:#051005f2;}
  body.panel-open #sidebar{transform:none;}
  body.playing #panelBtn{display:flex;}
  .sbtn{min-height:44px;font-size:13px;padding:10px 8px;}
  .recipe{font-size:13px;padding:10px 8px;}
  #msg h1{font-size:36px;}
  #msg p{font-size:12px;}
  #notif{max-width:92vw;font-size:12px;text-align:center;}
  #vic h1{font-size:30px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="lab">
    <canvas id="cv"></canvas>
    <button id="pauseBtn" class="iconbtn" onclick="togglePause()" aria-label="Pause">⏸</button>
    <button id="muteBtn" class="iconbtn" onclick="toggleMute()" aria-label="Mute">🔊</button>
  </div>
  <div id="sidebar">
    <div id="sid-top">
      <h2>🧪 SLIME LAB</h2>
      <div id="coins">💰 <b id="coinVal">0</b> goo-coins/sec: <b id="gps">0</b></div>
      <div id="statLine">🧬 4/20 · 🔀 0</div>
      <div id="bestLine">🏆 best: 4/20</div>
    </div>
    <div id="recipes">
      <h3>RECIPES</h3>
      <div id="recipeList"></div>
    </div>
    <div id="shop">
      <h3>UPGRADES</h3>
      <button class="sbtn" id="sellBtn" onclick="toggleSell()">💰 Sell Mode: OFF</button>
      <button class="sbtn" onclick="buyUpgrade('tank')" title="Hold +3 slimes per level">Bigger Tank<span id="tankCost">50🪙</span></button>
      <button class="sbtn" onclick="buyUpgrade('speed')" title="Merges complete faster">Faster Mix<span id="speedCost">120🪙</span></button>
      <button class="sbtn" onclick="buyUpgrade('auto')" title="Automatically merges pairs">Auto-Mixer<span id="autoCost">300🪙</span></button>
      <button class="sbtn" onclick="buyUpgrade('magnet')" title="Boosts all goo income ×1.5">Coin Magnet<span id="magnetCost">500🪙</span></button>
    </div>
  </div>
</div>
<button id="panelBtn" onclick="document.body.classList.toggle('panel-open')" aria-label="Lab panel">🧪</button>
<div id="notif"></div>
<div id="vic">
  <h1>🏆 LAB COMPLETE!</h1>
  <p>You discovered all 20 slime species!<br><span id="vicStats"></span></p>
  <button class="gbtn" onclick="closeVic()">KEEP EXPERIMENTING</button>
</div>
<div id="msg">
  <h1>SLIME LAB</h1>
  <p>Drag slimes together to merge them.<br>Discover all 20 slime species!<br>Toggle Sell Mode to sell slimes for coins.</p>
  <button class="gbtn" onclick="startGame()">START EXPERIMENT</button>
  <a href="index.html" style="display:block;margin-top:10px;text-align:center;color:#226644;font-size:10px;letter-spacing:2px;text-decoration:none;font-family:monospace;">← BACK TO ARCADE</a>
</div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W,H;
function resize(){
  var rect=cv.getBoundingClientRect();
  W=cv.width=rect.width||cv.parentElement.clientWidth||600;
  H=cv.height=rect.height||cv.parentElement.clientHeight||500;
}
window.addEventListener('load',resize);
window.addEventListener('resize',resize);

var SLIMES=[
  {id:'red',   name:'Red Slime',    color:'#ff4444',glow:'#ff0000',value:1, gps:.5, desc:'Base'},
  {id:'blue',  name:'Blue Slime',   color:'#4488ff',glow:'#0044ff',value:1, gps:.5, desc:'Base'},
  {id:'green', name:'Green Slime',  color:'#44ff44',glow:'#00cc00',value:1, gps:.5, desc:'Base'},
  {id:'yellow',name:'Yellow Slime', color:'#ffff44',glow:'#ffcc00',value:2, gps:1,  desc:'Base'},
  {id:'purple',name:'Purple Slime', color:'#aa44ff',glow:'#8800ff',value:3, gps:1.5,mix:['red','blue']},
  {id:'orange',name:'Orange Slime', color:'#ff8844',glow:'#ff5500',value:3, gps:1.5,mix:['red','yellow']},
  {id:'teal',  name:'Teal Slime',   color:'#44ffcc',glow:'#00ccaa',value:3, gps:1.5,mix:['blue','green']},
  {id:'lime',  name:'Lime Slime',   color:'#aaff44',glow:'#88ff00',value:4, gps:2,  mix:['green','yellow']},
  {id:'pink',  name:'Pink Slime',   color:'#ff88cc',glow:'#ff0088',value:5, gps:2.5,mix:['red','purple']},
  {id:'cyan',  name:'Cyan Slime',   color:'#44ffff',glow:'#00ccff',value:5, gps:2.5,mix:['blue','teal']},
  {id:'gold',  name:'Gold Slime',   color:'#ffdd00',glow:'#ffaa00',value:8, gps:4,  mix:['yellow','orange']},
  {id:'toxic', name:'Toxic Slime',  color:'#88ff00',glow:'#44cc00',value:8, gps:4,  mix:['green','lime']},
  {id:'void',  name:'Void Slime',   color:'#220044',glow:'#8800ff',value:12,gps:6,  mix:['purple','pink']},
  {id:'crystal',name:'Crystal Slime',color:'#ccffff',glow:'#88ffff',value:12,gps:6, mix:['cyan','teal']},
  {id:'magma', name:'Magma Slime',  color:'#ff2200',glow:'#ff8800',value:15,gps:8,  mix:['orange','gold']},
  {id:'cosmos',name:'Cosmos Slime', color:'#8844ff',glow:'#4400ff',value:20,gps:10, mix:['void','crystal']},
  {id:'prism', name:'Prism Slime',  color:'#ffffff',glow:'#ffccff',value:25,gps:12, mix:['cosmos','gold']},
  {id:'omega', name:'OMEGA SLIME',  color:'#ffaa00',glow:'#ff4400',value:50,gps:25, mix:['prism','magma']},
  {id:'star',  name:'Star Slime',   color:'#fff2a8',glow:'#ffdd44',value:18,gps:9,  mix:['gold','crystal']},
  {id:'apex',  name:'APEX SLIME',   color:'#ff66ff',glow:'#ff00cc',value:60,gps:30, mix:['omega','star']},
];
var SLIME_MAP={};SLIMES.forEach(function(s){SLIME_MAP[s.id]=s;});

var SAVE_KEY='pfg2_slime_lab';
var coins=0,gps=0,discovered=new Set(['red','blue','green','yellow']);
var slimes=[]; // active slime objects on canvas
var selected=null;
var autoMixTimer=0;
var upgrades={tank:0,speed:0,auto:false,magnet:false};
var upgCosts={tank:50,speed:120,auto:300,magnet:500};
var maxSlimes=12;
var mixSpeed=1;
var frame=0;
var notifTimer=0;
var sellMode=false,paused=false,playing=false;
var merges=0,best=4,won=false,muted=false;
var pendingMerges=[];

// --- tiny synth sfx (no external deps) ---
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type,v,slide){
  if(muted)return;var c=ac();if(!c)return;
  try{
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,c.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+d);
    g.gain.setValueAtTime(v||.12,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);
  }catch(e){}
}
function sfx(n){
  if(n==='merge'){tone(300,.12,'square',.08,600);}
  else if(n==='discover'){tone(523,.12,'sine',.12);setTimeout(function(){tone(784,.18,'sine',.12);},110);}
  else if(n==='sell'){tone(880,.08,'triangle',.1);setTimeout(function(){tone(1320,.1,'triangle',.1);},70);}
  else if(n==='click'){tone(440,.06,'sine',.06);}
  else if(n==='win'){var ns=[523,659,784,1047];ns.forEach(function(f,i){setTimeout(function(){tone(f,.22,'sine',.12);},i*140);});}
}
function toggleMute(){
  muted=!muted;
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  save();
}

// --- save / load ---
function save(){
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify({
      coins:coins,upgrades:upgrades,upgCosts:upgCosts,maxSlimes:maxSlimes,mixSpeed:mixSpeed,
      discovered:Array.from(discovered),merges:merges,best:best,won:won,muted:muted
    }));
  }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    var d=JSON.parse(raw);if(!d||typeof d!=='object')return false;
    coins=d.coins||0;merges=d.merges||0;best=d.best||4;won=!!d.won;muted=!!d.muted;
    if(d.upgrades){upgrades.tank=d.upgrades.tank||0;upgrades.speed=d.upgrades.speed||0;upgrades.auto=!!d.upgrades.auto;upgrades.magnet=!!d.upgrades.magnet;}
    if(d.upgCosts){for(var k in upgCosts){if(d.upgCosts[k])upgCosts[k]=d.upgCosts[k];}}
    maxSlimes=d.maxSlimes||12;mixSpeed=d.mixSpeed||1;
    if(d.discovered&&d.discovered.length)discovered=new Set(d.discovered.filter(function(id){return SLIME_MAP[id];}));
    return true;
  }catch(e){return false;}
}
window.addEventListener('beforeunload',save);

function startGame(){
  document.getElementById('msg').style.display='none';
  document.body.classList.add('playing');
  load();
  // spawn starter slimes
  spawnSlime('red');spawnSlime('blue');spawnSlime('green');spawnSlime('yellow');
  syncShopUI();renderRecipes();updateCoinsUI();updateStats();
  document.getElementById('muteBtn').textContent=muted?'🔇':'🔊';
  playing=true;
  loop();
}

function spawnSlime(id,x,y){
  if(slimes.length>=maxSlimes) return;
  var def=SLIME_MAP[id];if(!def) return;
  var sx=x||80+Math.random()*(W-160),sy=y||H*.2+Math.random()*H*.55;
  slimes.push({id:id,x:sx,y:sy,r:22+def.value*1.2,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,
    color:def.color,glow:def.glow,wobble:Math.random()*Math.PI*2,wspd:.04+Math.random()*.03,
    selected:false,dragging:false,merging:false,mergeTimer:0,sparkle:0});
  discovered.add(id);
}

function getGPS(){
  var g=0;slimes.forEach(function(s){g+=SLIME_MAP[s.id].gps||0;});
  if(upgrades.magnet)g*=1.5; // Coin Magnet boosts all goo income
  return g;
}

function tryMerge(a,b){
  if(a===b||a.merging||b.merging) return false;
  // find recipe that uses both
  var result=null;
  for(var i=0;i<SLIMES.length;i++){
    var s=SLIMES[i];
    if(s.mix&&((s.mix[0]===a.id&&s.mix[1]===b.id)||(s.mix[0]===b.id&&s.mix[1]===a.id))){result=s;break;}
  }
  if(!result) return false;
  // animate merge
  a.merging=true;b.merging=true;
  var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  a.mergeTarget={x:mx,y:my};b.mergeTarget={x:mx,y:my};
  pendingMerges.push({a:a,b:b,mx:mx,my:my,t:.6/mixSpeed,result:result});
  sfx('merge');
  return true;
}

function completeMerge(m){
  var idxA=slimes.indexOf(m.a),idxB=slimes.indexOf(m.b);
  if(idxA<0||idxB<0) return; // one of them was sold mid-merge
  slimes.splice(Math.max(idxA,idxB),1);
  slimes.splice(Math.min(idxA,idxB),1);
  var first=!discovered.has(m.result.id);
  spawnSlime(m.result.id,m.mx,m.my);
  merges++;
  if(first){showNotif('NEW: '+m.result.name+' discovered! 🎉');sfx('discover');}
  if(discovered.size>best)best=discovered.size;
  renderRecipes();updateStats();
  checkWin();
}

function checkWin(){
  if(won||discovered.size<SLIMES.length) return;
  won=true;save();sfx('win');
  document.getElementById('vicStats').textContent=merges+' merges · '+Math.floor(coins)+' coins';
  document.getElementById('vic').classList.add('show');
}
function closeVic(){document.getElementById('vic').classList.remove('show');}

function showNotif(txt){
  var el=document.getElementById('notif');
  el.textContent=txt;el.style.opacity='1';
  clearTimeout(notifTimer);
  notifTimer=setTimeout(function(){el.style.opacity='0';},2500);
}

function buyUpgrade(type){
  var cost=upgCosts[type];
  if(coins<cost){showNotif('Need '+cost+' coins!');return;}
  coins-=cost;
  if(type==='tank'){upgrades.tank++;maxSlimes=12+upgrades.tank*3;upgCosts.tank=Math.floor(cost*2.5);document.getElementById('tankCost').textContent=upgCosts.tank+'🪙';}
  if(type==='speed'){upgrades.speed++;mixSpeed=1+upgrades.speed*.8;upgCosts.speed=Math.floor(cost*2.2);document.getElementById('speedCost').textContent=upgCosts.speed+'🪙';}
  if(type==='auto'){upgrades.auto=true;document.getElementById('autoCost').textContent='✓';}
  if(type==='magnet'){upgrades.magnet=true;document.getElementById('magnetCost').textContent='✓';}
  sfx('click');
  updateCoinsUI();
  save();
}

function syncShopUI(){
  document.getElementById('tankCost').textContent=upgCosts.tank+'🪙';
  document.getElementById('speedCost').textContent=upgCosts.speed+'🪙';
  document.getElementById('autoCost').textContent=upgrades.auto?'✓':upgCosts.auto+'🪙';
  document.getElementById('magnetCost').textContent=upgrades.magnet?'✓':upgCosts.magnet+'🪙';
}

function updateStats(){
  document.getElementById('statLine').textContent='🧬 '+discovered.size+'/'+SLIMES.length+' · 🔀 '+merges;
  document.getElementById('bestLine').textContent='🏆 best: '+best+'/'+SLIMES.length;
}

function renderRecipes(){
  var el=document.getElementById('recipeList');el.innerHTML='';
  SLIMES.forEach(function(s){
    if(!s.mix) return;
    var unlocked=discovered.has(s.mix[0])&&discovered.has(s.mix[1]);
    var found=discovered.has(s.id);
    var d=document.createElement('div');d.className='recipe'+(unlocked?' unlocked':' locked');
    if(unlocked){
      var a=SLIME_MAP[s.mix[0]],b=SLIME_MAP[s.mix[1]];
      d.innerHTML='<div class="rname" style="color:'+s.color+'">'+s.name+'</div>'+
        '<div class="rmix"><span style="color:'+a.color+'">'+a.name+'</span> + <span style="color:'+b.color+'">'+b.name+'</span></div>'+
        (found?'<div style="color:#ffcc44;font-size:10px">✓ Discovered · '+s.gps+'/s</div>':'');
      (function(s2){
        d.onclick=function(){
          showNotif(s2.name+': '+SLIME_MAP[s2.mix[0]].name+' + '+SLIME_MAP[s2.mix[1]].name+(discovered.has(s2.id)?' ✓':''));
          sfx('click');
        };
      })(s);
    } else {
      d.innerHTML='<div class="rname">???</div><div class="rmix" style="color:#1a5a1a">Locked</div>';
    }
    el.appendChild(d);
  });
}

function updateCoinsUI(){
  document.getElementById('coinVal').textContent=Math.floor(coins);
  document.getElementById('gps').textContent=getGPS().toFixed(1);
}

// auto-sell lowest-value slimes when over limit
function autoManage(){
  if(slimes.length>=maxSlimes){
    var sorted=slimes.filter(function(s){return !s.merging;}).sort(function(a,b){return SLIME_MAP[a.id].value-SLIME_MAP[b.id].value;});
    if(sorted.length>0){
      var s=sorted[0];coins+=SLIME_MAP[s.id].value;
      var idx=slimes.indexOf(s);if(idx>=0)slimes.splice(idx,1);
      updateCoinsUI();
    }
  }
}

// --- sell mode ---
function toggleSell(){
  sellMode=!sellMode;
  var b=document.getElementById('sellBtn');
  b.textContent=sellMode?'💰 Sell Mode: ON':'💰 Sell Mode: OFF';
  b.className='sbtn'+(sellMode?' on':'');
  cv.style.cursor=sellMode?'pointer':'default';
  sfx('click');
}
function sellSlime(s){
  // cancel any pending merge involving this slime
  for(var i=pendingMerges.length-1;i>=0;i--){
    if(pendingMerges[i].a===s||pendingMerges[i].b===s){
      var m=pendingMerges[i];m.a.merging=false;m.b.merging=false;pendingMerges.splice(i,1);
    }
  }
  var idx=slimes.indexOf(s);if(idx>=0)slimes.splice(idx,1);
  var v=SLIME_MAP[s.id].value;
  coins+=v;sfx('sell');
  showNotif('Sold '+SLIME_MAP[s.id].name+' +'+v+'🪙');
  updateCoinsUI();
  save();
}

// --- shared press/move/release input (mouse + touch) ---
var dragSlime=null,dragOffX=0,dragOffY=0,dragTouchId=null;
function pressAt(mx,my){
  if(sellMode){
    for(var i=slimes.length-1;i>=0;i--){
      var s=slimes[i];
      if(!s.merging&&Math.hypot(s.x-mx,s.y-my)<s.r+6){sellSlime(s);return;}
    }
    return;
  }
  for(var j=slimes.length-1;j>=0;j--){
    if(Math.hypot(slimes[j].x-mx,slimes[j].y-my)<slimes[j].r+6){
      dragSlime=slimes[j];dragOffX=mx-slimes[j].x;dragOffY=my-slimes[j].y;
      dragSlime.dragging=true;break;
    }
  }
}
function moveTo(mx,my){
  if(!dragSlime) return;
  dragSlime.x=mx-dragOffX;
  dragSlime.y=my-dragOffY;
  dragSlime.vx=0;dragSlime.vy=0;
}
function releaseSlime(){
  if(!dragSlime) return;
  dragSlime.dragging=false;
  // check overlap with another slime
  for(var i=0;i<slimes.length;i++){
    if(slimes[i]!==dragSlime&&!slimes[i].merging&&
       Math.hypot(slimes[i].x-dragSlime.x,slimes[i].y-dragSlime.y)<slimes[i].r+dragSlime.r-10){
      if(tryMerge(dragSlime,slimes[i])) break;
    }
  }
  dragSlime=null;
}
cv.addEventListener('mousedown',function(e){
  var r=cv.getBoundingClientRect();
  pressAt(e.clientX-r.left,e.clientY-r.top);
});
cv.addEventListener('mousemove',function(e){
  if(!dragSlime) return;
  var r=cv.getBoundingClientRect();
  moveTo(e.clientX-r.left,e.clientY-r.top);
});
window.addEventListener('mouseup',function(){dragTouchId=null;releaseSlime();});
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(dragTouchId!==null) return; // multi-touch safe: one drag at a time
  var t=e.changedTouches[0];dragTouchId=t.identifier;
  var r=cv.getBoundingClientRect();
  pressAt(t.clientX-r.left,t.clientY-r.top);
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(t.identifier===dragTouchId){
      var r=cv.getBoundingClientRect();
      moveTo(t.clientX-r.left,t.clientY-r.top);
    }
  }
},{passive:false});
cv.addEventListener('touchend',function(e){
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===dragTouchId){dragTouchId=null;releaseSlime();}
  }
});
cv.addEventListener('touchcancel',function(e){
  for(var i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].identifier===dragTouchId){
      dragTouchId=null;
      if(dragSlime){dragSlime.dragging=false;dragSlime=null;}
    }
  }
});
document.addEventListener('touchmove',function(e){
  if(e.target===cv)e.preventDefault();
},{passive:false});

// --- pause ---
function setPaused(p){
  if(!playing) return;
  paused=p;
  document.getElementById('pauseBtn').textContent=paused?'▶️':'⏸';
}
function togglePause(){setPaused(!paused);sfx('click');}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){setPaused(true);save();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
  else if(e.key==='m'||e.key==='M')toggleMute();
});

function update(){
  frame++;
  coins+=getGPS()/60;
  if(frame%60===0){updateCoinsUI();autoManage();}
  if(frame%300===0)save();

  // pending merge completions (frame-based so pause works)
  for(var pi=pendingMerges.length-1;pi>=0;pi--){
    var pm=pendingMerges[pi];pm.t-=1/60;
    if(pm.t<=0){completeMerge(pm);pendingMerges.splice(pi,1);}
  }

  // auto mixer
  if(upgrades.auto&&frame%120===0){
    outer:for(var i=0;i<slimes.length;i++){
      for(var j=i+1;j<slimes.length;j++){
        if(tryMerge(slimes[i],slimes[j])) break outer;
      }
    }
  }

  // auto spawn when low
  if(frame%200===0&&slimes.length<Math.min(6,maxSlimes)){
    var bases=['red','blue','green','yellow'];
    spawnSlime(bases[Math.floor(Math.random()*bases.length)]);
  }

  slimes.forEach(function(s){
    if(s.merging){
      // merge animation: glide toward the merge point
      if(s.mergeTarget){s.x+=(s.mergeTarget.x-s.x)*.18;s.y+=(s.mergeTarget.y-s.y)*.18;}
      return;
    }
    if(s.dragging) return;
    // wobble
    s.wobble+=s.wspd;
    // bounce around canvas
    s.x+=s.vx;s.y+=s.vy;
    s.vx*=.99;s.vy*=.99;
    if(s.x-s.r<0){s.x=s.r;s.vx=Math.abs(s.vx);}
    if(s.x+s.r>W){s.x=W-s.r;s.vx=-Math.abs(s.vx);}
    if(s.y-s.r<0){s.y=s.r;s.vy=Math.abs(s.vy);}
    if(s.y+s.r>H){s.y=H-s.r;s.vy=-Math.abs(s.vy);}
    if(s.sparkle>0)s.sparkle--;
  });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // bg
  ctx.fillStyle='#0a1a0a';ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#0d1e0d';ctx.lineWidth=.5;
  for(var x=0;x<W;x+=40)ctx.strokeRect(x,0,40,H);

  slimes.forEach(function(s){
    var pulse=.7+Math.sin(s.wobble)*.3;
    var rx=s.r*(1+Math.sin(s.wobble)*.08);
    var ry=s.r*(1+Math.cos(s.wobble*.9)*.08);
    ctx.shadowColor=s.glow;ctx.shadowBlur=18*pulse*(s.dragging?2:1);
    ctx.fillStyle=s.color;
    ctx.beginPath();ctx.ellipse(s.x,s.y,rx,ry,s.wobble*.1,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(s.x-rx*.28,s.y-ry*.15,rx*.18,ry*.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(s.x+rx*.28,s.y-ry*.15,rx*.18,ry*.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(s.x-rx*.24,s.y-ry*.15,rx*.08,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(s.x+rx*.32,s.y-ry*.15,rx*.08,0,Math.PI*2);ctx.fill();
    // smile
    ctx.strokeStyle='#00000066';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(s.x,s.y+ry*.1,rx*.25,0,Math.PI);ctx.stroke();
    ctx.shadowBlur=0;
  });

  // hint
  if(slimes.length>1){
    ctx.fillStyle='#1a5a1a55';ctx.font='11px Nunito,sans-serif';ctx.textAlign='center';
    ctx.fillText('Drag slimes together to merge!',W/2,H-12);ctx.textAlign='left';
  }

  // paused overlay
  if(paused){
    ctx.fillStyle='#0a1a0acc';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#88ff88';ctx.font='bold 28px Nunito,sans-serif';ctx.textAlign='center';
    ctx.fillText('⏸ PAUSED',W/2,H/2);ctx.textAlign='left';
  }
}

function loop(){if(!paused)update();draw();requestAnimationFrame(loop);}
</script>
