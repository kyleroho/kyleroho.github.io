<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>GRAVITY SHIFT — Pixel Forge Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{touch-action:none;overscroll-behavior:none;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:"Courier New",monospace;overflow:hidden;-webkit-user-select:none;user-select:none;}
canvas{display:block;touch-action:none;}
#ui{display:flex;gap:20px;padding:6px 16px;font-size:12px;color:#aaa;align-items:center;flex-wrap:wrap;justify-content:center;}
#ui b{color:#fff;} a{color:#a0ff60;text-decoration:none;font-size:11px;}a:hover{color:#fff;}
/* Touch controls (mobile pack) */
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none;z-index:10;}
body.touch #touch{display:flex;}
.tgroup{display:flex;gap:12px;pointer-events:auto;}
.tbtn{min-width:64px;min-height:64px;width:64px;height:64px;border-radius:50%;border:2px solid rgba(160,255,96,.5);background:rgba(160,255,96,.12);color:#a0ff60;font-size:24px;font-family:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;}
.tbtn.wide{width:84px;border-radius:16px;font-size:14px;font-weight:bold;}
.tbtn:active{background:rgba(160,255,96,.35);}
#t-dash{border-color:rgba(0,255,245,.5);background:rgba(0,255,245,.12);color:#00fff5;}
#t-dash:active{background:rgba(0,255,245,.35);}
#pauseBtn{position:fixed;top:8px;right:8px;z-index:11;min-width:44px;min-height:44px;width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.5);color:#fff;font-size:20px;touch-action:none;-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<div id="ui">
  <span>🌍 LEVEL <b id="h-level">1</b></span>
  <span>💀 DEATHS <b id="h-deaths">0</b></span>
  <span>⭐ STARS <b id="h-stars">0</b></span>
  <span style="color:#555;">A/D or ←/→: Move · Space/W: Flip · Shift: Dash · P: Pause · R: Restart</span>
  <a href="index.html">← Back</a>
</div>
<canvas id="c" width="640" height="420"></canvas>
<button id="pauseBtn" title="Pause (P)">⏸</button>
<div id="touch">
  <div class="tgroup">
    <button class="tbtn" id="t-left" aria-label="Move left">◀</button>
    <button class="tbtn" id="t-right" aria-label="Move right">▶</button>
  </div>
  <div class="tgroup">
    <button class="tbtn wide" id="t-flip">FLIP</button>
    <button class="tbtn wide" id="t-dash">DASH</button>
  </div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=640,H=420,TS=32;

let level=0,deaths=0,totalStars=0,state='menu',tick=0;
let particles=[],gravDir=1; // 1=down, -1=up
let gravFlipCd=0;
let dashCd=0,dashT=0,facing=1,ghostT=0; // dash ability + ghost powerup (signature upgrades)
let exiting=false,paused=false,levelStartTick=0; // exit-door guard, pause, per-level timer
// Persistent bests / progress (standard kit)
const SAVE_KEY='pfg2_gravity_shift';
let save={bestStars:0,bestDeaths:0,unlocked:1,bestTimes:[]};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&typeof s==='object')save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}
function startLevel(i){level=i;deaths=0;totalStars=0;loadLevel(i);state='playing';paused=false;document.getElementById('pauseBtn').textContent='⏸';document.getElementById('h-deaths').textContent=0;document.getElementById('h-stars').textContent=0;}

// Level definitions: tile map + player start + objects
// Tiles: 0=air, 1=floor, 2=spike(down), 3=spike(up), 4=star, 5=exit, 6=antigrav(platform)
const LEVELS=[
  {
    name:"FIRST FLIP",col:'#a0ff60',
    map:[
      "####################",
      "#                  #",
      "#  *      G        #",
      "#  ####     ####   #",
      "#               E  #",
      "#   ^^^    ####    #",
      "####################",
    ],
    start:[2,2]
  },{
    name:"UPSIDE DOWN",col:'#00fff5',
    map:[
      "####################",
      "#         *     G  #",
      "#  ####   ###      #",
      "#     ^   ^    *   #",
      "#  ###      ###    #",
      "#        E         #",
      "####################",
    ],
    start:[1,5]
  },{
    name:"ZIGZAG",col:'#ff6cfc',
    map:[
      "####################",
      "#   *              #",
      "# ###  ^^^  ###    #",
      "#       *   G   *  #",
      "# ###      ###     #",
      "#         E   ###  #",
      "####################",
    ],
    start:[1,1]
  },{
    name:"THE GAUNTLET",col:'#ff8800',
    map:[
      "####################",
      "#*  ^  ^  ^  ^  * #",
      "####  ####  ####   #",
      "#  *    *  G  *    #",
      "#  ## ^^## ^^##    #",
      "#               E  #",
      "####################",
    ],
    start:[1,5]
  },{
    name:"MAZE OF DOOM",col:'#ff3344',
    map:[
      "####################",
      "# *  ##  ^^ ##  *  #",
      "#    ##     ##     #",
      "####    ##    #### #",
      "#  ^^   ##   ^^^   #",
      "#     *  G   *  E  #",
      "####################",
    ],
    start:[1,1]
  },{
    name:"FINAL SHIFT",col:'#ffd700',
    map:[
      "####################",
      "#* ^ * ^ * ^ * ^ *##",
      "##  ##  ##  ##  ## #",
      "#         G        #",
      "## ##  ##  ##  ## ##",
      "#*                E#",
      "####################",
    ],
    start:[1,5]
  }
];

let tiles=[],objects=[],px,py,pvx=0,pvy=0,ponGround=false,pDead=false,pDeadTimer=0;

function charToTile(c){
  return{'#':1,' ':0,'^':2,'v':3,'*':4,'E':5,'~':6}[c]??0;
}

function loadLevel(idx){
  const lv=LEVELS[idx];
  tiles=[];objects=[];gravDir=1;gravFlipCd=0;
  const rows=lv.map;
  // Pad all rows to same length
  const maxW=Math.max(...rows.map(r=>r.length));
  tiles=rows.map(r=>{
    const row=[];
    for(let i=0;i<maxW;i++) row.push(charToTile(r[i]??'#'));
    return row;
  });
  // Extract objects
  rows.forEach((r,ri)=>{
    for(let ci=0;ci<r.length;ci++){
      const c=r[ci];
      if(c==='*') objects.push({type:'star',x:ci*TS+TS/2,y:ri*TS+TS/2,col:lv.col,collected:false});
      if(c==='E') objects.push({type:'exit',x:ci*TS,y:ri*TS});
      if(c==='G') objects.push({type:'ghost',x:ci*TS+TS/2,y:ri*TS+TS/2,collected:false});
    }
  });
  const s=lv.start;px=s[0]*TS+8;py=s[1]*TS;pvx=0;pvy=0;ponGround=false;pDead=false;particles=[];
  exiting=false;dashT=0;dashCd=0;ghostT=0;facing=1;levelStartTick=tick;
  document.getElementById('h-level').textContent=idx+1;
}

function tileAt(tx,ty){return tiles[ty]?.[tx]??1;}
function solidAt(tx,ty){const t=tileAt(tx,ty);return t===1||t===6;}
function spikeAt(tx,ty){const t=tileAt(tx,ty);return t===2||t===3;}

const keys={};
function update(){
  if(pDead){pDeadTimer--;if(pDeadTimer<=0){deaths++;loadLevel(level);document.getElementById('h-deaths').textContent=deaths;}return;}
  gravFlipCd=Math.max(0,gravFlipCd-1);

  dashCd=Math.max(0,dashCd-1);
  ghostT=Math.max(0,ghostT-1);
  const spd=3.2;
  if(dashT>0){
    dashT--;pvx=9*facing;
    if(tick%2===0)particles.push({x:px+8,y:py+14,vx:-facing*2,vy:(Math.random()-.5)*2,col:'#00fff5',life:20,sz:3});
  }
  else if(keys['KeyA']||keys['ArrowLeft']){pvx=-spd;facing=-1;}
  else if(keys['KeyD']||keys['ArrowRight']){pvx=spd;facing=1;}
  else pvx*=0.8;

  pvy+=0.55*gravDir;
  pvy=Math.max(-12,Math.min(12,pvy));

  // X move
  px+=pvx;
  const L=Math.floor(px/TS),R=Math.floor((px+14)/TS);
  const midY=Math.floor((py+16)/TS);
  if(pvx<0&&solidAt(L,midY)){px=L*TS+TS;pvx=0;}
  if(pvx>0&&solidAt(R,midY)){px=R*TS-16;pvx=0;}

  // Y move
  py+=pvy;
  ponGround=false;
  const T2=Math.floor(py/TS),B=Math.floor((py+26)/TS);
  const midX=Math.floor((px+8)/TS);
  if(gravDir>0&&pvy>0&&solidAt(midX,B)){py=B*TS-28;pvy=0;ponGround=true;}
  if(gravDir>0&&pvy<0&&solidAt(midX,T2)){py=T2*TS+TS;pvy=0;}
  if(gravDir<0&&pvy<0&&solidAt(midX,T2)){py=T2*TS+TS;pvy=0;ponGround=true;}
  if(gravDir<0&&pvy>0&&solidAt(midX,B)){py=B*TS-28;pvy=0;}

  // Spike death (ghost powerup phases through spikes)
  if(ghostT===0)[T2,B].forEach(ty=>{[L,R].forEach(tx=>{if(spikeAt(tx,ty)){die();}});});
  // OOB
  if(px<0||px>tiles[0].length*TS||py<0||py>tiles.length*TS) die();

  // Objects
  objects.forEach(o=>{
    if(o.type==='star'&&!o.collected&&Math.hypot(px+8-o.x,py+14-o.y)<22){
      o.collected=true;totalStars++;document.getElementById('h-stars').textContent=totalStars;
      for(let i=0;i<12;i++) particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,col:o.col,life:40,sz:3});
    }
    if(o.type==='ghost'&&!o.collected&&Math.hypot(px+8-o.x,py+14-o.y)<22){
      o.collected=true;ghostT=300;
      for(let i=0;i<14;i++) particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,col:'#00fff5',life:40,sz:3});
    }
    if(o.type==='exit'&&!exiting&&Math.hypot(px+8-o.x-TS/2,py+14-o.y-TS/2)<24){
      // Next level (guarded: one trigger per entry so lingering in the door can't skip levels)
      exiting=true;
      for(let i=0;i<30;i++) particles.push({x:o.x+TS/2,y:o.y+TS/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,col:'#ffd700',life:50,sz:4});
      const tSec=Math.round((tick-levelStartTick)/6)/10;
      const prev=save.bestTimes[level];
      if(!prev||tSec<prev)save.bestTimes[level]=tSec;
      save.unlocked=Math.max(save.unlocked,Math.min(LEVELS.length,level+2));
      level++;
      if(level>=LEVELS.length){
        state='win';
        if(totalStars>save.bestStars)save.bestStars=totalStars;
        if(!save.bestDeaths||deaths<save.bestDeaths)save.bestDeaths=deaths;
      }
      persist();
      if(state!=='win')setTimeout(()=>loadLevel(level),400);
    }
  });
}

function die(){pDead=true;pDeadTimer=40;for(let i=0;i<20;i++) particles.push({x:px+8,y:py+14,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,col:'#ff4488',life:35,sz:3});}

function draw(){
  const lv=LEVELS[Math.min(level,LEVELS.length-1)];
  ctx.fillStyle='#05050f';ctx.fillRect(0,0,W,H);

  // Stars BG
  if(tick%4===0){ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(Math.random()*W,Math.random()*H,1,1);}

  if(state==='menu'){drawMenu();return;}
  if(state==='win'){drawWin();return;}

  // Tiles
  tiles.forEach((row,ri)=>row.forEach((t,ci)=>{
    const sx=ci*TS,sy=ri*TS;
    if(t===1){
      ctx.fillStyle='#1a1a2e';ctx.fillRect(sx,sy,TS,TS);
      ctx.fillStyle=lv.col;ctx.fillRect(sx,sy,TS,3);
      ctx.fillRect(sx,sy+TS-3,TS,3);
      ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(sx+2,sy+4,TS-4,TS-8);
    }
    if(t===2){ // spike up (kills from above)
      ctx.fillStyle='#f44';
      ctx.beginPath();ctx.moveTo(sx+4,sy+TS);ctx.lineTo(sx+TS/2,sy+4);ctx.lineTo(sx+TS-4,sy+TS);ctx.closePath();ctx.fill();
    }
    if(t===3){ // spike down
      ctx.fillStyle='#f44';
      ctx.beginPath();ctx.moveTo(sx+4,sy);ctx.lineTo(sx+TS/2,sy+TS-4);ctx.lineTo(sx+TS-4,sy);ctx.closePath();ctx.fill();
    }
  }));

  // Objects
  objects.forEach(o=>{
    if(o.type==='star'&&!o.collected){
      ctx.shadowColor=o.col;ctx.shadowBlur=12;
      ctx.fillStyle=o.col;
      const bob=Math.sin(tick*0.06)*4;
      // Star shape
      ctx.save();ctx.translate(o.x,o.y+bob);ctx.rotate(tick*0.02);
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=i/5*Math.PI*2-Math.PI/2;const ai=a+Math.PI/5;
        if(i===0)ctx.moveTo(Math.cos(a)*10,Math.sin(a)*10);
        else ctx.lineTo(Math.cos(a)*10,Math.sin(a)*10);
        ctx.lineTo(Math.cos(ai)*5,Math.sin(ai)*5);
      }ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;
    }
    if(o.type==='ghost'&&!o.collected){
      const pulse=0.6+0.4*Math.sin(tick*0.15);
      ctx.shadowColor='#00fff5';ctx.shadowBlur=16*pulse;
      ctx.fillStyle=`rgba(0,255,245,${0.35+0.35*pulse})`;
      ctx.beginPath();ctx.arc(o.x,o.y+Math.sin(tick*0.08)*3,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e8ffff';ctx.font='14px serif';ctx.textAlign='center';
      ctx.fillText('👻',o.x,o.y+Math.sin(tick*0.08)*3+5);ctx.shadowBlur=0;
    }
    if(o.type==='exit'){
      ctx.shadowColor='#ffd700';ctx.shadowBlur=20;
      ctx.fillStyle='rgba(255,215,0,0.15)';ctx.fillRect(o.x,o.y,TS,TS);
      ctx.strokeStyle='#ffd700';ctx.lineWidth=2;ctx.strokeRect(o.x+2,o.y+2,TS-4,TS-4);
      ctx.fillStyle='#ffd700';ctx.font='18px serif';ctx.textAlign='center';
      ctx.fillText('🚪',o.x+TS/2,o.y+TS/2+7);ctx.shadowBlur=0;
    }
  });

  // Gravity indicator
  ctx.fillStyle='rgba(255,255,255,0.06)';
  for(let x=0;x<W;x+=80){
    ctx.font='14px monospace';ctx.textAlign='center';
    ctx.fillText(gravDir>0?'▼':'▲',x+40,gravDir>0?H-8:16);
  }

  // Particles
  particles=particles.filter(p=>{
    ctx.globalAlpha=p.life/40;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.life-=2;return p.life>0;
  });ctx.globalAlpha=1;

  // Player
  if(!pDead){
    ctx.shadowColor=ghostT>0?'#00fff5':lv.col;ctx.shadowBlur=ghostT>0?18:10;
    if(ghostT>0)ctx.globalAlpha=0.55;
    ctx.fillStyle=lv.col;
    const flip=gravDir<0;
    ctx.save();ctx.translate(px+8,py+14);if(flip)ctx.scale(1,-1);
    // Body
    ctx.fillStyle='#4060cc';ctx.fillRect(-8,-14,16,14);
    // Head
    ctx.fillStyle='#ffcc88';ctx.beginPath();ctx.arc(0,-20,8,0,Math.PI*2);ctx.fill();
    // Eyes
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(3,-21,2,0,Math.PI*2);ctx.fill();
    // Legs
    ctx.fillStyle='#2244aa';
    const legSwing=pvx!==0?Math.sin(tick*0.3)*8:0;
    ctx.fillRect(-7,0,6,12+legSwing);ctx.fillRect(1,0,6,12-legSwing);
    ctx.restore();ctx.shadowBlur=0;ctx.globalAlpha=1;

    // Gravity flip indicator
    if(gravFlipCd>0){
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.fillRect(px-2,py-4,20*(1-gravFlipCd/25),3);
    }
    // Ghost timer + dash cooldown bars
    if(ghostT>0){
      ctx.fillStyle='rgba(0,255,245,0.8)';
      ctx.fillRect(px-2,py-8,20*(ghostT/300),3);
    }
    if(dashCd>0){
      ctx.fillStyle='rgba(0,255,245,0.35)';
      ctx.fillRect(px-2,py+30,20*(1-dashCd/55),3);
    }
  }

  // HUD level name
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,20);
  ctx.fillStyle=lv.col;ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText(`LEVEL ${level+1}: ${lv.name}`,W/2,14);
  ctx.textAlign='right';ctx.fillStyle='#666';ctx.font='10px monospace';
  ctx.fillText(`SPACE = FLIP GRAVITY  ${gravFlipCd>0?'⏳':'✅'}`,W-8,14);
  ctx.textAlign='left';ctx.fillStyle='#666';
  ctx.fillText(`⏱${((tick-levelStartTick)/60).toFixed(1)}s`,8,14);
  ctx.textAlign='right';
  ctx.fillText(`SHIFT=DASH ${dashCd>0?'⏳':'✅'}`,W-8,28);

  // Pause overlay
  if(paused){
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 36px monospace';ctx.textAlign='center';
    ctx.fillText('PAUSED',W/2,H/2-10);
    ctx.fillStyle='#888';ctx.font='13px monospace';
    ctx.fillText('Press P / Esc or ⏸ to resume',W/2,H/2+24);
  }
}

function drawMenu(){
  ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,W,H);
  ctx.shadowColor='#a0ff60';ctx.shadowBlur=30;
  ctx.fillStyle='#a0ff60';ctx.font='bold 52px monospace';ctx.textAlign='center';
  ctx.fillText('GRAVITY',W/2,H/2-60);ctx.fillText('SHIFT',W/2,H/2-8);
  ctx.shadowBlur=0;ctx.fillStyle='#555';ctx.font='13px monospace';
  ctx.fillText('6 mind-bending levels · flip gravity to survive',W/2,H/2+44);
  ctx.fillText('Collect stars · reach the door',W/2,H/2+64);
  ctx.fillStyle='#ffe600';ctx.font='bold 15px monospace';ctx.fillText('PRESS ENTER',W/2,H/2+110);
  ctx.fillStyle='#888';ctx.font='12px monospace';
  if(save.bestStars>0)ctx.fillText(`BEST: ⭐${save.bestStars} · 💀${save.bestDeaths}`,W/2,H/2+136);
  ctx.fillText(`UNLOCKED ${save.unlocked}/${LEVELS.length} — press 1-${save.unlocked} to jump in`,W/2,H/2+156);
}

function drawWin(){
  ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(0,0,W,H);
  ctx.shadowColor='#ffd700';ctx.shadowBlur=40;
  ctx.fillStyle='#ffd700';ctx.font='bold 48px monospace';ctx.textAlign='center';
  ctx.fillText('YOU WIN! 🏆',W/2,H/2-40);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='18px monospace';
  ctx.fillText(`Stars: ${totalStars} · Deaths: ${deaths}`,W/2,H/2+10);
  ctx.fillStyle='#888';ctx.font='13px monospace';
  ctx.fillText(`Best: ⭐${save.bestStars} · 💀${save.bestDeaths}`,W/2,H/2+36);
  ctx.fillStyle='#ffe600';ctx.font='14px monospace';ctx.fillText('PRESS ENTER TO REPLAY',W/2,H/2+70);
}

function tryFlip(){
  if(state!=='playing'||paused||pDead||gravFlipCd>0)return;
  gravDir*=-1;gravFlipCd=25;pvy*=-0.3;
  for(let i=0;i<10;i++) particles.push({x:px+8,y:py+14,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,col:'#a0ff60',life:25,sz:2});
}
function tryDash(){
  if(state!=='playing'||paused||pDead||dashCd>0)return;
  dashT=12;dashCd=55;
  for(let i=0;i<8;i++) particles.push({x:px+8,y:py+14,vx:-facing*(2+Math.random()*3),vy:(Math.random()-.5)*3,col:'#00fff5',life:25,sz:3});
}
function togglePause(){
  if(state!=='playing')return;
  paused=!paused;
  document.getElementById('pauseBtn').textContent=paused?'▶':'⏸';
}
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
  if(e.code==='Enter'){
    if(state==='menu'||state==='win')startLevel(0);
  }
  if(state==='menu'&&/^Digit[1-6]$/.test(e.code)){
    const n=+e.code.slice(5);
    if(n>=1&&n<=save.unlocked)startLevel(n-1);
  }
  if(e.code==='KeyR'&&state==='playing'&&!paused){loadLevel(level);}
  if(e.code==='KeyP'||e.code==='Escape')togglePause();
  if(e.code==='Space'||e.code==='KeyW')tryFlip();
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')tryDash();
});
document.addEventListener('keyup',e=>keys[e.code]=false);

document.getElementById('pauseBtn').addEventListener('click',e=>{e.preventDefault();togglePause();});
// Auto-pause when the tab is hidden
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'&&!paused)togglePause();});
// Touch controls (mobile pack): each button owns its own key code, so multi-touch is safe
function bindHold(id,code){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();keys[code]=true;},{passive:false});
  const off=e=>{e.preventDefault();keys[code]=false;};
  el.addEventListener('touchend',off);
  el.addEventListener('touchcancel',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindHold('t-left','ArrowLeft');bindHold('t-right','ArrowRight');
document.getElementById('t-flip').addEventListener('touchstart',e=>{e.preventDefault();tryFlip();},{passive:false});
document.getElementById('t-dash').addEventListener('touchstart',e=>{e.preventDefault();tryDash();},{passive:false});
document.getElementById('t-flip').addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('t-dash').addEventListener('contextmenu',e=>e.preventDefault());
// Tap the canvas to start from menu / replay from win screen
C.addEventListener('touchstart',e=>{e.preventDefault();if(state==='menu'||state==='win')startLevel(0);},{passive:false});
// Stop pull-to-refresh / scroll / zoom gestures mid-game
document.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
// Fit canvas to screen, preserving the 640x420 aspect ratio
function fit(){
  const pad=document.body.classList.contains('touch')?200:80;
  const s=Math.min(window.innerWidth/W,Math.max(0.2,(window.innerHeight-pad)/H));
  C.style.width=Math.floor(W*s)+'px';C.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',()=>setTimeout(fit,100));
if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('touch');
fit();

function loop(){tick++;if(state==='playing'&&!paused)update();draw();requestAnimationFrame(loop);}
loop();
</script>
