<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Speed Typer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
body{background:#050810;overflow:hidden;height:100vh;width:100vw;font-family:'Space Mono',monospace;color:#88ffcc;}
canvas{position:absolute;top:0;left:0;touch-action:none;}
#typeBox,#kbd{-webkit-user-select:text;user-select:text;}
#kbd{position:fixed;top:-80px;left:0;width:48px;height:48px;opacity:0;font-size:16px;border:0;padding:0;background:transparent;color:transparent;}
#pauseBtn{position:fixed;top:60px;right:16px;width:48px;height:48px;z-index:30;display:none;background:#050810ee;border:1px solid #00ffaa66;color:#00ffaa;border-radius:10px;font-size:20px;cursor:pointer;font-family:'Space Mono',monospace;}
#pauseBtn:active{background:#00ffaa33;}
#tapPrompt{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:15;display:none;text-align:center;background:#050810ee;border:1px solid #00ffaa66;border-radius:12px;padding:10px 22px;color:#00ffaa;font-size:14px;letter-spacing:2px;white-space:nowrap;}
#tapTarget{font-size:11px;color:#1a4a2a;margin-top:4px;letter-spacing:1px;}
.bestline{color:#00ffaa;font-size:12px;letter-spacing:3px;margin-bottom:24px;text-align:center;}
#ui{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:10;}
#topbar{height:52px;background:#050810ee;border-bottom:1px solid #0a2a1a;display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.hv{font-size:20px;font-weight:700;color:#00ffaa;}
.hl{font-size:8px;letter-spacing:3px;color:#1a4a2a;margin-top:2px;}
#inputArea{position:fixed;bottom:0;left:0;right:0;padding:16px 24px;background:#050810ee;border-top:1px solid #0a2a1a;z-index:10;display:none;}
#typeBox{width:100%;background:transparent;border:none;border-bottom:2px solid #00ffaa44;color:#88ffcc;font-family:'Space Mono',monospace;font-size:22px;outline:none;padding:8px 0;caret-color:#00ffaa;letter-spacing:2px;}
#wordDisplay{font-size:14px;color:#1a4a2a;margin-top:6px;letter-spacing:1px;}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050810ee;z-index:20;}
#msg h1{font-size:56px;font-weight:700;letter-spacing:4px;color:#00ffaa;margin-bottom:8px;text-align:center;text-shadow:0 0 40px #00ffaa44;}
#msg p{color:#1a4a2a;font-size:13px;margin-bottom:24px;text-align:center;line-height:2.5;}
.btn{background:transparent;border:2px solid #00ffaa;color:#00ffaa;padding:12px 38px;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:4px;cursor:pointer;transition:all .2s;}
.btn:hover{background:#00ffaa22;box-shadow:0 0 20px #00ffaa44;}
#combo{position:fixed;top:116px;right:20px;text-align:right;pointer-events:none;z-index:10;}
#comboVal{font-size:32px;font-weight:700;color:#00ffaa;opacity:0;transition:opacity .3s;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="topbar">
    <div><div class="hv" id="scoreV">0</div><div class="hl">SCORE</div></div>
    <div style="text-align:center"><div class="hv" id="wpmV">0</div><div class="hl">WPM</div></div>
    <div style="text-align:right"><div class="hv" id="livesV">♥♥♥</div><div class="hl">LIVES</div></div>
  </div>
</div>
<div id="combo"><div id="comboVal">x1</div></div>
<button id="pauseBtn" aria-label="Pause">⏸</button>
<input id="kbd" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-hidden="true">
<div id="tapPrompt"><div>⌨ TAP TO TYPE</div><div id="tapTarget"></div></div>
<div id="inputArea">
  <input id="typeBox" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type here...">
  <div id="wordDisplay">Loading words...</div>
</div>
<div id="msg">
  <h1>SPEED<br>TYPER</h1>
  <p>Type falling words before they hit the bottom.<br>Combo multiplier up to x8!<br>Miss 3 words and it's over.<br>💣 bombs clear the screen · ❄ slows time · ⚡ rush every 5 levels</p>
  <div id="bestStart" class="bestline"></div>
  <button class="btn" onclick="startGame()">▶ START TYPING</button>
</div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var typeBox=document.getElementById('typeBox'),kbd=document.getElementById('kbd');
var W,H;
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,100);});

var WORDS=['abandon','ability','above','absence','absolute','accept','access','account','achieve','action',
'address','advance','advice','affect','afford','agency','agent','agree','alarm','alert','align',
'allow','ancient','answer','appeal','apply','armor','array','arrow','asset','assign','attack',
'badge','beacon','blast','blend','block','bonus','boost','brave','breach','break','bright',
'build','burst','cabal','cache','cargo','chain','chaos','charge','chasm','clash','clear',
'climb','clone','cloud','codec','comet','combo','craft','crash','cross','crowd','crush',
'cyber','cycle','dance','dartz','debug','decay','delta','demon','depth','descend','detect',
'device','ditch','dodge','dominate','drain','dream','drive','drone','elite','ember','empty',
'energy','engine','error','escape','evade','event','exact','exhaust','exile','exist','expand',
'exploit','expose','extract','fable','faith','false','fatal','fever','field','fight','final',
'flame','flash','fleet','float','focus','force','forge','found','frame','front','frost','fuel',
'ghost','glide','glyph','grace','grasp','graze','grind','grip','group','guard','guide','haste',
'hazard','heart','helix','hex','high','horde','hover','hyper','impact','index','infinite',
'inject','intel','ionic','issue','karma','kill','knight','laser','latch','launch','legend',
'level','limit','link','logic','lore','loyal','macro','magic','matrix','merge','might',
'mission','modem','morph','neural','nexus','ninja','noble','node','noise','nullify','orbit',
'order','origin','output','overload','pack','panic','parse','patch','pause','phase','pixel',
'plasma','power','prime','probe','pulse','purge','query','queue','quick','quest','radar',
'radiant','reach','reboot','recall','relay','remote','rogue','route','rush','sabotage','script',
'sensor','shard','shield','shift','shock','signal','skill','slash','slice','snipe','solar',
'solid','solve','sonic','spark','spawn','speed','spike','spiral','squad','star','static',
'storm','surge','swift','system','target','tech','titan','track','trade','trait','trap',
'turbo','ultra','unity','unlock','vault','vector','void','valor','virus','wave','wired','zero'];

var gameState='menu';
var wordObjs=[],score=0,lives=3,combo=1,wpm=0,frame=0;
var typed='';
var wpmWords=0,wpmTime=0;
var comboTimer=0;
var particles=[];
var level=1,spawnTimer=0,spawnInterval=120;
var paused=false,slowmo=0,rush=0;
var coarsePtr=false;
try{coarsePtr=window.matchMedia('(pointer: coarse)').matches;}catch(e){}
var isTouch=(('ontouchstart' in window)||navigator.maxTouchPoints>0)&&coarsePtr;
var best={score:0,wpm:0};
try{var _b=JSON.parse(localStorage.getItem('pfg2_speed_typer'));if(_b&&typeof _b.score==='number')best=_b;}catch(e){}
function saveBest(){try{localStorage.setItem('pfg2_speed_typer',JSON.stringify(best));}catch(e){}}
function clearInputs(){typeBox.value='';kbd.value='';typed='';}
function focusKbd(){
  if(isTouch&&gameState==='play'&&!paused){
    try{kbd.focus({preventScroll:true});}catch(e){kbd.focus();}
  }
}
function refreshTapPrompt(){
  document.getElementById('tapPrompt').style.display=(isTouch&&gameState==='play'&&!paused)?'block':'none';
}

function startGame(){
  document.getElementById('msg').style.display='none';
  paused=false;
  document.getElementById('pauseBtn').textContent='⏸';
  document.getElementById('pauseBtn').style.display='block';
  if(isTouch){
    document.getElementById('inputArea').style.display='none';
  }else{
    document.getElementById('inputArea').style.display='block';
    typeBox.focus();
  }
  score=0;lives=3;combo=1;wpm=0;frame=0;wpmWords=0;wpmTime=0;comboTimer=0;
  wordObjs=[];particles=[];level=1;spawnTimer=0;spawnInterval=120;
  slowmo=0;rush=0;
  clearInputs();
  updateUI();
  gameState='play';
  refreshTapPrompt();
  if(isTouch)focusKbd();
}

function spawnWord(){
  var w=WORDS[Math.floor(Math.random()*WORDS.length)];
  var spd=0.6+level*.12+Math.random()*.4;
  var x=60+Math.random()*(W-120);
  var col=['#00ffaa','#44ffcc','#88ff88','#00ccff','#44ff44'][Math.floor(Math.random()*5)];
  var bomb=level>=2&&Math.random()<0.08;
  var slow=!bomb&&level>=3&&Math.random()<0.07;
  wordObjs.push({word:w,typed:'',x:x,y:52,spd:spd,col:col,shake:0,matched:false,deleteTimer:0,bomb:bomb,slow:slow});
}

function updateUI(){
  document.getElementById('scoreV').textContent=score;
  document.getElementById('livesV').textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,Math.min(3,3-lives)));
  document.getElementById('wpmV').textContent=wpm;
  // update word display: show closest word
  var close=wordObjs.filter(function(w){return!w.matched;}).sort(function(a,b){return b.y-a.y;})[0];
  var icon=close?(close.bomb?'💣 ':close.slow?'❄ ':''):'';
  var disp=close?('<span style="color:#1a4a2a">Target: </span>'+icon+'<span style="color:'+close.col+'">'+
    '<span style="color:#00ffaa">'+close.typed+'</span>'+close.word.slice(close.typed.length)+'</span>'):'';
  document.getElementById('wordDisplay').innerHTML=disp||'<span style="color:#1a4a2a">Keep going...</span>';
  var tt=document.getElementById('tapTarget');
  if(tt)tt.innerHTML=disp||'Keep going...';
}

function checkTyped(input){
  if(!input) return;
  // find best match
  var best=null,bestScore=-1;
  for(var i=0;i<wordObjs.length;i++){
    var w=wordObjs[i];
    if(w.matched) continue;
    if(w.word.startsWith(input)){
      var s=input.length;
      if(s>bestScore){bestScore=s;best=w;}
    }
  }
  // update all
  wordObjs.forEach(function(w){if(!w.matched) w.typed='';});
  if(best){
    best.typed=input;
    if(best.typed===best.word){
      // completed!
      best.matched=true;
      combo=Math.min(8,combo+1);
      var pts=(best.word.length*10+level*5)*combo;
      if(rush>0)pts*=2;
      score+=pts;
      wpmWords++;
      spawnParticles(best.x,best.y,best.col);
      if(best.bomb){
        // detonate: clear every other falling word
        var cleared=0;
        wordObjs.forEach(function(w){
          if(w!==best&&!w.matched){w.matched=true;w.deleteTimer=30;cleared++;spawnParticles(w.x,w.y,w.col);}
        });
        spawnParticles(best.x,best.y,'#ff8844');
        score+=cleared*20;
      }
      if(best.slow){slowmo=360;}
      showCombo();
      clearInputs();
      comboTimer=0;
      updateUI();
    }
  } else {
    // no match — partial mismatch, allow
  }
}

function showCombo(){
  var el=document.getElementById('comboVal');
  el.textContent='x'+combo;el.style.opacity='1';
  el.style.color=combo>=4?'#ffdd00':combo>=2?'#44ffcc':'#00ffaa';
  el.style.fontSize=(20+combo*4)+'px';
  clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},800);
}

function spawnParticles(x,y,col){
  for(var i=0;i<18;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col,life:30+Math.random()*20,r:2+Math.random()*3});}
}

function update(){
  if(gameState!=='play'||paused) return;
  frame++;
  // WPM calc
  if(frame%60===0){wpmTime++;wpm=Math.round((wpmWords*60)/Math.max(1,wpmTime));}
  // powerup timers
  if(slowmo>0)slowmo--;
  if(rush>0)rush--;
  // combo decay
  comboTimer++;
  if(comboTimer>300){combo=Math.max(1,combo-1);comboTimer=0;}
  // level up
  if(frame%1200===0){level++;spawnInterval=Math.max(40,spawnInterval-12);if(level%5===0)rush=1200;}
  // spawn
  spawnTimer+=(rush>0?2:1);
  if(spawnTimer>=spawnInterval){spawnTimer=0;spawnWord();}
  if(wordObjs.length<2)spawnWord();
  // update words
  for(var i=wordObjs.length-1;i>=0;i--){
    var w=wordObjs[i];
    if(w.matched){w.deleteTimer++;if(w.deleteTimer>40)wordObjs.splice(i,1);continue;}
    w.y+=w.spd*(slowmo>0?0.35:1);
    if(w.shake>0)w.shake--;
    // hit bottom
    if(w.y>H-100){
      lives-=w.bomb?2:1;
      combo=1;comboTimer=0;
      w.shake=10;
      spawnParticles(w.x,w.y,'#ff4444');
      wordObjs.splice(i,1);
      updateUI();
      if(lives<=0){gameDead();return;}
    }
  }
  // particles
  for(var i2=particles.length-1;i2>=0;i2--){
    var p=particles[i2];p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--;
    if(p.life<=0)particles.splice(i2,1);
  }
  if(frame%8===0)updateUI();
}

function gameDead(){
  gameState='over';
  paused=false;
  kbd.blur();typeBox.blur();
  var newBest=false;
  if(score>best.score){best.score=score;newBest=true;}
  if(wpm>best.wpm){best.wpm=wpm;newBest=true;}
  saveBest();
  document.getElementById('inputArea').style.display='none';
  document.getElementById('pauseBtn').style.display='none';
  refreshTapPrompt();
  document.getElementById('msg').style.display='flex';
  document.getElementById('msg').innerHTML=
    '<h1 style="color:#ff4444">GAME OVER</h1>'+
    '<p style="color:#1a4a2a">Score: '+score+'<br>WPM: '+wpm+'<br>Level: '+level+'</p>'+
    (newBest?'<div class="bestline" style="color:#ffdd00">★ NEW BEST ★</div>'
            :'<div class="bestline">BEST '+best.score+' PTS · '+best.wpm+' WPM</div>')+
    '<button class="btn" onclick="startGame()">TRY AGAIN</button>';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#050810';ctx.fillRect(0,0,W,H);
  // matrix bg rain
  if(frame%3===0){
    ctx.fillStyle='rgba(0,255,170,0.013)';
    for(var i=0;i<4;i++){
      var x=Math.random()*W,y=Math.random()*H;
      ctx.font='10px Space Mono,monospace';
      ctx.fillText(String.fromCharCode(0x30a0+Math.random()*96),x,y);
    }
  }
  // grid
  ctx.strokeStyle='#0a1a12';ctx.lineWidth=.4;
  for(var x=0;x<W;x+=50)ctx.strokeRect(x,0,50,H);

  // particles
  particles.forEach(function(p){
    ctx.globalAlpha=p.life/50;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;

  if(gameState!=='play') return;
  if(paused){
    ctx.fillStyle='rgba(5,8,16,0.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#00ffaa';ctx.font='bold 46px Space Mono,monospace';
    ctx.fillText('PAUSED',W/2,H/2-12);
    ctx.fillStyle='#1a4a2a';ctx.font='15px Space Mono,monospace';
    ctx.fillText(isTouch?'Tap ▶ to resume':'Click ▶ or press Esc to resume',W/2,H/2+28);
    ctx.textAlign='left';
    return;
  }
  // rush banner
  if(rush>0){
    ctx.textAlign='center';
    ctx.fillStyle=(Math.floor(frame/20)%2===0)?'#ffdd00':'#ff8800';
    ctx.font='bold 18px Space Mono,monospace';
    ctx.fillText('⚡ RUSH ×2 POINTS ⚡',W/2,84);
    ctx.textAlign='left';
  }
  // slow-mo timer bar
  if(slowmo>0){
    ctx.fillStyle='rgba(68,221,255,0.2)';ctx.fillRect(0,52,W,5);
    ctx.fillStyle='#44ddff';ctx.fillRect(0,52,W*(slowmo/360),5);
  }
  // danger zone
  ctx.fillStyle='rgba(255,50,50,0.04)';ctx.fillRect(0,H-100,W,100);
  ctx.strokeStyle='rgba(255,50,50,0.2)';ctx.lineWidth=1;ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(0,H-100);ctx.lineTo(W,H-100);ctx.stroke();
  ctx.setLineDash([]);

  // words
  wordObjs.forEach(function(w){
    var sx=w.shake>0?(Math.random()*4-2):0;
    var alpha=w.matched?Math.max(0,1-w.deleteTimer/20):1;
    ctx.globalAlpha=alpha;
    ctx.font='bold 20px Space Mono,monospace';
    ctx.textAlign='center';
    // glow
    ctx.shadowColor=w.bomb?'#ff4444':w.slow?'#44ddff':w.col;
    ctx.shadowBlur=(w.bomb||w.slow)?14+Math.sin(frame/6)*8:12;
    // typed part
    if(w.typed){
      ctx.fillStyle='#ffffff';
      var tw=ctx.measureText(w.word).width;
      ctx.fillText(w.typed,w.x+sx-tw/2+ctx.measureText(w.typed).width/2,w.y);
    }
    // remaining
    var remain=w.word.slice(w.typed.length);
    ctx.fillStyle=w.col;
    if(w.typed){
      var typedW=ctx.measureText(w.typed).width;
      var totalW=ctx.measureText(w.word).width;
      ctx.fillText(remain,w.x+sx+typedW-totalW/2,w.y);
    } else {
      ctx.fillText(w.word,w.x+sx,w.y);
    }
    // powerup icon
    if(w.bomb||w.slow){
      var iw=ctx.measureText(w.word).width;
      ctx.font='20px Space Mono,monospace';
      ctx.fillText(w.bomb?'💣':'❄',w.x+sx-iw/2-28,w.y+1);
      ctx.font='bold 20px Space Mono,monospace';
    }
    ctx.shadowBlur=0;
    // danger pulse
    var danger=(w.y-52)/(H-152);
    if(danger>.7){ctx.fillStyle='rgba(255,50,50,'+((danger-.7)/.3*.4)+')';ctx.fillRect(w.x-80,w.y-20,160,24);}
    ctx.globalAlpha=1;
  });
  ctx.textAlign='left';
}

typeBox.addEventListener('input',function(e){
  if(gameState!=='play'||paused)return;
  typed=e.target.value.trim().toLowerCase();
  checkTyped(typed);
});
typeBox.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();typeBox.value='';typed='';}
});
// hidden mobile keyboard input — feeds the same word-matching path as the desktop box
kbd.addEventListener('input',function(){
  if(gameState!=='play'||paused)return;
  typed=kbd.value.trim().toLowerCase();
  checkTyped(typed);
});
kbd.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='Enter'){e.preventDefault();kbd.value='';typed='';}
});
kbd.addEventListener('blur',function(){
  // keep the OS keyboard up during active mobile play
  setTimeout(function(){
    if(isTouch&&gameState==='play'&&!paused&&document.activeElement!==kbd)focusKbd();
  },150);
});
// tap game area to summon the OS keyboard
cv.addEventListener('touchstart',function(){focusKbd();},{passive:true});
document.getElementById('tapPrompt').addEventListener('touchstart',function(e){e.stopPropagation();focusKbd();},{passive:true});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
// pause hotkeys (single letters ignored while typing a word, except to resume)
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(gameState==='play')togglePause();return;}
  var t=e.target;
  var typingIn=t&&(t===typeBox||t===kbd);
  if((e.key==='p'||e.key==='P')&&gameState==='play'&&(!typingIn||paused))togglePause();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&gameState==='play'&&!paused)togglePause();
});
document.getElementById('pauseBtn').addEventListener('click',function(){
  togglePause();
  if(!paused){
    if(isTouch)focusKbd();else typeBox.focus();
  }
});
function togglePause(){
  if(gameState!=='play')return;
  paused=!paused;
  document.getElementById('pauseBtn').textContent=paused?'▶':'⏸';
  if(paused){kbd.blur();if(isTouch)typeBox.blur();}
  refreshTapPrompt();
}
function refreshBestLine(){
  var el=document.getElementById('bestStart');
  if(el)el.textContent=best.score>0?('BEST '+best.score+' PTS · '+best.wpm+' WPM'):'';
}
refreshBestLine();

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
