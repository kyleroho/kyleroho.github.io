<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STAR DODGE — Pixel Forge Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{touch-action:none;overscroll-behavior:none;}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;font-family:"Courier New",monospace;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;top:8px;left:0;right:64px;display:flex;justify-content:center;gap:30px;font-size:13px;color:#aaa;pointer-events:none;}
#ui b{color:#fff;}
a{color:#ff3fa4;font-size:11px;text-decoration:none;pointer-events:all;}a:hover{color:#fff;}
#pauseBtn{position:fixed;top:10px;right:10px;z-index:80;width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid #888;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
#dashBtn{position:fixed;bottom:26px;right:18px;z-index:80;width:72px;height:72px;border-radius:50%;background:rgba(68,170,255,.25);border:2px solid #44aaff;color:#fff;font-size:30px;cursor:pointer;display:none;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;}
body.touch #dashBtn{display:flex;}
</style>
</head>
<body>
<div id="ui">
  <span>SCORE <b id="sc">0</b></span>
  <span>BEST <b id="bs">0</b></span>
  <span>LIVES <b id="lv">3</b></span>
  <span>LEVEL <b id="lv2">1</b></span>
  <a href="index.html">Back</a>
</div>
<button id="pauseBtn" aria-label="Pause">⏸</button>
<button id="dashBtn" aria-label="Dash">⚡</button>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=600,H=700;C.width=W;C.height=H;
const TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const pauseBtn=document.getElementById('pauseBtn'),dashBtn=document.getElementById('dashBtn');

// High score (migrated to namespaced key; falls back to legacy key once)
function loadBest(){try{const v=localStorage.getItem('pfg2_star_dodge');if(v!==null)return parseInt(v)||0;return parseInt(localStorage.getItem('sd_best')||'0')||0;}catch(e){return 0;}}
function saveBest(){try{localStorage.setItem('pfg2_star_dodge',String(best));}catch(e){}}

// Player
let px=W/2,py=H-80,pdx=0,pdy=0,pR=10,pInv=0,pTrail=[],pDash=0,pDashCD=0;
let lives=3,score=0,best=loadBest(),level=1,phase=0,dead=false,started=false,paused=false;
let bullets=[],particles=[],stars=[],rings=[],powerups=[],floaters=[];
let shield=0,slowmo=0;
let keys={};

// Stars
for(let i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.3,spd:Math.random()*1+.3});

// Patterns
const PATTERNS=[
  // Spiral
  (t)=>{for(let i=0;i<6;i++){const a=t*.04+i/6*Math.PI*2;bullets.push({x:W/2,y:H/2,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:5,col:'#ff3fa4',life:200});}},
  // Rain
  ()=>{for(let i=0;i<3;i++)bullets.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5),vy:2+level*.3,r:6,col:'#00fff5',life:300});},
  // Fan from sides
  (t)=>{if(t%60===0){const side=Math.random()<.5?0:W;for(let i=0;i<5;i++){const a=(-Math.PI/2)+((i-2)/4)*(Math.PI*.6)+(side?Math.PI:0);bullets.push({x:side,y:Math.random()*H*.6+50,vx:Math.cos(a)*4,vy:Math.sin(a)*4,r:7,col:'#ffe600',life:220});}}},
  // Aimed burst
  ()=>{const a=Math.atan2(py-H/3,px-W/2);for(let i=-2;i<=2;i++){const aa=a+i*.18;bullets.push({x:W/2,y:H/3,vx:Math.cos(aa)*4.5,vy:Math.sin(aa)*4.5,r:6,col:'#ff6600',life:200});}},
  // Ring expand
  ()=>{const n=12;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;bullets.push({x:W/2,y:H/2,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,r:6,col:'#7fff00',life:250});}},
  // Homing stars (level 2+)
  ()=>{if(level>=2)for(let i=0;i<2;i++)bullets.push({x:Math.random()*W,y:-12,vx:(Math.random()-.5)*2,vy:2,r:7,col:'#ff00ff',life:420,hom:true});},
];

let phaseTick=0,patternIdx=0;

function spawnBullets(){
  phaseTick++;
  const rate=Math.max(8,30-level*2);
  if(phaseTick%rate===0){
    PATTERNS[patternIdx%PATTERNS.length](phaseTick);
    if(phaseTick%80===0)patternIdx++;
  }
  // Spawn power-ups
  if(phaseTick%300===0){
    const types=['shield','slow','bomb'];
    powerups.push({x:Math.random()*(W-60)+30,y:-20,type:types[Math.floor(Math.random()*3)],vy:1.5});
  }
  // Move powerups
  powerups=powerups.filter(p=>p.y<H+20);
  powerups.forEach(p=>{
    p.y+=p.vy;
    if(Math.hypot(p.x-px,p.y-py)<pR+14){
      if(p.type==='shield'){shield=180;for(let i=0;i<12;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,col:'#44aaff',life:30,sz:3});}
      else if(p.type==='slow'){slowmo=180;for(let i=0;i<12;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,col:'#ffe600',life:30,sz:3});}
      else{
        // Nova bomb: clear the screen
        const n=bullets.length;
        bullets.forEach((b,i)=>{if(i<60)particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,col:b.col,life:30,sz:3});});
        bullets=[];rings=[];
        rings.push({x:px,y:py,r:10,maxR:420,spd:14,col:'#ffffff'});
        score+=Math.min(n*2,100);
        floaters.push({x:px,y:py-24,txt:'NOVA!',life:60,col:'#ffffff'});
        pEmit('#ffffff');
      }
      p.y=H+99;
    }
  });
  if(shield>0)shield--;if(slowmo>0)slowmo--;
  // Boss ring occasionally
  if(level>=3&&phaseTick%200===0)rings.push({x:W/2,y:H/2,r:20,maxR:300,spd:4,col:'#ff3fa4'});
}

function exhaust(){
  pTrail.push({x:px,y:py,a:1});
  if(pTrail.length>18)pTrail.shift();
}

function pEmit(col){
  for(let i=0;i<16;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,col,life:35,sz:3});
}

function retry(){
  dead=false;lives=3;score=0;level=1;bullets=[];rings=[];particles=[];pTrail=[];powerups=[];floaters=[];
  shield=0;slowmo=0;phaseTick=0;patternIdx=0;pDash=0;pDashCD=0;pInv=0;
  paused=false;pauseBtn.textContent='⏸';pauseBtn.setAttribute('aria-label','Pause');
  px=W/2;py=H-80;pdx=0;pdy=0;
}

// Shared action: start / retry / dash (Space key, tap, dash button)
function onAction(){
  if(paused){togglePause();return;}
  if(!started){started=true;return;}
  if(dead){retry();return;}
  if(pDashCD===0){pDash=12;pDashCD=60;pInv=12;pEmit('#44aaff');}
}

function togglePause(){
  if(!started||dead)return;
  paused=!paused;
  pauseBtn.textContent=paused?'▶':'⏸';
  pauseBtn.setAttribute('aria-label',paused?'Resume':'Pause');
}

function update(){
  if(dead||!started||paused)return;
  phase++;
  score++;
  if(score>best){best=score;saveBest();}
  if(score%600===0)level=Math.min(10,level+1);

  // Stars
  stars.forEach(s=>{s.y+=s.spd;if(s.y>H)s.y=0;});

  // Move player
  const spd=pDash>0?14:3.8;
  if(joyActive){pdx=joyX*spd;pdy=joyY*spd;}
  else{
    if(keys['ArrowLeft']||keys['KeyA'])pdx=Math.max(-spd,pdx-.6);
    if(keys['ArrowRight']||keys['KeyD'])pdx=Math.min(spd,pdx+.6);
    if(keys['ArrowUp']||keys['KeyW'])pdy=Math.max(-spd,pdy-.6);
    if(keys['ArrowDown']||keys['KeyS'])pdy=Math.min(spd,pdy+.6);
    if(!(keys['ArrowLeft']||keys['KeyA'])&&!(keys['ArrowRight']||keys['KeyD']))pdx*=0.85;
    if(!(keys['ArrowUp']||keys['KeyW'])&&!(keys['ArrowDown']||keys['KeyS']))pdy*=0.85;
  }
  px=Math.max(pR,Math.min(W-pR,px+pdx));
  py=Math.max(pR,Math.min(H-pR,py+pdy));
  if(pDash>0)pDash--;
  if(pDashCD>0)pDashCD--;
  exhaust();

  // Bullets
  spawnBullets();
  bullets=bullets.filter(b=>b.life>0);
  const sm=slowmo>0?0.35:1; // slow-mo as a movement multiplier (no permanent decay)
  bullets.forEach(b=>{
    if(b.hom){
      const a=Math.atan2(py-b.y,px-b.x),cur=Math.atan2(b.vy,b.vx);
      let da=a-cur;
      while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      const na=cur+Math.max(-.08,Math.min(.08,da));
      const v=Math.min(5,Math.hypot(b.vx,b.vy)+.01);
      b.vx=Math.cos(na)*v;b.vy=Math.sin(na)*v;
    }
    b.x+=b.vx*sm;b.y+=b.vy*sm;b.life--;
  });

  // Rings
  rings=rings.filter(r=>r.r<r.maxR);
  rings.forEach(r=>r.r+=r.spd);

  // Collide
  bullets.forEach(b=>{
    const d=Math.hypot(b.x-px,b.y-py);
    if(pInv===0&&shield===0){
      if(d<b.r+pR-3){b.life=0;hit();}
      else if(!b.nm&&d<b.r+pR+18){b.nm=true;score+=5;floaters.push({x:px,y:py-20,txt:'+5',life:45,col:'#ffe600'});}
    }
  });
  if(pInv===0&&shield===0){
    rings.forEach(r=>{
      const d=Math.hypot(r.x-px,r.y-py);
      if(Math.abs(d-r.r)<pR+3)hit();
    });
  }
  if(pInv>0)pInv--;

  // Particles
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.92;p.vy*=.92;p.life-=2;});

  // Floaters
  floaters=floaters.filter(f=>f.life>0);
  floaters.forEach(f=>{f.y-=.6;f.life--;});

  document.getElementById('sc').textContent=score;
  document.getElementById('bs').textContent=best;
  document.getElementById('lv').textContent=lives;
  document.getElementById('lv2').textContent=level;
}

function hit(){
  if(pInv>0||dead)return;
  pInv=90;lives--;pEmit('#ff3fa4');
  if(lives<=0){dead=true;pEmit('#fff');pEmit('#ff3fa4');}
}

function draw(){
  ctx.fillStyle='#000818';ctx.fillRect(0,0,W,H);
  // Nebula glow
  if(tick%120===0){
    const gx=Math.random()*W,gy=Math.random()*H;
    const g=ctx.createRadialGradient(gx,gy,0,gx,gy,120);
    g.addColorStop(0,'rgba(0,80,200,0.04)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  // Stars
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${s.s*.5})`;ctx.fillRect(s.x,s.y,s.s,s.s);});

  // Rings
  rings.forEach(r=>{
    ctx.strokeStyle=r.col;ctx.lineWidth=3;
    ctx.globalAlpha=Math.max(0,1-r.r/r.maxR);
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  });

  // Powerups
  powerups.forEach(p=>{
    const col=p.type==='shield'?'#44aaff':p.type==='slow'?'#ffe600':'#ff6600';
    ctx.shadowColor=col;ctx.shadowBlur=15;ctx.fillStyle=col;
    ctx.beginPath();ctx.arc(p.x,p.y,14,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.font='16px serif';ctx.textAlign='center';
    ctx.fillText(p.type==='shield'?'🛡️':p.type==='slow'?'⏰':'💥',p.x,p.y+6);ctx.shadowBlur=0;
  });
  // Shield ring around player
  if(shield>0){
    ctx.strokeStyle=`rgba(68,170,255,${.5+Math.sin(tick*.2)*.3})`;ctx.lineWidth=3;ctx.shadowColor='#44aaff';ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(px,py,pR+12,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
  }
  if(slowmo>0){
    ctx.fillStyle=`rgba(255,230,0,0.06)`;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffe600';ctx.font='11px monospace';ctx.textAlign='left';ctx.fillText('SLOW MO!',10,H-38);
  }
  // Bullets
  bullets.forEach(b=>{
    ctx.shadowColor=b.col;ctx.shadowBlur=10;
    ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    if(b.hom){ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,Math.PI*2);ctx.fill();}
  });
  ctx.shadowBlur=0;

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/35;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;

  // Floaters (near-miss / nova text)
  floaters.forEach(f=>{
    ctx.globalAlpha=Math.min(1,f.life/25);ctx.fillStyle=f.col;
    ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText(f.txt,f.x,f.y);
  });ctx.globalAlpha=1;

  // Player trail
  pTrail.forEach((t,i)=>{
    const a=(i/pTrail.length)*.5;
    ctx.fillStyle=pDash>0?`rgba(255,200,0,${a})`:`rgba(68,170,255,${a})`;
    ctx.beginPath();ctx.arc(t.x,t.y,(i/pTrail.length)*pR*.7,0,Math.PI*2);ctx.fill();
  });

  // Player
  if(!dead&&(pInv===0||Math.floor(pInv/5)%2===0)){
    ctx.shadowColor=pDash>0?'#ff8800':'#44aaff';ctx.shadowBlur=25;
    ctx.fillStyle=pDash>0?'#ffdd00':'#66bbff';
    ctx.beginPath();ctx.arc(px,py,pR,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(px-3,py-3,3,0,Math.PI*2);ctx.fill();
  }

  // Dash meter
  const dashPct=1-pDashCD/60;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(10,H-22,100,10);
  ctx.fillStyle=dashPct>=1?'#44aaff':'#553388';ctx.fillRect(10,H-22,100*dashPct,10);
  ctx.fillStyle='#44aaff';ctx.font='9px monospace';ctx.textAlign='left';ctx.fillText('DASH [SPACE]',10,H-26);

  // Virtual joystick visual
  if(joyActive){
    const r=C.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
    const bx=(joyOX-r.left)*sx,by=(joyOY-r.top)*sy;
    const kx=(joyOX+jdx-r.left)*sx,ky=(joyOY+jdy-r.top)*sy;
    const rr=60*sx;
    ctx.globalAlpha=.3;ctx.strokeStyle='#44aaff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(bx,by,rr,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=.55;ctx.fillStyle='#44aaff';
    ctx.beginPath();ctx.arc(kx,ky,rr*.38,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  if(!started){drawScreen('STAR DODGE','DODGE THE ENEMY BLASTS!\n\nNEAR MISS = +5 PTS\n\n'+(TOUCH?'DRAG = Move (virtual stick)\n⚡ BUTTON = Dash through bullets\n\nTAP TO START':'ARROWS / WASD = Move\nSPACE = Dash through bullets\n\nPRESS SPACE TO START'),'#44aaff');}
  else if(dead){drawScreen('DEAD','Score: '+score+'\nBest: '+best+'\n\n'+(TOUCH?'TAP TO RETRY':'PRESS SPACE TO RETRY'),'#ff3fa4');}
  else if(paused){drawScreen('PAUSED',TOUCH?'TAP ⏸ TO RESUME':'PRESS P OR ESC TO RESUME','#44aaff');}
}

function drawScreen(title,sub,col){
  ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(0,0,W,H);
  ctx.shadowColor=col;ctx.shadowBlur=40;
  ctx.fillStyle=col;ctx.font='bold 60px monospace';ctx.textAlign='center';ctx.fillText(title,W/2,H/2-80);
  ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='16px monospace';
  sub.split('\n').forEach((line,i)=>ctx.fillText(line,W/2,H/2+i*28));
}

let tick=0;
function loop(){requestAnimationFrame(loop);if(!paused){tick++;update();}draw();}

// ---- Input: keyboard (desktop, unchanged) ----
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyP'||e.code==='Escape'){togglePause();return;}
  if(e.code==='Space'){e.preventDefault();onAction();}
});
document.addEventListener('keyup',e=>keys[e.code]=false);

// ---- Input: touch (floating virtual joystick + dash button + tap to start) ----
let joyId=null,joyOX=0,joyOY=0,joyX=0,joyY=0,jdx=0,jdy=0,joyActive=false;
let tapT=0,tapX=0,tapY=0;
const JOY_R=60;
C.addEventListener('touchstart',e=>{
  e.preventDefault();
  document.body.classList.add('touch');
  if(joyId===null){
    const t=e.changedTouches[0];
    joyId=t.identifier;joyOX=t.clientX;joyOY=t.clientY;
    joyX=0;joyY=0;jdx=0;jdy=0;joyActive=true;
    tapT=performance.now();tapX=t.clientX;tapY=t.clientY;
  }
},{passive:false});
C.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      let dx=t.clientX-joyOX,dy=t.clientY-joyOY;
      const d=Math.hypot(dx,dy);
      if(d>JOY_R){dx=dx/d*JOY_R;dy=dy/d*JOY_R;}
      jdx=dx;jdy=dy;joyX=dx/JOY_R;joyY=dy/JOY_R;
    }
  }
},{passive:false});
function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      joyId=null;joyActive=false;joyX=0;joyY=0;jdx=0;jdy=0;
      // Quick stationary tap = same action as Space (start / retry / dash)
      if(performance.now()-tapT<300&&Math.hypot(t.clientX-tapX,t.clientY-tapY)<12)onAction();
    }
  }
}
C.addEventListener('touchend',joyEnd);
C.addEventListener('touchcancel',joyEnd);
C.addEventListener('contextmenu',e=>e.preventDefault());
dashBtn.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();document.body.classList.add('touch');onAction();},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});

// ---- Pause button + auto-pause ----
pauseBtn.addEventListener('click',e=>{e.preventDefault();togglePause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!dead&&!paused)togglePause();});

// ---- Canvas fit (preserve 600x700 aspect) ----
function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  C.style.width=(W*s)+'px';C.style.height=(H*s)+'px';
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();

loop();
</script>
</body>
</html>
