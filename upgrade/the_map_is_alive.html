<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Map Is Alive</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@300;700;900&family=Space+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#050c14;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'Raleway',sans-serif;color:#c0e8ff;}
#wrap{position:relative;}
canvas{display:block;}
#hud{position:absolute;top:0;left:0;right:0;height:42px;background:#06090fdd;border-bottom:1px solid #1a3a5a;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:5;pointer-events:none;}
.hi{display:flex;flex-direction:column;align-items:center;}
.hl{font-size:8px;letter-spacing:3px;color:#1a4060;text-transform:uppercase;}
.hv{font-size:15px;font-weight:900;color:#88ccff;}
#timerBar{position:absolute;bottom:0;left:0;right:0;height:3px;background:#0a1a2a;}
#timerFill{height:100%;background:linear-gradient(90deg,#00ffaa,#ffcc00,#ff4422);width:100%;transition:width .1s linear;}
#exitInfo{position:absolute;top:46px;right:8px;background:#06090fee;border:1px solid #1a3a5a;padding:5px 10px;font-family:'Space Mono',monospace;font-size:10px;color:#ff8844;min-width:110px;z-index:5;pointer-events:none;}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050c14ee;z-index:20;}
#msg h1{font-size:50px;font-weight:900;letter-spacing:2px;line-height:1.1;margin-bottom:10px;text-align:center;}
#msg p{color:#2a5a7a;margin-bottom:22px;font-size:13px;text-align:center;line-height:2.2;}
.sbtn{background:#081420;border:2px solid #1a5080;color:#66aadd;padding:11px 34px;font-family:'Raleway',sans-serif;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer;transition:all .2s;}
.sbtn:hover{background:#0d2030;border-color:#44aaff;box-shadow:0 0 16px #2266aa66;}
/* ---- round-5 upgrades: touch chrome, chronicle, pause ---- */
canvas{touch-action:none;}
body{user-select:none;-webkit-user-select:none;}
#toolbar{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:30;}
.tbtn{width:44px;height:44px;font-size:20px;line-height:1;background:#0a1828ee;border:2px solid #1a5080;color:#66aadd;border-radius:10px;cursor:pointer;touch-action:manipulation;}
.tbtn:active{background:#14405f;}
#dpad{position:fixed;left:12px;bottom:12px;display:none;grid-template-areas:'. u .' 'l . r' '. d .';gap:8px;z-index:30;}
.dbtn{width:64px;height:64px;border-radius:14px;background:#0a1828dd;border:2px solid #1a5080;color:#66aadd;font-size:24px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;}
.dbtn:active{background:#14405f;border-color:#44aaff;}
#chron{position:fixed;right:10px;bottom:10px;width:300px;max-height:38vh;display:none;flex-direction:column;background:#06090ff2;border:1px solid #1a3a5a;border-radius:8px;z-index:31;overflow:hidden;font-family:'Space Mono',monospace;}
#chronTabs{display:flex;border-bottom:1px solid #1a3a5a;}
.ctab{flex:1;background:none;border:none;color:#2a5a7a;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;padding:12px 0;cursor:pointer;}
.ctab.on{color:#88ccff;background:#0a1828;}
#chronX{background:none;border:none;color:#2a5a7a;font-size:14px;padding:0 14px;cursor:pointer;}
#chronBody{overflow-y:auto;padding:8px 10px;font-size:11px;line-height:1.7;color:#9fd0e8;min-height:60px;}
.clog b{color:#ffcc44;font-weight:normal;}
.clog.dim{color:#2a5a7a;}
.disc{display:flex;flex-direction:column;padding:5px 2px;border-bottom:1px solid #0e2233;color:#2a5a7a;}
.disc.got{color:#88ccff;}
.disc em{font-style:normal;font-size:10px;color:#1a4060;}
.disc.got em{color:#4a7a99;}
#pauseOv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#050c14d9;z-index:40;text-align:center;}
#pauseOv h2{font-size:40px;font-weight:900;letter-spacing:4px;color:#88ccff;margin-bottom:8px;}
#pauseOv p{color:#2a5a7a;margin-bottom:20px;font-size:13px;}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#0a1828f2;border:1px solid #44aaff;color:#aaddff;font-family:'Space Mono',monospace;font-size:12px;padding:10px 18px;border-radius:8px;z-index:50;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
@media (max-width:480px){#chron{left:10px;width:auto;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="hi"><div class="hl">LEVEL</div><div class="hv" id="hLvl">-</div></div>
    <div class="hi"><div class="hl">TIME</div><div class="hv" id="hTime">-</div></div>
    <div class="hi"><div class="hl">MOVES</div><div class="hv" id="hMoves">0</div></div>
    <div class="hi"><div class="hl">EXITS FOUND</div><div class="hv" id="hFound">0</div></div>
    <div id="timerBar"><div id="timerFill"></div></div>
  </div>
  <div id="exitInfo">EXIT<br><span id="eiTxt" style="color:#ffcc44">-</span></div>
  <div id="msg">
    <h1 style="color:#3388cc">THE MAP<br>IS ALIVE</h1>
    <p>Walls slide. Doors open and close.<br>Reach the exit — <span style="color:#ffcc00">before it escapes.</span><br><br><span id="ctlHint">WASD or Arrow Keys</span></p>
    <button class="sbtn" onclick="startGame()">ENTER THE MAP</button>
    <a href="index.html" style="display:inline-block;margin-top:10px;color:#2a5a7a;font-size:10px;letter-spacing:2px;text-decoration:none;font-family:monospace;">← BACK TO ARCADE</a>
  </div>
</div>
<div id="toolbar">
  <button id="pbBtn" class="tbtn" onclick="setPaused(!paused)" title="Pause (P)">⏸</button>
  <button class="tbtn" onclick="toggleChron()" title="Chronicle">📜</button>
</div>
<div id="dpad">
  <button class="dbtn" data-k="ArrowUp" style="grid-area:u">▲</button>
  <button class="dbtn" data-k="ArrowLeft" style="grid-area:l">◀</button>
  <button class="dbtn" data-k="ArrowRight" style="grid-area:r">▶</button>
  <button class="dbtn" data-k="ArrowDown" style="grid-area:d">▼</button>
</div>
<div id="chron">
  <div id="chronTabs">
    <button id="tabLog" class="ctab on" onclick="chronTabGo('log')">LOG</button>
    <button id="tabDisc" class="ctab" onclick="chronTabGo('disc')">★ <span id="discCount">0</span>/8</button>
    <button id="chronX" onclick="toggleChron(false)">✕</button>
  </div>
  <div id="chronBody"></div>
</div>
<div id="pauseOv"><div><h2>PAUSED</h2><p>The map holds its breath.</p><button class="sbtn" onclick="setPaused(false)">RESUME</button></div></div>
<div id="toast"></div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const T=34, COLS=20, ROWS=13;
const CW=COLS*T, CH=ROWS*T;

// time-of-day: the map breathes through phases (~40s each)
const PHASES=[
  {name:'DAWN', icon:'🌅', tint:'rgba(255,150,60,0.10)', door:1,    slide:1,    exit:1},
  {name:'DAY',  icon:'☀️', tint:'rgba(0,0,0,0)',          door:1,    slide:1,    exit:1},
  {name:'DUSK', icon:'🌇', tint:'rgba(140,60,180,0.12)',  door:1.1,  slide:1.05, exit:1.1},
  {name:'NIGHT',icon:'🌙', tint:'rgba(20,40,120,0.22)',   door:1.34, slide:1.15, exit:1.25},
];
const PHASE_LEN=2400; // frames per phase
function phaseIdx(){return Math.floor(phaseFrame/PHASE_LEN)%4;}

// ============================================================
// CANVAS + HUD LAYOUT
// ============================================================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
cv.width=CW; cv.height=CH;
document.getElementById('wrap').style.cssText=
  'position:relative;width:'+CW+'px;height:'+(CH+42)+'px;';
cv.style.marginTop='42px';

// fit the fixed-size game to any screen, preserving aspect
function fitScreen(){
  // shrink-to-fit on small screens; never upscale (keeps desktop rendering pixel-identical)
  const s=Math.min(1, window.innerWidth/CW, window.innerHeight/(CH+42));
  const w=document.getElementById('wrap');
  w.style.transform='scale('+s+')';
  w.style.transformOrigin='center center';
}
window.addEventListener('resize',fitScreen);
window.addEventListener('orientationchange',function(){setTimeout(fitScreen,150);});
fitScreen();

// ============================================================
// GAME STATE — all declared, all safe defaults
// ============================================================
const K={};
// persistent save (migrates legacy 'maplevel_best', never wipes)
const SAVE_KEY='pfg2_the_map_is_alive';
let save={best:0,stats:{wisps:0},discs:{}};
try{
  const old=localStorage.getItem('maplevel_best');
  if(old)save.best=parseInt(old,10)||0;
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){const s=JSON.parse(raw);if(s&&typeof s==='object')save=Object.assign(save,s);}
  save.stats=Object.assign({wisps:0},save.stats||{});
  save.discs=save.discs||{};
  localStorage.setItem(SAVE_KEY,JSON.stringify(save));
  if(old!==null)localStorage.removeItem('maplevel_best');
}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

let gameState = 'menu';
let level=1, found=0, moves=0;
let bestLevel=save.best;
let timeLeft=30, maxTime=30, gameFrame=0;
let px=2, py=2;        // player grid coords
let grid=null;         // ROWS×COLS array, 1=solid
let sliders=[];        // moving wall groups
let doors=[];          // toggling walls
let exitX=COLS-3, exitY=ROWS-3;
let exitCd=0;          // frames until exit reappears (0 = visible)
let exitTtl=80;        // frames until exit moves
let parts=[];          // particles
let moveCd=0;
let paused=false;      // standard-kit pause flag
let phaseFrame=0, sliderFrame=0, lastPhase=-1; // time-of-day clocks
let exitTtlMax=90;
let wisps=[], wispTimer=480;   // living time-wisps
let levelTime=0;       // frames elapsed this level (chronicle timestamps)
let chronLog=[], chronOpen=false, chronTab='log';
const MOVE_FRAMES=8;

// ============================================================
// CHRONICLE — event log + persistent discoveries
// ============================================================
const DISCS={
  woke:        {name:'Woke the Map', desc:'Take your first step'},
  wisp1:       {name:'Wisp Touched',desc:'Catch a time wisp (+3s)'},
  wispfriend:  {name:'Wispfriend',  desc:'Catch 5 wisps in total'},
  speedrunner: {name:'Speedrunner', desc:'Clear a level with 20s+ left'},
  closecall:   {name:'Close Call',  desc:'Reach the exit moments before it moves'},
  nightfisher: {name:'Night Fisher',desc:'Catch a wisp under moonlight'},
  cartographer:{name:'Cartographer',desc:'Reach level 5'},
  escaped:     {name:'Map Escaped', desc:'Clear all 12 levels'},
};
function unlock(id){
  if(save.discs[id])return;
  save.discs[id]=Date.now(); persist();
  const d=DISCS[id];
  toast('★ Discovered: '+d.name);
  clog('★ <b>'+d.name+'</b> — '+d.desc);
  const dc=document.getElementById('discCount');
  if(dc)dc.textContent=Object.keys(save.discs).length;
}
function clog(m){
  const mm=String(Math.floor(levelTime/3600)).padStart(2,'0');
  const ss=String(Math.floor(levelTime/60)%60).padStart(2,'0');
  chronLog.push('L'+level+' '+mm+':'+ss+' — '+m);
  if(chronLog.length>40)chronLog.shift();
  if(chronOpen&&chronTab==='log')renderChron();
}
let toastT=null;
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.style.opacity='1';
  clearTimeout(toastT); toastT=setTimeout(function(){t.style.opacity='0';},2200);
}
function toggleChron(force){
  chronOpen=(typeof force==='boolean')?force:!chronOpen;
  document.getElementById('chron').style.display=chronOpen?'flex':'none';
  if(chronOpen)renderChron();
}
function chronTabGo(t){
  chronTab=t;
  document.getElementById('tabLog').classList.toggle('on',t==='log');
  document.getElementById('tabDisc').classList.toggle('on',t==='disc');
  renderChron();
}
function renderChron(){
  const b=document.getElementById('chronBody');
  if(chronTab==='log'){
    b.innerHTML=chronLog.length
      ? chronLog.slice().reverse().map(function(l){return '<div class="clog">'+l+'</div>';}).join('')
      : '<div class="clog dim">The map has done nothing worth noting… yet.</div>';
  }else{
    b.innerHTML=Object.keys(DISCS).map(function(id){
      const got=save.discs[id], d=DISCS[id];
      return '<div class="disc'+(got?' got':'')+'"><span>'+(got?'★':'☆')+' '+d.name+'</span><em>'+d.desc+'</em></div>';
    }).join('');
  }
}

// ============================================================
// PAUSE — freezes the simulation cleanly
// ============================================================
function setPaused(v){
  if(gameState!=='play')return;
  paused=v;
  document.getElementById('pauseOv').style.display=v?'flex':'none';
  document.getElementById('pbBtn').textContent=v?'▶':'⏸';
  if(v)clog('The simulation freezes.');
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&gameState==='play'&&!paused)setPaused(true);
});

// ============================================================
// START / LOAD LEVEL
// ============================================================
function startGame(){
  document.getElementById('msg').style.display='none';
  level=1; found=0;
  document.getElementById('hFound').textContent=0;
  phaseFrame=0; sliderFrame=0; lastPhase=-1;
  chronLog=[]; levelTime=0;
  clog('You enter the living map.');
  loadLevel();
}

function loadLevel(){
  gameState='play'; gameFrame=0; moves=0; parts=[];
  document.getElementById('hMoves').textContent=0;
  document.getElementById('hLvl').textContent=level;
  maxTime=Math.max(20,42-level*1.6)|0;
  timeLeft=maxTime;
  moveCd=0;
  paused=false;
  document.getElementById('pauseOv').style.display='none';
  document.getElementById('pbBtn').textContent='⏸';
  levelTime=0;
  wisps=[]; wispTimer=480;
  buildGrid();
  px=2; py=2;
  placeExit();
  spawnWisp(); spawnWisp();
}

// ============================================================
// GRID BUILDER
// ============================================================
function buildGrid(){
  // empty grid
  grid=Array.from({length:ROWS},()=>new Array(COLS).fill(0));
  // border
  for(let c=0;c<COLS;c++){grid[0][c]=1;grid[ROWS-1][c]=1;}
  for(let r=0;r<ROWS;r++){grid[r][0]=1;grid[r][COLS-1]=1;}
  // random interior walls
  const density=0.13+level*.013;
  for(let r=1;r<ROWS-1;r++)
    for(let c=1;c<COLS-1;c++)
      if(Math.random()<density) grid[r][c]=1;
  // carve start area
  for(let c=1;c<COLS-1;c++) grid[1][c]=0;
  for(let r=1;r<ROWS-1;r++) grid[r][1]=0;
  grid[2][2]=0; grid[2][3]=0; grid[3][2]=0;
  // carve exit area
  grid[ROWS-2][COLS-2]=0; grid[ROWS-2][COLS-3]=0; grid[ROWS-3][COLS-2]=0;
  // rebuild border
  for(let c=0;c<COLS;c++){grid[0][c]=1;grid[ROWS-1][c]=1;}
  for(let r=0;r<ROWS;r++){grid[r][0]=1;grid[r][COLS-1]=1;}

  // sliders: segments that oscillate
  sliders=[];
  const ns=1+Math.floor(level/2);
  for(let i=0;i<ns;i++){
    const horiz=Math.random()<.5;
    if(horiz){
      const r=2+Math.floor(Math.random()*(ROWS-4));
      const c=3+Math.floor(Math.random()*(COLS-8));
      sliders.push({c,r,len:2+Math.floor(Math.random()*2),horiz:true,
        spd:.016+level*.002, phase:Math.random()*Math.PI*2, range:2+Math.floor(Math.random()*2)});
    } else {
      const c=2+Math.floor(Math.random()*(COLS-4));
      const r=3+Math.floor(Math.random()*(ROWS-8));
      sliders.push({c,r,len:2+Math.floor(Math.random()*2),horiz:false,
        spd:.016+level*.002, phase:Math.random()*Math.PI*2, range:2+Math.floor(Math.random()*2)});
    }
  }

  // doors
  doors=[];
  const nd=Math.floor(level/2);
  for(let i=0;i<nd;i++){
    let c,r,t=0;
    do{c=3+Math.floor(Math.random()*(COLS-6));r=3+Math.floor(Math.random()*(ROWS-6));t++;}
    while(t<30&&grid[r][c]===1);
    doors.push({c,r,open:true,timer:0,period:85+Math.floor(Math.random()*80)});
  }
}

// ============================================================
// SLIDER / DOOR SETS
// ============================================================
function getSliderSet(){
  const s=new Set();
  for(const sl of sliders){
    const off=Math.round(Math.sin(sliderFrame*sl.spd+sl.phase)*sl.range);
    for(let i=0;i<sl.len;i++){
      const sc=sl.horiz ? sl.c+i : sl.c+off;
      const sr=sl.horiz ? sl.r+off : sl.r+i;
      if(sr>=0&&sr<ROWS&&sc>=0&&sc<COLS) s.add(sr*COLS+sc);
    }
  }
  return s;
}

function getDoorSet(){
  const s=new Set();
  for(const d of doors) if(!d.open) s.add(d.r*COLS+d.c);
  return s;
}

function isSolid(c,r,ss,ds){
  if(c<0||c>=COLS||r<0||r>=ROWS) return true;
  if(grid[r][c]===1) return true;
  if(ss&&ss.has(r*COLS+c)) return true;
  if(ds&&ds.has(r*COLS+c)) return true;
  return false;
}

// ============================================================
// EXIT PLACEMENT
// ============================================================
function placeExit(){
  let ec,er,t=0;
  const ss=getSliderSet(), ds=getDoorSet();
  do{
    ec=COLS-2-Math.floor(Math.random()*4);
    er=ROWS-2-Math.floor(Math.random()*4);
    t++;
  } while(t<80&&(isSolid(ec,er,ss,ds)||(ec===px&&er===py)));
  exitX=ec; exitY=er;
  exitTtl=90+Math.floor(Math.random()*50);
  exitTtlMax=exitTtl;
  exitCd=0;
}

// living time-wisps: autonomous drifters the player can catch for +3s
function spawnWisp(){
  let c=2,r=2,t=0;
  do{
    c=1+Math.floor(Math.random()*(COLS-2));
    r=1+Math.floor(Math.random()*(ROWS-2));
    t++;
  }while(t<60&&(grid[r][c]===1||(c===px&&r===py)));
  wisps.push({x:c*T+T/2,y:r*T+T/2,tx:c,ty:r,retarget:0,seed:Math.random()*6.28});
}
function collectWisp(i){
  const w=wisps[i]; wisps.splice(i,1);
  burst(w.x,w.y,16,'#66ffee');
  timeLeft=Math.min(maxTime,timeLeft+3);
  save.stats.wisps++; persist();
  unlock('wisp1');
  if(save.stats.wisps>=5)unlock('wispfriend');
  if(phaseIdx()===3)unlock('nightfisher');
  clog('Caught a time wisp (+3s).');
  wispTimer=480+Math.floor(Math.random()*240);
}

// ============================================================
// UPDATE
// ============================================================
function update(){
  if(gameState!=='play'||!grid||paused) return;
  gameFrame++;
  levelTime++;

  // time-of-day clock; the map quickens at night
  phaseFrame++;
  const ph=PHASES[phaseIdx()];
  if(phaseIdx()!==lastPhase){
    lastPhase=phaseIdx();
    clog(ph.icon+' '+ph.name+' falls over the map.'+(lastPhase===3?' Doors and sliders quicken.':''));
  }
  sliderFrame+=ph.slide;

  // time
  timeLeft-=1/60;
  if(timeLeft<=0){timeLeft=0;gameDead("TIME'S UP");return;}
  document.getElementById('hTime').textContent=Math.ceil(timeLeft);
  document.getElementById('timerFill').style.width=(timeLeft/maxTime*100)+'%';

  // doors
  for(const d of doors){
    d.timer+=ph.door;
    if(d.timer>=d.period){d.timer=0;d.open=!d.open;}
  }

  const ss=getSliderSet(), ds=getDoorSet();

  // exit logic
  if(exitCd>0){
    exitCd--;
    if(exitCd===0){placeExit();clog('The exit resurfaces elsewhere.');}
    document.getElementById('eiTxt').textContent='MOVING...';
  } else {
    exitTtl-=ph.exit;
    if(exitTtl<=0){
      burst(exitX*T+T/2, exitY*T+T/2, 14, '#ffcc00');
      exitCd=28;
      document.getElementById('eiTxt').textContent='MOVING...';
      clog('The exit slipped away!');
    } else {
      document.getElementById('eiTxt').textContent='Moves in '+Math.ceil(exitTtl/60)+'s';
    }
    // win check
    if(exitCd===0&&px===exitX&&py===exitY){ gameWin(); return; }
  }

  // player movement
  if(moveCd>0){ moveCd--; return; }
  let dc=0,dr=0;
  if(K['ArrowLeft']||K['a'])dc=-1;
  else if(K['ArrowRight']||K['d'])dc=1;
  else if(K['ArrowUp']||K['w'])dr=-1;
  else if(K['ArrowDown']||K['s'])dr=1;

  if(dc||dr){
    const nc=px+dc, nr=py+dr;
    if(!isSolid(nc,nr,ss,ds)){
      px=nc; py=nr; moves++;
      if(moves===1)unlock('woke');
      document.getElementById('hMoves').textContent=moves;
      moveCd=MOVE_FRAMES;
    }
  }

  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.life--;p.a=p.life/p.ml;
    if(p.life<=0)parts.splice(i,1);
  }

  // living wisps drift through the map
  for(let i=wisps.length-1;i>=0;i--){
    const w=wisps[i];
    w.retarget--;
    const gx=w.tx*T+T/2, gy=w.ty*T+T/2;
    if((Math.abs(w.x-gx)<2&&Math.abs(w.y-gy)<2)||w.retarget<=0){
      const opts=[];
      if(w.tx>1&&grid[w.ty][w.tx-1]===0)opts.push([w.tx-1,w.ty]);
      if(w.tx<COLS-2&&grid[w.ty][w.tx+1]===0)opts.push([w.tx+1,w.ty]);
      if(w.ty>1&&grid[w.ty-1][w.tx]===0)opts.push([w.tx,w.ty-1]);
      if(w.ty<ROWS-2&&grid[w.ty+1][w.tx]===0)opts.push([w.tx,w.ty+1]);
      if(opts.length){const o=opts[Math.floor(Math.random()*opts.length)];w.tx=o[0];w.ty=o[1];}
      w.retarget=50+Math.floor(Math.random()*40);
    }
    const dx=gx-w.x, dy=gy-w.y, d=Math.hypot(dx,dy)||1, sp=Math.min(1.6,d);
    w.x+=dx/d*sp; w.y+=dy/d*sp;
    if(Math.abs(w.x-(px*T+T/2))<T*.55&&Math.abs(w.y-(py*T+T/2))<T*.55){collectWisp(i);continue;}
  }
  if(wisps.length<2){
    wispTimer--;
    if(wispTimer<=0){spawnWisp();wispTimer=480+Math.floor(Math.random()*240);clog('A time wisp drifts into the map.');}
  }
}

function gameWin(){
  found++;
  document.getElementById('hFound').textContent=found;
  burst(exitX*T+T/2, exitY*T+T/2, 30, '#ffcc00');
  if(timeLeft>=20)unlock('speedrunner');
  if(exitTtl<=30)unlock('closecall');
  if(level===5)unlock('cartographer');
  clog('Exit reached — level '+level+' cleared in '+moves+' moves.');
  level++;
  if(level>12){
    unlock('escaped');
    gameState='over';
    document.getElementById('eiTxt').textContent='-';
    document.getElementById('msg').style.display='flex';
    document.getElementById('msg').innerHTML=
      '<h1 style="color:#44ffcc;font-size:42px;font-weight:900;margin-bottom:10px;">MAP ESCAPED!</h1>'+
      '<p style="color:#2a5a7a">All 12 levels cleared!<br>Exits Found: '+found+'</p>'+
      '<button class="sbtn" onclick="level=1;found=0;startGame()">PLAY AGAIN</button>'+
      '<br><a href="index.html" style="display:inline-block;margin-top:8px;color:#2a5a7a;font-size:10px;letter-spacing:2px;text-decoration:none;font-family:monospace;">← BACK</a>';
    return;
  }
  // FIX: freeze play during the transition so the timer can't kill a won level
  gameState='inter';
  setTimeout(loadLevel,500);
}

function gameDead(reason){
  gameState='over';
  if(level>bestLevel){bestLevel=level;save.best=bestLevel;persist();}
  clog('The map claimed you — '+reason+'.');
  document.getElementById('eiTxt').textContent='-';
  document.getElementById('msg').style.display='flex';
  document.getElementById('msg').innerHTML=
    '<h1 style="color:#ff4422;font-size:46px;font-weight:900;margin-bottom:10px;">'+reason+'</h1>'+
    '<p style="color:#2a5a7a">Level '+level+(level>=bestLevel&&level>1?' 🏆 DEEPEST YET!':'<br>Best: '+bestLevel)+'<br>Moves: '+moves+'</p>'+
    '<button class="sbtn" onclick="level=1;found=0;startGame()">TRY AGAIN</button>'+
    '<br><a href="index.html" style="display:inline-block;margin-top:8px;color:#2a5a7a;font-size:10px;letter-spacing:2px;text-decoration:none;font-family:monospace;">← BACK</a>';
}

function burst(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*4+1;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:25+Math.random()*20,ml:45,col,a:1,r:Math.random()*2.5+1});
  }
}

// ============================================================
// DRAW
// ============================================================
function draw(){
  ctx.clearRect(0,0,CW,CH);

  // always draw bg
  ctx.fillStyle='#060e18'; ctx.fillRect(0,0,CW,CH);

  if(gameState==='menu'||!grid) return;

  const ss=getSliderSet(), ds=getDoorSet();

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const wx=c*T, wy=r*T;
      const key=r*COLS+c;
      const isSlider=ss.has(key);
      const isDoor=ds.has(key);
      const solid=isSolid(c,r,ss,ds);

      if(solid){
        if(isSlider){
          const pulse=.25+Math.sin(gameFrame*.13+c*.3+r*.2)*.18;
          ctx.fillStyle=`rgba(18,65,105,${.7+pulse})`; ctx.fillRect(wx,wy,T,T);
          ctx.strokeStyle=`rgba(36,130,210,${.5+pulse})`; ctx.lineWidth=1.5;
          ctx.strokeRect(wx+1,wy+1,T-2,T-2);
          // direction arrows
          ctx.fillStyle=`rgba(80,180,255,${.3+pulse})`;
          ctx.font='11px sans-serif'; ctx.textAlign='center';
          ctx.fillText('↔',wx+T/2,wy+T/2+4);
        } else if(isDoor){
          ctx.fillStyle='#2a0e04'; ctx.fillRect(wx,wy,T,T);
          ctx.strokeStyle='#aa3300'; ctx.lineWidth=1.5;
          ctx.strokeRect(wx+.5,wy+.5,T-1,T-1);
          ctx.fillStyle='#ff5500'; ctx.font='13px sans-serif'; ctx.textAlign='center';
          ctx.fillText('✖',wx+T/2,wy+T/2+5);
        } else {
          ctx.fillStyle='#0a1824'; ctx.fillRect(wx,wy,T,T);
          ctx.strokeStyle='#122030'; ctx.lineWidth=.7;
          ctx.strokeRect(wx,wy,T,T);
        }
      } else {
        ctx.fillStyle='#040c14'; ctx.fillRect(wx,wy,T,T);
        ctx.strokeStyle='#08121e'; ctx.lineWidth=.3;
        ctx.strokeRect(wx,wy,T,T);
      }
    }
  }
  ctx.textAlign='left';

  // time-of-day tint + phase label
  const phd=PHASES[phaseIdx()];
  if(phd.tint!=='rgba(0,0,0,0)'){ctx.fillStyle=phd.tint;ctx.fillRect(0,0,CW,CH);}
  ctx.fillStyle='#7fb8dd';ctx.font='11px "Space Mono",monospace';
  ctx.fillText(phd.icon+' '+phd.name,10,18);

  // exit
  if(exitCd===0){
    const ex=exitX*T, ey=exitY*T;
    const urgency=Math.max(0, 1-exitTtl/60);
    const pulse=.5+Math.sin(gameFrame*.13)*.5;
    const ecol=urgency>.5
      ? `rgb(255,${Math.round(80*(1-urgency))},0)`
      : '#ffcc00';
    ctx.shadowColor=ecol; ctx.shadowBlur=18*pulse;
    ctx.fillStyle=ecol+'22'; ctx.fillRect(ex,ey,T,T);
    ctx.strokeStyle=ecol; ctx.lineWidth=2;
    ctx.strokeRect(ex+1,ey+1,T-2,T-2);
    ctx.fillStyle=ecol; ctx.font='18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('◈',ex+T/2,ey+T/2+7);
    // countdown arc
    if(exitTtl>0){
      ctx.beginPath();
      ctx.arc(ex+T/2,ey+T/2,T*.52,-Math.PI/2,-Math.PI/2+Math.PI*2*(exitTtl/exitTtlMax));
      ctx.strokeStyle=ecol+'88'; ctx.lineWidth=2.5; ctx.stroke();
    }
    ctx.shadowBlur=0; ctx.textAlign='left';
  }

  // wisps
  for(const w of wisps){
    const bob=Math.sin(gameFrame*.09+w.seed)*2;
    ctx.shadowColor='#66ffee'; ctx.shadowBlur=12;
    ctx.fillStyle='#66ffee22';
    ctx.beginPath(); ctx.arc(w.x,w.y+bob,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#aafff2';
    ctx.beginPath(); ctx.arc(w.x,w.y+bob,4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }

  // particles
  for(const p of parts){
    ctx.globalAlpha=p.a; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // player
  const plx=px*T, ply=py*T;
  ctx.shadowColor='#3399ff'; ctx.shadowBlur=14;
  ctx.fillStyle='#1144aa'; ctx.fillRect(plx+2,ply+2,T-4,T-4);
  ctx.fillStyle='#4488dd'; ctx.fillRect(plx+5,ply+5,T-10,T-10);
  ctx.fillStyle='#aaddff'; ctx.beginPath();
  ctx.arc(plx+T/2,ply+T/2,3.5,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
}

// ============================================================
// INPUT + LOOP
// ============================================================
document.addEventListener('keydown',e=>{
  K[e.key]=true;
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){
    if(gameState==='play')setPaused(!paused);
  }
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup',e=>{K[e.key]=false;});

// touch controls: d-pad + swipe, wired into the same K state as the keyboard
(function(){
  const isTouch=('ontouchstart'in window)||navigator.maxTouchPoints>0;
  const dp=document.getElementById('dpad');
  dp.style.display=isTouch?'grid':'none';
  if(isTouch){
    const hint=document.getElementById('ctlHint');
    if(hint)hint.textContent='Swipe, D-pad, or Arrow Keys';
  }
  document.getElementById('discCount').textContent=Object.keys(save.discs).length;
  dp.querySelectorAll('.dbtn').forEach(function(b){
    const k=b.getAttribute('data-k');
    const dn=function(e){e.preventDefault();K[k]=true;};
    const up=function(e){e.preventDefault();K[k]=false;};
    b.addEventListener('pointerdown',dn);
    b.addEventListener('pointerup',up);
    b.addEventListener('pointercancel',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('contextmenu',function(e){e.preventDefault();});
  });
  let swp=null;
  cv.addEventListener('touchstart',function(e){
    const t=e.changedTouches[0];swp={x:t.clientX,y:t.clientY,dir:null};
  },{passive:true});
  cv.addEventListener('touchmove',function(e){
    e.preventDefault(); // stop pull-to-refresh / scroll while playing
    if(!swp)return;
    const t=e.changedTouches[0];
    const dx=t.clientX-swp.x, dy=t.clientY-swp.y;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    const nd=Math.abs(dx)>Math.abs(dy)?(dx>0?'ArrowRight':'ArrowLeft'):(dy>0?'ArrowDown':'ArrowUp');
    if(swp.dir!==nd){if(swp.dir)K[swp.dir]=false;swp.dir=nd;K[nd]=true;}
  },{passive:false});
  const swpEnd=function(){if(swp&&swp.dir)K[swp.dir]=false;swp=null;};
  cv.addEventListener('touchend',swpEnd);
  cv.addEventListener('touchcancel',swpEnd);
})();

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
